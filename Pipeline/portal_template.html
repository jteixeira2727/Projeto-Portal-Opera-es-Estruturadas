    ? `<div class="topics-fonte"><span class="oblig-date">Ata mais recente: ${fmtDate(op.doc_obligations_latest_ata_data)}</span> <span class="oblig-source">Fonte: ${op.doc_obligations_latest_ata_arquivo||''}</span></div>`
    : '';
  // revisorNota (observacao_reviewer) removida da renderização (49ª rodada, pedido explícito do
  // usuário: "eu te falei para tirar esse aviso de todas as operações.. vc n ajustou em todas" --
  // mesmo tratamento já dado ao metodologia_nota na 47ª rodada). O texto continua em
  // op.doc_obligations_nota_revisor pra quem olhar o JSON/pipeline diretamente.

  const currentHtml = !op.doc_obligations_reviewed
    ? '<div class="chart-empty">Atas/aditamentos desta operação ainda não foram revisados nesta rodada de indexação.</div>'
    : (current.length ? current.map(o=>obligItemCardHtml(o)).join('') : '<div class="chart-empty">Nenhuma obrigação com prazo específico identificada na ata mais recente revisada.</div>');

  const historicoHtml = historico.length
    ? historico.map(o=>obligItemCardHtml(o, {muted:true})).join('')
    : '<div class="chart-empty">Sem itens de atas anteriores registrados.</div>';

  const atasTabHtml = `
    <div class="panel">
      <div class="panel-head"><h2>Pendências da Ata Mais Recente</h2></div>
      <div class="panel-body">
        ${ataInfo}
        ${currentHtml}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><h2>Histórico de Atas Anteriores</h2><span class="meta">contexto — já superado pela ata mais recente</span></div>
      <div class="panel-body">${historicoHtml}</div>
    </div>`;

  const docsTabHtml = `
    <div class="panel">
      <div class="panel-head"><h2>Documentos da Operação</h2><span class="meta">o que compõe a operação vs. o que está na pasta</span></div>
      <div class="panel-body">${docInstrumentosHtml(op)}</div>
    </div>`;

  view.innerHTML = `
    <button id="docobrig-back" class="back-btn">${BACK_ARROW_SVG}<span>${name}</span></button>
    <div id="detail-head">
      <div>
        <h2>Atas e Documentos da Operação</h2>
        <div class="sub"><b>${name}</b></div>
      </div>
    </div>
    <div id="obrig-subsections">
      ${Object.keys(DOC_OBRIG_TABS).map(k=>`
        <button class="obrig-subsection-tab ${docObrigSubTab===k?'active':''}" data-docobrigsub="${k}">${DOC_OBRIG_TABS[k].title}</button>
      `).join('')}
    </div>
    ${docObrigSubTab==='atas' ? atasTabHtml : docsTabHtml}
  `;

  document.getElementById('docobrig-back').addEventListener('click', ()=>{
    showDetail(name);
  });
  view.querySelectorAll('#obrig-subsections .obrig-subsection-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      docObrigSubTab = btn.dataset.docobrigsub;
      renderDocObrigSubview(name);
    });
  });
  window.scrollTo(0,0);
  document.getElementById('main').scrollTo(0,0);
  document.getElementById('sidebar').classList.remove('open');
}

function docChatNormalize(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'');
}
const DOC_CHAT_STOPWORDS = new Set(['a','o','as','os','de','da','do','das','dos','e','é','em','um','uma','uns','umas','para','por','com','sem','que','se','ao','aos','à','às','no','na','nos','nas','como','mais','menos','sobre','entre','sob','este','esta','isso','isto','qual','quais','quando','onde','quem','foi','são','ser','tem','the','and','or','of','in','on','to','is','was','are','for'
]);
function docChatTokenize(s){
  return docChatNormalize(s).split(/[^a-z0-9]+/).filter(t=>t.length>2 && !DOC_CHAT_STOPWORDS.has(t));
}
function docChatPickChunks(question, chunks, maxChars, maxChunks){
  const qTokens = new Set(docChatTokenize(question));
  if(!qTokens.size || !chunks || !chunks.length) return [];
  const scored = [];
  for(const c of chunks){
    if(!c._tokens) c._tokens = docChatTokenize(c.text);
    // conta termos DISTINTOS da pergunta que aparecem (critério principal) e a
    // contagem bruta só como desempate — evita que um documento que repete um
    // único termo (ex. nome de parte definida, repetido em cada cláusula)
    // afogue documentos mais relevantes que citam vários termos da pergunta juntos
    const matched = new Set();
    let count = 0;
    for(const t of c._tokens){ if(qTokens.has(t)){ matched.add(t); count++; } }
    if(matched.size>0) scored.push({c, distinct: matched.size, count});
  }
  scored.sort((a,b)=> b.distinct - a.distinct || b.count - a.count);
  const picked = [];
  let total = 0;
  const perFile = new Map();
  const MAX_PER_FILE = 3; // garante diversidade entre documentos, não só o mais "denso"
  for(const {c} of scored){
    if(picked.length>=maxChunks) break;
    const n = perFile.get(c.filename) || 0;
    if(n>=MAX_PER_FILE) continue;
    if(picked.length>0 && total + c.text.length > maxChars) break;
    picked.push(c);
    total += c.text.length;
    perFile.set(c.filename, n+1);
  }
  return picked;
}
// inferDocDate (pedido do usuário: "quero que a IA entenda quais foram as últimas atas"):
// a maioria dos arquivos de ata/aditamento desta pasta tem a data no próprio nome
// (ex.: "AGT 16.07.2026.pdf", "AGT_Local Frio 08.02.2021..."), mas o texto do chunk sozinho
// não deixa claro pro modelo qual documento é mais recente sem ele ter que ler e comparar
// datas dentro do conteúdo jurídico -- por isso construímos um manifesto explícito
// (nome + data inferida, já ordenado) e mandamos ele SEMPRE junto da pergunta (ver
// buildDocContextText), não só quando os chunks batem por palavra-chave.
function inferDocDate(filename){
  const m = filename.match(/\b(\d{2})[.\-\/](\d{2})[.\-\/](\d{4})\b/);
  if(!m) return null;
  const [_, dd, mm, yyyy] = m;
  const iso = `${yyyy}-${mm}-${dd}`;
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return null;
  return iso;
}

function buildDocManifestText(op){
  const files = op.doc_files || [];
  const withDates = files.map(f=>({f, date: inferDocDate(f)}));
  withDates.sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  return withDates.map(({f,date})=> date ? `- ${f} (data: ${fmtDate(date)})` : `- ${f} (data não identificada pelo nome do arquivo)`).join('\n');
}

// buildObligationsContextText (mesma lógica de obligationStatusInfo, mas em texto pra
// contexto do chat): dá pro agente responder direto "tem pendência?" sem precisar
// re-descobrir isso via busca por palavra-chave nos chunks -- usa a MESMA curadoria que already
// aparece na sub-página "Leitura de Atas e Aditamentos" e na aba Acompanhamento > Via
// Assembleia, pra não ter 2 respostas diferentes pra mesma pergunta dependendo de onde o
// usuário olha.
// buildObligationsContextText (correção: "não faz sentido trazer uma obrigação identificada
// de uma ata antiga... se uma ata aconteceu recentemente, essas obrigações antigas já foram
// superadas"): o chat agora recebe as ATUAIS (da ata mais recente) separadas do HISTÓRICO —
// mesma separação já aplicada no painel/sub-página — pra nunca responder "tem pendência" (ou
// "não tem") citando uma obrigação de uma ata velha como se fosse ativa hoje.
function buildObligationsContextText(op){
  if(!op.doc_obligations_reviewed) return null;
  const current = op.doc_obligations_current || [];
  const historico = op.doc_obligations_historico || [];
  const ataLine = op.doc_obligations_latest_ata_data
    ? `Ata mais recente identificada: ${op.doc_obligations_latest_ata_arquivo||''} (${fmtDate(op.doc_obligations_latest_ata_data)}).`
    : 'Data da ata mais recente não identificada.';
  const fmtItem = (o,i)=>{
    const st = obligationStatusInfo(o);
    const docLine = o.documento_cumprimento ? `documento de cumprimento encontrado: ${o.documento_cumprimento}` : 'NENHUM documento de cumprimento encontrado na pasta';
    return `${i+1}. [${st.label}] ${o.descricao} (fonte: ${o.fonte_arquivo}${o.fonte_data?', '+fmtDate(o.fonte_data):''}${o.prazo?'; prazo: '+fmtDate(o.prazo):''}; ${docLine})${o.nota?' — Nota: '+o.nota:''}`;
  };
  const currentText = current.length ? current.map(fmtItem).join('\n') : 'Nenhuma obrigação com prazo específico em aberto identificada na ata mais recente.';
  const historicoText = historico.length ? historico.map(fmtItem).join('\n') : '(nenhum item de ata anterior registrado)';
  return `${ataLine}\n\nPENDÊNCIAS ATUAIS (da ata mais recente — o que importa pra responder "tem pendência hoje?"):\n${currentText}\n\nHISTÓRICO (atas anteriores, já superadas pela mais recente — usar só como contexto/background, NUNCA como pendência ativa):\n${historicoText}`;
}

// buildInstrumentosContextText (49ª rodada, pedido explícito do usuário: "Agora que estamos
// trazendo por [+de] portas as informações ele deveria ter mais conhecimento e propriedade para
// contextualizar") -- até aqui o chat só recebia a lista de OBRIGAÇÕES (obligations_data.json).
// A outra curadoria manual que o portal já tem -- o mapeamento de INSTRUMENTOS/aditamentos por
// operação (documents_meta.json, op.doc_instrumentos, mesma fonte da aba "Documentos da
// Operação") -- nunca chegava ao chat: perguntas tipo "quantos aditamentos tem o Termo de
// Securitização?" ou "esse instrumento tá completo na pasta?" dependiam só de busca por
// palavra-chave nos trechos soltos, que não é confiável pra contar/enumerar. Agora essa
// curadoria (já checada contra a pasta real) também vira texto de contexto -- mesmo princípio
// de buildObligationsContextText: uma curadoria só, reaproveitada em vez de deixar o modelo
// redescobrir (e errar) o que já sabemos.
function buildInstrumentosContextText(op){
  const di = op.doc_instrumentos;
  if(!di || !di.instrumentos || !di.instrumentos.length) return null;
  const lines = di.instrumentos.map(instr=>{
    const nome = instr.nome_curto ? `${instr.nome_curto} ("${instr.nome}")` : instr.nome;
    const origTxt = instr.data_original
      ? `original de ${fmtDate(instr.data_original)}${instr.original_presente_na_pasta ? ', presente na pasta' : ' -- AUSENTE da pasta'}`
      : (instr.original_presente_na_pasta ? 'original presente na pasta (data não confirmada)' : 'original não identificado ou ausente da pasta');
    const adits = (instr.aditamentos_conhecidos||[]).map(a=>{
      const dataTxt = a.data ? fmtDate(a.data) : 's/ data confirmada';
      return `${a.numero}º Aditamento (${dataTxt})${a.presente_na_pasta ? ', presente na pasta' : ', AUSENTE da pasta'}`;
    });
    const aditTxt = adits.length ? adits.join('; ') : 'nenhum aditamento conhecido';
    const statusTxt = (instr.completo ? 'COMPLETO na pasta (original + todos os aditamentos conhecidos)' : (instr.gap || 'incompleto')).replace(/\.+$/,'');
    return `- ${nome}: ${origTxt}. Aditamentos conhecidos: ${aditTxt}. Status: ${statusTxt}.${instr.nota ? ' Nota: '+instr.nota : ''}`;
  });
  return lines.join('\n');
}

function docChatRules(opName, manifestText, obligationsText, instrumentosText){
  return `Você é um assistente que responde perguntas sobre a operação estruturada "${opName}" com base EXCLUSIVAMENTE em: (a) trechos de documentos jurídicos (contratos, aditamentos, atas de assembleia, termos de securitização) fornecidos junto de cada pergunta, (b) a lista de documentos indexados abaixo, (c) a lista de obrigações já identificadas abaixo, e (d) o mapeamento de instrumentos/aditamentos abaixo. Nunca invente ou complete com conhecimento externo. Estas 4 fontes são curadoria humana já verificada contra a pasta real de documentos — trate-as como AUTORIDADE, não como pistas a confirmar lendo os trechos soltos de novo.

Documentos indexados desta operação (mais recente primeiro, quando a data pôde ser identificada pelo nome do arquivo):
${manifestText || '(nenhum documento indexado)'}

Obrigações/prazos já identificados numa revisão anterior das atas e aditamentos desta operação:
${obligationsText || 'Esta operação ainda não teve suas atas/aditamentos revisados especificamente em busca de obrigações com prazo — se perguntarem sobre pendências, diga isso claramente em vez de tentar deduzir uma resposta a partir de trechos soltos.'}

Instrumentos que compõem esta operação (Termo de Securitização, CCI, Cessão Fiduciária, Alienação Fiduciária etc.) e sua cadeia de aditamentos, já checados contra a pasta real de documentos:
${instrumentosText || 'Esta operação ainda não teve seus instrumentos/aditamentos mapeados nesta rodada de indexação — se perguntarem sobre completude documental, diga isso claramente em vez de tentar deduzir contando trechos soltos.'}

FORMATO DA RESPOSTA — brevidade é a prioridade #1, siga à risca:
- Linha 1, sempre: a resposta direta em **negrito**, no máximo 1 frase. Nunca comece com "Com base nos documentos...", "De acordo com...", "É importante notar que..." ou qualquer frase de preenchimento — vá direto ao dado (o valor, a data, o "sim"/"não").
- Depois, NO MÁXIMO mais 2 frases curtas de embasamento — só o essencial pra sustentar a linha 1, nunca um parágrafo. Se o usuário só pediu o fato ("qual a data X?"), pare na linha 1.
- Se a resposta tiver várias partes (lista de aditamentos, lista de pendências), troque as 2 frases por uma lista com "- " — nunca enumere tudo num parágrafo corrido.
- Última linha, sempre, sozinha, separada por linha em branco: **Fonte:** arquivo (data quando houver). Nunca misture a fonte no meio do texto corrido — ela é sempre a última linha, isolada, pra ficar fácil de achar.
- Alvo: a resposta inteira cabe em 2-5 linhas. Só passe disso se o usuário pedir explicitamente mais ("me explica melhor", "detalha isso", "quero mais contexto").
- Não use headers markdown (#), tabelas, blocos de código, nem qualquer marcação além de **negrito** e listas com "-" — a interface só entende essas duas.
- Não repita a pergunta do usuário.

RIGOR — mais importante que soar natural; o usuário trabalha com esses números/datas em decisões reais:
- Números, datas, valores monetários e nomes têm que ser EXATAMENTE o que está escrito no trecho ou na lista fornecida — nunca arredonde, parafraseie de memória ou complete por dedução. Copie o valor literal como está na fonte.
- Se o trecho/lista fornecida não trouxer o dado EXATO que foi perguntado (só algo parecido ou adjacente), diga isso em 1 frase — "não encontrei esse valor específico nos documentos indexados" — em vez de aproximar, arredondar ou inferir a partir de algo parecido.
- Ao citar uma cláusula/número/data, confira mentalmente contra o texto fornecido antes de escrever — um erro de data ou valor aqui é pior do que admitir que não achou.

REGRAS DE CONTEÚDO:
- Perguntas do tipo "tem pendência?"/"o que falta cumprir?": responda usando SÓ a seção "PENDÊNCIAS ATUAIS" da lista de obrigações — nunca cite um item do HISTÓRICO como se fosse uma pendência de hoje; se quem perguntou quiser o histórico, ele pode pedir explicitamente ("e antes disso?", "qual o histórico?").
- Perguntas sobre quais instrumentos existem, quantos/quais aditamentos tem cada um, se algo está completo ou falta na pasta: use o mapeamento de instrumentos acima — ele já tem essa contagem pronta e verificada; não tente recontar aditamentos lendo os trechos soltos, que podem estar incompletos nesta pergunta específica.
- Perguntas sobre datas de atas ou documentos mais recentes: responda com base no manifesto acima, mesmo sem trecho de texto selecionado para a pergunta.
- Perguntas sobre o CONTEÚDO de cláusulas, valores, condições específicas de um documento (não sobre existência/completude): use os trechos fornecidos junto da pergunta. Sem trecho relevante, diga em 1 frase que não encontrou isso nos documentos indexados — não tente adivinhar.
- Trechos de documentos diferentes podem conflitar (contrato original vs. aditamento vs. ata). Priorize o mais recente (pelo manifesto) e diga isso em poucas palavras se for relevante pra resposta.
- As listas de obrigações e instrumentos são curadoria humana — podem estar incompletas se a operação ainda não foi revisada nesta frente (ver os avisos acima quando for o caso). Nunca afirme "esta operação não tem nenhuma pendência/instrumento" de forma geral — diga apenas o que essa lista específica cobre.`;
}

// docChatRenderMarkdownLite (49ª rodada, pedido explícito do usuário: "as respostas estão muito
// confusas ainda, conseguimos melhorar essa interação?"): antes a bolha de resposta usava
// .textContent puro -- o prompt (docChatRules) já pedia **negrito** e listas com "-" pro modelo
// organizar respostas com várias partes, mas isso chegava na tela como asterisco/traço literal
// (**palavra**, "- item"), o que é exatamente o tipo de "confusão" visual que ficava sem
// explicação nenhuma pro usuário. Conversor minúsculo e propositalmente limitado (só negrito +
// lista, nada de headers/tabelas/código -- o próprio prompt já restringe o modelo a só isso):
// escapa qualquer HTML do texto primeiro (nunca confiar em texto vindo do modelo como HTML cru),
// depois aplica só essas 2 transformações. Suficiente pro que o prompt pede, sem abrir espaço
// pra o modelo quebrar o layout da página com marcação inesperada.
function docChatEscapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function docChatRenderMarkdownLite(text){
  const lines = docChatEscapeHtml(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').split('\n');
  let html = '', list = [];
  const flush = ()=>{ if(list.length){ html += `<ul>${list.map(li=>`<li>${li}</li>`).join('')}</ul>`; list = []; } };
  for(const line of lines){
    const bullet = line.match(/^\s*[-•]\s+(.+)/);
    if(bullet){ list.push(bullet[1]); continue; }
    flush();
    const trimmed = line.trim();
    if(trimmed) html += `<p>${trimmed}</p>`;
  }
  flush();
  return html || `<p>${docChatEscapeHtml(text)}</p>`;
}

function docChatHtml(op, opName){
  const chunks = op.doc_chunks || [];
  if(!chunks.length){
    return '<div class="docchat-empty">Nenhum documento cadastrado para esta operação ainda.</div>';
  }
  const files = op.doc_files || [];
  const fileListHtml = files.map(f=>`<li>${f}</li>`).join('');
  const freshness = op.doc_extracted_at ? `<div class="docchat-freshness">Base de documentos atualizada em ${fmtDate(op.doc_extracted_at)} — novos arquivos salvos na pasta depois dessa data ainda não entraram aqui.</div>` : '';
  // Link pra sub-página de Obrigações (pedido do usuário: "acho que dá pra criar uma
  // subpágina desse item, aí o botão de clicar abaixo do campo de perguntar") -- mesmo dado
  // do painel "Obrigações Identificadas em Documentos", só que com o histórico completo junto.
  // Nome do link, 2ª correção (45ª rodada, pedido explícito do usuário: "eu quero criar um
  // cardzinho que eu clique e veja as questões de pendências... e um do lado: documentos da
  // operação") -- a sub-página ganhou o painel "Documentos da Operação" (checagem de
  // completude de instrumentos vs. a pasta), que não é mais só "leitura" de atas/aditamentos
  // -- "Leitura de Atas e Aditamentos" (1ª correção, ver histórico abaixo) não cobria mais o
  // escopo todo, por isso "Atas e Documentos da Operação". Dentro da sub-página em si, as
  // duas frentes ficam em abas SEPARADAS (ver docObrigSubTab/DOC_OBRIG_TABS) pro mesmo motivo
  // que gerou a 1ª correção: não misturar conteúdos de proveniências diferentes numa lista só.
  // Nome do link, 1ª correção (correção pós-publicação, pedido explícito do usuário: "talvez
  // mudar o nome desse card, colocar obrigações aqui pode causar CONFUSÃO com a sessão de
  // obrigações do itens de acompanhamento") -- "Obrigações identificadas em documentos"
  // reaproveitava a mesma palavra da aba Acompanhamento > Obrigações (deveres de entrega
  // comuns: seguro/laudo/DF/cessão) e da sub-aba Via Assembleia, então virou "Leitura de Atas
  // e Aditamentos".
  const docObrigLinkHtml = `<div class="docchat-obliglink"><a href="#" class="docobrig-link subpage-link" data-docobrig-op="${(opName||'').replace(/"/g,'&quot;')}">Ver atas e documentos da operação ${SUBPAGE_ARROW_SVG}</a></div>`;
  // docChatSuggestions (49ª rodada, pedido explícito do usuário: "conseguimos melhorar essa
  // interação?") -- perguntas prontas, clicáveis, cobrindo exatamente as 2 fontes de curadoria
  // que o chat agora tem "de cor" (obrigações + instrumentos, ver buildInstrumentosContextText):
  // reduz o "não sei o que perguntar" e mostra de cara que o assistente já sabe essas respostas
  // sem precisar procurar. Só aparecem antes da 1ª pergunta (ver initDocChat) e só as que fazem
  // sentido pra operação (nem toda operação tem os 3 tipos de dado).
  const suggestions = [];
  if(op.doc_obligations_reviewed) suggestions.push({label:'Pendências atuais', q:'Quais são as pendências atuais desta operação?'});
  if(op.doc_obligations_latest_ata_data) suggestions.push({label:'Ata mais recente', q:'Qual foi a ata mais recente e o que ela decidiu?'});
  if(op.doc_instrumentos && op.doc_instrumentos.instrumentos && op.doc_instrumentos.instrumentos.length) suggestions.push({label:'Aditamentos faltando', q:'Quais aditamentos estão faltando na pasta desta operação?'});
  const suggestionsHtml = suggestions.length
    ? `<div class="docchat-suggestions" id="docchat-suggestions">${suggestions.map(s=>`<button type="button" class="docchat-suggestion" data-q="${s.q.replace(/"/g,'&quot;')}">${s.label}</button>`).join('')}</div>`
    : '';
  return `
    ${freshness}
    <div class="docchat-files">
      <button type="button" class="docchat-files-toggle" id="docchat-files-toggle">${files.length} documento(s) indexado(s) ▾</button>
      <ul class="docchat-files-list" id="docchat-files-list" hidden>${fileListHtml}</ul>
    </div>
    <div class="docchat-log" id="docchat-log">
      <div class="docchat-hint">Pergunte algo sobre os documentos desta operação — contratos, aditamentos, atas de assembleia, waivers, etc.</div>
      ${suggestionsHtml}
    </div>
    <div class="docchat-inputrow">
      <input type="text" id="docchat-input" class="docchat-input" placeholder="Pergunte sobre os documentos..." />
      <button type="button" id="docchat-send" class="docchat-send">Perguntar</button>
      <button type="button" id="docchat-stop" class="docchat-stop" hidden>Parar</button>
    </div>
    <div class="docchat-note" id="docchat-note"></div>
    ${docObrigLinkHtml}
  `;
}

async function initDocChat(op, opName){
  try {
    const sendBtn = document.getElementById('docchat-send');
    if(!sendBtn) return; // sem documentos pra esta operação, nada a fazer
    const stopBtn = document.getElementById('docchat-stop');
    const input = document.getElementById('docchat-input');
    const log = document.getElementById('docchat-log');
    const note = document.getElementById('docchat-note');
    const filesToggle = document.getElementById('docchat-files-toggle');
    const filesList = document.getElementById('docchat-files-list');
    if(filesToggle && filesList){
      filesToggle.addEventListener('click', ()=>{ filesList.hidden = !filesList.hidden; });
    }
    let suggestionsBox = document.getElementById('docchat-suggestions');

    const chunks = op.doc_chunks || [];
    const manifestText = buildDocManifestText(op);
    const obligationsText = buildObligationsContextText(op);
    const instrumentosText = buildInstrumentosContextText(op);
    let apiTurns = [];
    let ctl = null;

    let sampleFn = null;
    try {
      if(window.claude && typeof window.claude.use === 'function'){
        sampleFn = await window.claude.use('sample');
      }
    } catch(e){ sampleFn = null; }

    if(currentOp !== opName) return; // usuário já trocou de operação enquanto isso resolvia

    if(!sampleFn){
      note.textContent = 'Consulta por IA não disponível nesta visualização.';
      sendBtn.disabled = true;
      input.disabled = true;
      return;
    }

    function addBubble(role, text){
      const div = document.createElement('div');
      div.className = 'docchat-msg docchat-msg-' + role;
      // Usuário continua em texto puro (nunca precisa de formatação); só a resposta do
      // assistente passa pelo conversor -- ver docChatRenderMarkdownLite acima.
      if(role === 'assistant') div.innerHTML = docChatRenderMarkdownLite(text);
      else div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }
    function setAnswer(el, text){
      el.innerHTML = docChatRenderMarkdownLite(text);
    }
    function setBusy(busy){
      sendBtn.hidden = busy;
      stopBtn.hidden = !busy;
      input.disabled = busy;
    }

    async function ask(question){
      question = (question!=null ? question : input.value).trim();
      if(!question || sendBtn.disabled) return;
      try {
        note.textContent = '';
        const hint = log.querySelector('.docchat-hint');
        if(hint) hint.remove();
        // sugestões somem depois da 1ª pergunta (pedido implícito -- só fazem sentido como
        // ponto de partida, não devem competir com o histórico de conversa já rolando)
        if(suggestionsBox){ suggestionsBox.remove(); suggestionsBox = null; }
        addBubble('user', question);
        input.value = '';

        // Correção (pedido do usuário: "se for para não ter, de fato, efetividade... é melhor
        // tirar" -- reclamação de que perguntas legítimas voltavam "não entendi"): antes, sem
        // NENHUM chunk batendo por palavra-chave, a função desistia na hora ("não encontrei
        // trechos"), mesmo pra perguntas que o manifesto/lista de obrigações já respondem sem
        // precisar de trecho nenhum (ex.: "quais foram as últimas atas?", "tem pendência?").
        // Agora só avisamos a ausência de trechos (não interrompemos mais) e sempre mandamos o
        // manifesto de documentos + a lista de obrigações junto -- o modelo decide, com essas
        // 3 fontes, se consegue responder ou se precisa dizer que não achou.
        const picked = docChatPickChunks(question, chunks, 7000, 10);
        const chunkText = picked.length
          ? picked.map((c,i)=>`[${i+1}] (arquivo: ${c.filename})\n${c.text}`).join('\n\n')
          : '(nenhum trecho de documento bateu por palavra-chave com esta pergunta -- responda só com base no manifesto de documentos e na lista de obrigações acima, se der, ou diga que não encontrou.)';
        const apiContent = `Trechos de documentos relevantes:\n\n${chunkText}\n\n---\nPergunta do usuário: ${question}`;
        apiTurns.push({role:'user', content: apiContent});
        const MAX_TURNS = 8;
        let sendTurns = apiTurns.slice(-MAX_TURNS);
        if(sendTurns.length && sendTurns[0].role !== 'user') sendTurns = sendTurns.slice(1);
        const fullTurns = [{role:'user', content: docChatRules(opName, manifestText, obligationsText, instrumentosText)}, ...sendTurns];

        const answerEl = addBubble('assistant', 'Pensando...');
        setBusy(true);
        ctl = new AbortController();
        try {
          const result = await sampleFn(fullTurns, {
            cache: false,
            signal: ctl.signal,
            onText: (u)=>{ setAnswer(answerEl, u.text); log.scrollTop = log.scrollHeight; },
          });
          apiTurns.push({role:'assistant', content: result.text});
          if(result.truncated) note.textContent = 'Resposta cortada por limite de tamanho — tente uma pergunta mais específica.';
        } catch(e){
          const code = e && e.code;
          if(e && e.text){ setAnswer(answerEl, e.text); }
          if(code === 'cancelled'){
            // usuário cancelou, sem mensagem de erro
          } else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){
            note.textContent = 'Consulta por IA não disponível nesta visualização.';
            sendBtn.disabled = true; input.disabled = true;
          } else if(code === 'rate_limited'){
            note.textContent = 'Muitas perguntas em pouco tempo — aguarde um instante e tente de novo.';
          } else if(code === 'session_expired'){
            note.textContent = 'Sua sessão expirou — atualize a página e faça login novamente.';
          } else if(code === 'refused'){
            if(!answerEl.textContent || answerEl.textContent==='Pensando...') setAnswer(answerEl, 'A pergunta foi recusada. Tente reformular.');
          } else if(code === 'empty_completion'){
            setAnswer(answerEl, 'Não consegui gerar uma resposta. Tente reformular a pergunta.');
          } else {
            note.textContent = 'Não foi possível obter resposta agora. Tente novamente.';
          }
          if(!answerEl.textContent || answerEl.textContent==='Pensando...') answerEl.remove();
        } finally {
          setBusy(false);
          ctl = null;
        }
      } catch(e){
        console.error('docChat ask() error', e);
      }
    }

    sendBtn.addEventListener('click', ()=>ask());
    input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !sendBtn.disabled){ ask(); } });
    stopBtn.addEventListener('click', ()=>{ if(ctl) ctl.abort(); });
    if(suggestionsBox){
      suggestionsBox.querySelectorAll('.docchat-suggestion').forEach(btn=>{
        btn.addEventListener('click', ()=>{ if(!sendBtn.disabled) ask(btn.dataset.q); });
      });
    }
  } catch(e){
    console.error('initDocChat error', e);
  }
}

// op.caracteristicas_compare/caracteristicas_compare_fields (44ª rodada, Alianza GRU e Mauá,
// item 6): variante 2-colunas de "Características da Operação", pro caso de 2 séries
// consolidadas numa aba só (cada uma com seu próprio Cód. Cetip/Volume/Data de Emissão etc,
// mesma lógica de "estruturalmente igual, valores reais" já usada em ATIVO_COMPARE_BY_OP pra
// Garantias -- ver ativoCompareHtml). Reaproveita a MESMA tabela visual (.ativo-compare-table)
// em vez de inventar uma aparência nova, seguindo o pedido do usuário de manter os padrões de
// formatação já estipulados no portal. Opt-in: só ativa quando o campo existe; toda operação
// de série única continua com o <dl class="kv"> de sempre.
// Correção pós-publicação (44ª rodada, Alianza GRU e Mauá -- "te dei o exemplo que devemos
// seguir [...] você foi lá e fez por conta própria"): o exemplo original do usuário pro card
// de Características (Securitizadora|AF, Emissão|Série etc.) NÃO tem uma linha de cabeçalho
// rotulando as 2 colunas (diferente do exemplo de Garantias, que tem "MAUÁ"/"GUARULHOS" -- os
// 2 exemplos são deliberadamente diferentes um do outro nesse ponto). ativoCompareHtml()
// (Garantias) continua com cabeçalho normalmente; esta função (só usada em Características,
// ver op.caracteristicas_compare) sai sem <thead>, igual ao exemplo.
// Correção pós-publicação (45ª rodada, ponto 2 -- Alianza GRU e Mauá, "Características da
// Operação"): usuário mandou o exemplo de novo e circulou de amarelo as linhas que devem
// "juntar" -- comparando com o exemplo, são exatamente as linhas onde os 2 ativos têm o MESMO
// valor (ex.: "Securitizadora | AF" = "Riza Sec | Vortx" nos 2), que no exemplo aparecem como
// 1 valor só centralizado (spanning as colunas de valor), não repetido em cada coluna. Antes
// esta função sempre desenhava 1 <td> por item, mesmo quando o valor era idêntico -- daí o
// "você foi lá e fez por conta própria". Regra agora: quando TODOS os valores da linha são
// iguais (e não vazios), 1 único <td colspan> centralizado; quando divergem (ex. "Data de
// Emissão | Vencimento", "Lock-up"), continua 1 coluna por item, igual antes. Genérico -- vale
// pra qualquer operação futura que use esse mesmo formato comparativo, não só Alianza.
function caracteristicasCompareHtml(items, fields){
  const rowsHtml = fields.map(([label,key])=>{
    const vals = items.map(a=>a[key]);
    if(vals.every(v=>!v && v!==0)) return '';
    const allSame = vals.every(v=>(v||v===0) && v===vals[0]);
    const valsHtml = allSame
      ? `<td class="ai-val" colspan="${items.length}">${vals[0]}</td>`
      : vals.map(v=>`<td class="ai-val">${(v||v===0)?v:'—'}</td>`).join('');
    return `<tr><td class="ai-label">${label}</td>${valsHtml}</tr>`;
  }).join('');
  const valColWidth = (70/items.length).toFixed(2);
  const colgroup = `<colgroup><col style="width:30%">${items.map(()=>`<col style="width:${valColWidth}%">`).join('')}</colgroup>`;
  return `<div class="ativo-compare-wrap"><table class="ativo-compare-table">
    ${colgroup}
    <tbody>${rowsHtml}</tbody>
  </table></div>`;
}

// caracteristicasSingleHtml (pente-fino de padronização): versão de 1 coluna só de
// "Características da Operação", pras 42 operações de série única -- antes era um <dl class="kv">
// simples (rótulo normal, borda sólida, sem zebra -- uma <dl> nunca pega a regra de zebra
// genérica de tabela, que só olha tbody tr). Reaproveita a MESMA tabela visual do formato
// 2-colunas da Alianza (.ativo-compare-table -- rótulo em caixa alta/cinza, borda tracejada,
// zebra automática por ser um <table> de verdade) só que com 1 única coluna de valor. Pedido
// explícito do usuário: "precisamos replicar essa mesma formatação para as outras operações...
// só está em Alianza". Não muda NENHUM dado/campo -- só a moldura visual em volta do mesmo
// conteúdo que já existia.
function caracteristicasSingleHtml(flat){
  const rowsHtml = flat.map(c=>`<tr><td class="ai-label">${c.label}</td><td class="ai-val">${c.text}</td></tr>`).join('');
  // .ativo-compare-table--1col (modificador): a regra padrão min-width:460px existe pro caso de
  // 2+ colunas de valor (precisa de mais espaço horizontal pra caber 2 séries lado a lado) --
  // com 1 coluna só isso força um scroll horizontal desnecessário no painel de Características
  // (mais estreito, dentro de #detail-grid) que a versão antiga (<dl class="kv">) nunca teve.
  return `<div class="ativo-compare-wrap"><table class="ativo-compare-table ativo-compare-table--1col">
    <colgroup><col style="width:32%"><col style="width:68%"></colgroup>
    <tbody>${rowsHtml}</tbody>
  </table></div>`;
}

function caracteristicasHtml(op){
  let body;
  if(op.caracteristicas_compare && op.caracteristicas_compare.length && op.caracteristicas_compare_fields){
    body = caracteristicasCompareHtml(op.caracteristicas_compare, op.caracteristicas_compare_fields);
  } else {
    const rows = op.caracteristicas;
    if(rows && rows.length){
      const flat = [];
      rows.forEach(row => row.forEach(c => flat.push(c)));
      body = caracteristicasSingleHtml(flat);
    } else {
      body = '<div class="chart-empty">Sem características mapeadas para esta operação.</div>';
    }
  }
  return `<div class="panel" style="margin-bottom:0;"><div class="panel-head"><h2>Características da Operação</h2></div><div class="panel-body">${body}</div></div>`;
}

/* Versão comparativa lado a lado de "Informações do Ativo" (31ª rodada, Localfrio) —
   usada só quando op.ativo_compare existe (opt-in explícito no Python, ver
   ATIVO_COMPARE_BY_OP). Fica dentro do MESMO card "Garantias" de sempre; rolagem
   horizontal própria em vez de alargar a coluna (ver #detail-grid/.ativo-compare-wrap). */
function ativoCompareHtml(op){
  const items = op.ativo_compare;
  if(!items || !items.length) return null;
  // op.ativo_compare_fields (opt-in, ver ATIVO_COMPARE_FIELDS_BY_OP no Python) permite uma
  // operação definir seu próprio conjunto de linhas -- [label, chave] com valor já
  // pré-formatado em cada item -- em vez do conjunto fixo abaixo (herdado da Localfrio,
  // primeira operação a usar esse card). Ex.: Residencial Jardins (35ª rodada, ponto 4)
  // usa Incorporador/Unidades/Residenciais x Não Residenciais/Aquisição/Avaliação em vez
  // de Tipo de Ativo/Proprietária/Endereço/Descrição/Locatário.
  const customFields = op.ativo_compare_fields;
  const fields = customFields
    ? customFields.map(([label,key])=>[label, a=>a[key]])
    : [
        ['Tipo de Ativo', a=>a.tipo_ativo],
        ['Ativo', a=>a.ativo],
        ['Proprietária', a=>a.proprietaria],
        ['Endereço', a=>a.endereco_maps_url ? `<a href="${a.endereco_maps_url}" target="_blank" rel="noopener noreferrer">${a.endereco} ↗</a>` : a.endereco],
        ['Área Construída', a=>a.abl_total],
        ['Descrição', a=>a.descricao],
        ['Valor de Mercado¹', a=> a.valor_mercado!=null ? `${fmtBRLFull(a.valor_mercado)}${a.valor_mercado_m2!=null?' (R$ '+fmtNumFixed(a.valor_mercado_m2,2)+'/m²)':''}` : null],
        ['Locatário', a=>a.locatario],
      ];
  const headHtml = items.map(a=>`<th>${a.label||a.ativo||''}</th>`).join('');
  const rowsHtml = fields.map(([label,get])=>{
    const vals = items.map(get);
    if(vals.every(v=>!v && v!==0)) return '';
    return `<tr><td class="ai-label">${label}</td>${vals.map(v=>`<td class="ai-val">${(v||v===0)?v:'—'}</td>`).join('')}</tr>`;
  }).join('');
  const valColWidth = (70/items.length).toFixed(2);
  const colgroup = `<colgroup><col style="width:30%">${items.map(()=>`<col style="width:${valColWidth}%">`).join('')}</colgroup>`;
  const footnote = customFields ? '' : '<div class="ativo-compare-footnote">¹ Laudo Apsis (material de apoio)</div>';
  return `<div class="ativo-compare-wrap"><table class="ativo-compare-table">
    ${colgroup}
    <thead><tr><th></th>${headHtml}</tr></thead>
    <tbody>${rowsHtml}</tbody>
  </table></div>${footnote}`;
}

/* "Acompanhamento das Locações" por galpão (31ª rodada, Localfrio) — mesmo padrão visual/
   posição do painel de locatários da Evolution (locatariosPanelHtml), mas com colunas
   próprias (Galpão em vez de Locatário). Fonte: op.locacoes_galpao (ver
   LOCACOES_GALPAO_BY_OP no Python). */
function locacoesGalpaoTableHtml(op){
  const lg = op.locacoes_galpao;
  if(!lg || !lg.rows || !lg.rows.length) return null;
  const rowLabel = lg.row_label || 'Galpão';
  const rowLabel2 = lg.row_label2 || null;
  // r._subtotal marca uma linha de subtotal intermediária (ex.: BR Prop, que agrupa os
  // galpões em "Subtotal - CF + AF"/"Subtotal - CF" antes do total geral) -- mesma
  // aparência do total geral (locrow-total), só um pouco mais discreta (locrow-subtotal),
  // e o rótulo ocupa as 2 colunas de nome quando há row_label2 (ver regra geral #31).
  const rowHtml = r => {
    // r._grouptotal (44ª rodada, Alianza GRU e Mauá): mesma forma do r._subtotal, mas com a
    // aparência de TOTAL de verdade (locrow-total, azul forte/negrito) em vez do subtotal mais
    // discreto -- usado quando a tabela tem 2+ grupos, CADA UM com seu próprio total "de
    // fechamento" (ex.: "Total Mauá"/"Total GRU"), sem nenhum total geral no fim (ver
    // locacao_consolidada_reajuste no build_data.py) -- diferente do padrão BR Prop (1 subtotal
    // discreto + 1 total geral no fim, via lg.total).
    if(r._subtotal || r._grouptotal){
      const cls = r._grouptotal ? 'locrow-total' : 'locrow-subtotal';
      return `<tr class="${cls}">
        <td${rowLabel2?' colspan="2"':''}>${r.label||'Subtotal'}</td>
        <td class="num">${r.area!=null?fmtNum(r.area,0)+' m²':'—'}</td>
        <td class="num">${r.pct_ocupacao!=null?fmtPct(r.pct_ocupacao,0):'—'}</td>
        <td class="num">${r.valor_contratado!=null?fmtBRLFull(r.valor_contratado):'—'}</td>
        <td class="num">${r.valor_pago!=null?fmtBRLFull(r.valor_pago):'—'}</td>
        <td class="num">${r.valor_m2!=null?'R$ '+fmtNumFixed(r.valor_m2,2):'—'}</td>
        <td>-</td>
      </tr>`;
    }
    return `
    <tr>
      <td>${r.galpao}</td>
      ${rowLabel2?`<td>${r.locatario||'-'}</td>`:''}
      <td class="num">${r.area!=null?fmtNum(r.area,0)+' m²':'—'}</td>
      <td class="num">${r.pct_ocupacao!=null?fmtPct(r.pct_ocupacao,0):'—'}</td>
      <td class="num">${r.valor_contratado!=null?fmtBRLFull(r.valor_contratado):'—'}</td>
      <td class="num">${r.valor_pago!=null?fmtBRLFull(r.valor_pago):'—'}</td>
      <td class="num">${r.valor_m2!=null?'R$ '+fmtNumFixed(r.valor_m2,2):'—'}</td>
      <td>${r.reajuste||'-'}</td>
    </tr>`;
  };
  const rows = lg.rows.map(rowHtml).join('');
  const t = lg.total;
  const totalRow = t ? `<tr class="locrow-total"><td${rowLabel2?' colspan="2"':''}>${t.label||'Total'}</td><td class="num">${t.area!=null?fmtNum(t.area,0)+' m²':'—'}</td><td class="num">${fmtPct(1,0)}</td><td class="num">${t.valor_contratado!=null?fmtBRLFull(t.valor_contratado):'—'}</td><td class="num">${t.valor_pago!=null?fmtBRLFull(t.valor_pago):'—'}</td><td class="num">${t.valor_m2!=null?'R$ '+fmtNumFixed(t.valor_m2,2):'—'}</td><td>-</td></tr>` : '';
  const headLabel2 = rowLabel2 ? `<th>${rowLabel2}</th>` : '';
  return `<div class="datatable-wrap" style="max-height:none;"><table class="scrolltable loc-table">
    <thead><tr><th>${rowLabel}</th>${headLabel2}<th>Área Locada</th><th>Ocupação</th><th>Valor Contratado</th><th>Valor Pago</th><th>Valor aluguel/m²</th><th>Reajuste</th></tr></thead>
    <tbody>${rows}${totalRow}</tbody>
  </table></div>`;
}

  return `<div class="panel">

function ativoInfoHtml(op){
  const infos = op.ativo_info;
  if(!infos || infos.length===0) return null;
  return infos.map(a=>{
    // ativo_info_fields (Residencial Itaim, 36ª rodada, ponto 5): opt-in — quando presente,
    // substitui TODO o conjunto padrão de campos abaixo por uma lista [[label, key], ...]
    // curada à mão em ATIVO_INFO_MANUAL[op].ativo_info_fields (build_data.py), pra operações
    // cujas "Informações do Ativo" não cabem no formato padrão Tipo de Ativo/Ativo/
    // Proprietária/Endereço/ABL Total/ABL Adquirido/Descrição/Valor de Avaliação (ex.:
    // Residencial Itaim tem Incorporadora + ABL/Unidades separados em "Garantia" vs.
    // "Empreendimento inteiro" + Valor de Aquisição, sem "Proprietária"/ABL Adquirido).
    if(a.ativo_info_fields && a.ativo_info_fields.length){
      const rows = a.ativo_info_fields.map(([label,key])=>{
        let val = a[key];
        if(val==null || val==='') return null;
        if(key==='endereco' && a.endereco_maps_url){
          val = `<a href="${a.endereco_maps_url}" target="_blank" rel="noopener noreferrer">${val} ↗</a>`;
        } else if(Array.isArray(val)){
          val = `<ul class="ativo-bullets">${val.map(d=>`<li>${String(d).replace(/^-\s*/,'')}</li>`).join('')}</ul>`;
        }
        return `<tr><td class="ai-label">${label}</td><td class="ai-val">${val}</td></tr>`;
      }).filter(Boolean).join('');
      return `<table class="ativo-info-table"><tbody>${rows}</tbody></table>`;
    }
    const valorAvaliacaoParts = [];
    if(a.valor_avaliacao){
      if(a.valor_avaliacao.valor_m2!=null) valorAvaliacaoParts.push('R$ '+fmtNumFixed(a.valor_avaliacao.valor_m2,2)+'/m²');
      if(a.valor_avaliacao.valor_quarto!=null) valorAvaliacaoParts.push('R$ '+fmtNum(a.valor_avaliacao.valor_quarto,0)+'/quarto');
    }
    const valorEstoqueParts = [];
    if(a.valor_estoque_inicial){
      if(a.valor_estoque_inicial.valor_m2!=null) valorEstoqueParts.push('R$ '+fmtNum(a.valor_estoque_inicial.valor_m2,0)+'/m²');
      if(a.valor_estoque_inicial.valor_quarto!=null) valorEstoqueParts.push('R$ '+fmtNum(a.valor_estoque_inicial.valor_quarto,0)+'/quarto');
    }
    const fields = [
      ['Tipo de Ativo', a.tipo_ativo],
      ['Ativo', a.ativo],
      ['Proprietária', a.proprietaria],
      ['Endereço', a.endereco_maps_url ? `<a href="${a.endereco_maps_url}" target="_blank" rel="noopener noreferrer">${a.endereco} ↗</a>` : a.endereco],
      ['ABL Total', a.abl_total],
      ['ABL Adquirido', a.abl_adquirido],
      ['Descrição', a.descricao && a.descricao.length ? `<ul class="ativo-bullets">${a.descricao.map(d=>`<li>${d.replace(/^-\s*/,'')}</li>`).join('')}</ul>` : null],
      [a.valor_avaliacao_label || 'Valor de Avaliação', a.valor_avaliacao ? `${fmtBRLFull(a.valor_avaliacao.valor)}${valorAvaliacaoParts.length?' ('+valorAvaliacaoParts.join(' | ')+')':''}` : null],
      ...(a.valor_avaliacao_extra || []),
      ['Valor do Estoque Inicial', a.valor_estoque_inicial ? `${fmtBRLFull(a.valor_estoque_inicial.valor)}${valorEstoqueParts.length?' ('+valorEstoqueParts.join(' | ')+')':''}` : null],
      ['Atualização do Laudo', a.atualizacao_laudo],
    ].filter(([,v])=>v);
    const rows = fields.map(([label,val])=>`<tr><td class="ai-label">${label}</td><td class="ai-val">${val}</td></tr>`).join('');
    return `<table class="ativo-info-table"><tbody>${rows}</tbody></table>`;
  }).join('<div style="height:14px;"></div>');
}

/* "Acompanhamento de Estoque" — card novo (23ª/24ª rodada), largura total, acima do
   Fluxo Mensal. Só operações com dado curado em ESTOQUE_HIST_BY_OP (hoje só Calçada). */
function estoqueMoneyOrDash(empty, v){ return empty ? '<span class="estoque-dash">-</span>' : fmtBRLCompact(v); }
function estoqueM2OrDash(empty, v){ return empty ? '<span class="estoque-dash">-</span>' : (v!=null && !isNaN(v) ? 'R$ '+fmtNum(v,0) : '—'); }
function estoqueNumOrDash(empty, v){ return empty ? '<span class="estoque-dash">-</span>' : fmtNum(v,0); }

function estoqueHistPanelHtml(op){
  const eh = op.estoque_hist;
  if(!eh) return '';
  const snap = eh.snapshot;
  const m2 = v => (v!=null && !isNaN(v)) ? 'R$ '+fmtNum(v,0) : '—';
  const snapRow = (label, cls)=>`<tr${cls?` class="${cls}"`:''}>
      <td>${label}</td>
      <td>${fmtNum(snap.inicial.n_unidades,0)}</td><td>${fmtNum(snap.inicial.area,0)}</td>
      <td>${fmtBRLCompact(snap.inicial.valor_minimo_venda)}</td><td>${fmtBRLCompact(snap.inicial.valor)}</td><td>${m2(snap.inicial.valor_m2)}</td>
      <td>${fmtNum(snap.venda.n_unidades,0)}</td><td>${fmtNum(snap.venda.area,0)}</td>
      <td>${fmtBRLCompact(snap.venda.valor)}</td><td>${m2(snap.venda.valor_m2)}</td>
      <td>${fmtNum(snap.atual.n_unidades,0)}</td><td>${fmtNum(snap.atual.area,0)}</td>
      <td>${fmtBRLCompact(snap.atual.valor)}</td><td>${m2(snap.atual.valor_m2)}</td>
      <td>${fmtBRLCompact(snap.atual.valor_media_vendas)}</td><td>${m2(snap.atual.valor_media_vendas_m2)}</td>
    </tr>`;

  const histRows = eh.historico.map(r=>{
    const vEmpty = r.venda.n_unidades===0, dEmpty = r.definitiva.n_unidades===0, pEmpty = r.provisoria.n_unidades===0;
    const isTotal = r.periodo==='Total';
    return `<tr${isTotal?' class="estoque-total"':''}>
      <td>${r.periodo}</td>
      <td>${estoqueNumOrDash(vEmpty,r.venda.n_unidades)}</td><td>${estoqueNumOrDash(vEmpty,r.venda.area)}</td>
      <td>${estoqueMoneyOrDash(vEmpty,r.venda.valor_tabela)}</td><td>${estoqueM2OrDash(vEmpty,r.venda.valor_m2)}</td>
      <td>${estoqueNumOrDash(dEmpty,r.definitiva.n_unidades)}</td>
      <td>${estoqueMoneyOrDash(dEmpty,r.definitiva.valor_venda)}</td><td>${estoqueMoneyOrDash(dEmpty,r.definitiva.valor_recebido)}</td>
      <td>${estoqueMoneyOrDash(dEmpty,r.definitiva.valor_a_receber)}</td><td>${estoqueMoneyOrDash(dEmpty,r.definitiva.amortizacao)}</td>
      <td>${estoqueMoneyOrDash(dEmpty,r.definitiva.pct_calcada)}</td>
      <td>${estoqueNumOrDash(pEmpty,r.provisoria.n_unidades)}</td>
      <td>${estoqueMoneyOrDash(pEmpty,r.provisoria.valor_venda)}</td><td>${estoqueMoneyOrDash(pEmpty,r.provisoria.valor_recebido)}</td>
      <td>${estoqueMoneyOrDash(pEmpty,r.provisoria.valor_a_receber)}</td><td>${estoqueMoneyOrDash(pEmpty,r.provisoria.amortizacao)}</td>
      <td>${estoqueMoneyOrDash(pEmpty,r.provisoria.pct_calcada)}</td>
    </tr>`;
  }).join('');

  return `<div class="panel">
    <div class="panel-head"><h2>Acompanhamento de Estoque</h2><span class="meta">${snap.empreendimento}</span></div>
    <div class="panel-body">
      <div class="estoque-wrap"><table class="estoque-table">
        <thead>
          <tr class="grouphead"><th></th><th colspan="5">Estoque Inicial</th><th colspan="4">Venda</th><th colspan="6">Estoque Atual</th></tr>
          <tr class="subhead">
            <th>Empreendi&shy;mento</th>
            <th>Nº de unidades</th><th>Área</th><th>Valor Mínimo de Venda</th><th>Valor do Estoque</th><th>R$/m²</th>
            <th>Nº de unidades</th><th>Área</th><th>Valor de Venda</th><th>R$/m²</th>
            <th>Nº de unidades</th><th>Área</th><th>Valor do Estoque</th><th>R$/m²</th><th>Valor de Estoque Média Vendas</th><th>R$/m²</th>
          </tr>
        </thead>
        <tbody>
          ${snapRow(snap.empreendimento)}
          ${snapRow('', 'estoque-total')}
        </tbody>
      </table></div>

      <div class="datatable-meta" style="margin-top:18px;">Histórico de Vendas x Estoque</div>
      <div class="estoque-wrap"><table class="estoque-table">
        <thead>
          <tr class="grouphead"><th></th><th colspan="4">Venda</th><th colspan="6">Definitiva</th><th colspan="6">Provisória</th></tr>
          <tr class="subhead">
            <th>Data</th>
            <th>Nº de unidades</th><th>Área/m²</th><th>Valor de Venda Tabela</th><th>R$/m²</th>
            <th>Nº de unidades</th><th>Valor de Venda</th><th>Valor Recebi&shy;do¹</th><th>Valor a Receber</th><th>Amortiza&shy;ção</th><th>% Calçada</th>
            <th>Nº de unidades</th><th>Valor de Venda</th><th>Valor Recebi&shy;do</th><th>Valor a Receber</th><th>Amortiza&shy;ção</th><th>% Calçada</th>
          </tr>
        </thead>
        <tbody>${histRows}</tbody>
      </table></div>
      <div class="estoque-notes"><b>Notas:</b><br>(1) Valor recebido: recebido das vendas definitivas + recebido das vendas definitivas distratadas.</div>
    </div>
  </div>`;
}

/* "Acompanhamento do Estoque" por ativo (35ª rodada, Residencial Jardins, ponto 6) --
   mesmo card/posição/classes visuais da estoqueHistPanelHtml (Calçada), mas layout de
   tabela diferente: uma linha por ativo (não por período), 2 tabelas ("Aquisição x
   Atual" e "Vendas x Carteira x Amortização"), igual ao print fornecido pelo usuário.
   Só operações com dado curado em op.estoque_por_ativo (hoje só Residencial Jardins --
   ver ESTOQUE_POR_ATIVO_BY_OP no Python). */
function estoquePorAtivoPanelHtml(op){
  const ep = op.estoque_por_ativo;
  if(!ep) return '';
  // Mesmo padrão da Calçada (estoqueMoneyOrDash/estoqueM2OrDash): valores totais em
  // formato compacto ("R$ 15,2 MM") e R$/m² sem casas decimais, mas sem abreviar.
  const m = v => fmtBRLCompact(v);
  const m2 = v => v!=null && !isNaN(v) ? 'R$ '+fmtNum(v,0) : '—';
  const n = v => v!=null && !isNaN(v) ? fmtNum(v,0) : '—';

  const aa = ep.aquisicao_atual;
  const aaRow = (r, cls) => `<tr${cls?` class="${cls}"`:''}>
      <td>${r.label}</td>
      <td>${n(r.aq_un)}</td><td>${n(r.aq_area)}</td><td>${m(r.aq_valor)}</td><td>${m2(r.aq_m2)}</td><td>${m(r.aq_aval)}</td><td>${m2(r.aq_aval_m2)}</td>
      <td>${n(r.at_un)}</td><td>${n(r.at_area)}</td><td>${m(r.at_valor)}</td><td>${m2(r.at_m2)}</td><td>${m(r.at_med)}</td><td>${m2(r.at_med_m2)}</td>
    </tr>`;
  const aaRows = (aa && aa.rows ? aa.rows.map(r=>aaRow(r)).join('') : '') + (aa && aa.total ? aaRow(aa.total, 'estoque-total') : '');

  const vd = ep.vendas;
  const vRow = (r, cls) => `<tr${cls?` class="${cls}"`:''}>
      <td>${r.label}</td>
      <td>${n(r.vt_un)}</td><td>${n(r.vt_area)}</td><td>${m(r.vt_valor)}</td><td>${m2(r.vt_m2)}</td>
      <td>${n(r.ve_un)}</td><td>${m(r.ve_pre)}</td><td>${m(r.ve_pos)}</td><td>${m(r.amex_pre)}</td><td>${m(r.amex_pos)}</td>
      <td>${n(r.vnq_un)}</td><td>${m(r.vnq_valor)}</td>
    </tr>`;
  const vRows = (vd && vd.rows ? vd.rows.map(r=>vRow(r)).join('') : '') + (vd && vd.total ? vRow(vd.total, 'estoque-total') : '');

  return `<div class="panel">
    <div class="panel-head"><h2>Acompanhamento do Estoque</h2></div>
    <div class="panel-body">
      <div class="estoque-wrap"><table class="estoque-table">
        <thead>
          <tr class="grouphead"><th></th><th colspan="6">Aquisição</th><th colspan="6">Atual (Estoque + Venda Não Quitada¹)</th></tr>
          <tr class="subhead">
            <th>Empreendi&shy;mento</th>
            <th>Unidades</th><th>Área</th><th>Valor de Aquisição</th><th>R$/m²</th><th>Valor de Avaliação</th><th>R$/m²</th>
            <th>Unidades</th><th>Área</th><th>Valor de Avaliação Laudo²</th><th>R$/m²</th><th>Valor de Avaliação Média Vendas³</th><th>R$/m²</th>
          </tr>
        </thead>
        <tbody>${aaRows}</tbody>
      </table></div>

      <div class="datatable-meta" style="margin-top:18px;">Acompanhamento Vendas x Carteira x Amortização</div>
      <div class="estoque-wrap"><table class="estoque-table">
        <thead>
          <tr class="grouphead"><th></th><th colspan="4">Venda Total</th><th colspan="5">Venda Escriturada</th><th colspan="2">Venda Não Quitada</th></tr>
          <tr class="subhead">
            <th>Projeto</th>
            <th>Unidades</th><th>Área</th><th>Valor de Venda</th><th>R$/m²</th>
            <th>Unidades</th><th>Valor Recebi&shy;do Pré Repactu&shy;ação</th><th>Valor Recebi&shy;do Pós Repactu&shy;ação</th><th>Amex Pré Repactu&shy;ação</th><th>Amex Pós Repactu&shy;ação</th>
            <th>Unidades</th><th>Valor a Receber</th>
          </tr>
        </thead>
        <tbody>${vRows}</tbody>
      </table></div>
      <div class="estoque-notes"><b>Notas:</b><br>(1) Estoque atual + unidades vendidas com venda não quitada.<br>(2) Laudo de avaliação vigente.<br>(3) Valor de avaliação médio das vendas realizadas no ativo.</div>
    </div>
  </div>`;
}

/* ---------------- detail view ---------------- */
let currentOp = null;

  ['view-overview','view-acomp','view-detail','view-hotel','view-covcalc','view-locperf','view-carteiradetalhe','view-unidadesdetalhe','view-integralizacoes','view-topics','view-docobrig'].forEach(v=>{
    document.getElementById(v).classList.toggle('active', v==='view-'+id);
  });
  document.querySelectorAll('.navtab').forEach(t=> t.classList.toggle('active', t.dataset.view===id));
}

function showDetail(name){
  currentOp = name;
  const op = OPS[name];
  const s = op.summary;
  showView('detail');
  renderSidebar();

  const view = document.getElementById('view-detail');
  const h = opHealth(op);

  // detailCovenants (49ª rodada, correção sobre a 48ª): o painel "Itens de Acompanhamento"
  // da página de detalhe usa SÓ os covenants "normais" -- os itens minerados de Obrigações
  // (_acomp_only=True, ver mine_obligation_items em build_data.py: seguro/laudo/DF/cessão)
  // ficam de fora daqui, entram só na sub-aba Obrigações da aba de Acompanhamento
  // (allCovenantRows, sem esse filtro). Pedido explícito do usuário: "já tínhamos ajustado
  // esse ponto para deixar tudo dentro de Obrigações [...] ajustar para o jeito que estava
  // antes" -- o painel de detalhe volta a mostrar só o card único "Obrigações" (com link pra
  // sub-página), não 1 card por item minerado.
  const detailCovenants = op.covenants.filter(c => !c._acomp_only);
  const covHtml = detailCovenants.length ? detailCovenants.map(c=>{
    const sc = statusClass(c.status);
    // Status inteligente por data (51ª rodada): itens de Obrigações (_tipo==='obrigacao' --
    // seguro/laudo/DF/cessão) usam a mesma obrigStatusInfo() já aplicada na sub-aba Obrigações
    // do Acompanhamento, em vez de mostrar o texto bruto da planilha sem checar a data. Itens
    // Ordinários (IC/LTV/Reserva) continuam com o texto da planilha direto -- compliance
    // numérica já reapurada, sem essa camada extra. Pedido do usuário: "esse entendimento
    // precisa ser replicado para todo o portal, inclusive nas abas de cada operação".
    const isObrigItem = c._tipo === 'obrigacao';
    const obrigInfo = isObrigItem ? obrigStatusInfo(c) : null;
    const statusChipHtml = isObrigItem
      ? (obrigInfo ? `<span class="statuschip ${obrigInfo.cls}">${obrigInfo.label}</span>` : '')
      : (c.status ? `<span class="statuschip ${sc}">${c.status}</span>` : '');
    const fmtVal = c._is_ratio ? (v)=>fmtRatio(v,2) : (c._is_pct ? (v)=>fmtPct(v,c._pct_decimals!=null?c._pct_decimals:2) : fmtGeneric);
    const calcLinkHtml = (c._has_calc_subpage && op.covenant_calc) ? `<div class="covitem-calclink"><a href="#" class="covcalc-link subpage-link" data-covcalc-op="${name.replace(/"/g,'&quot;')}">Ver quebra do cálculo ${SUBPAGE_ARROW_SVG}</a></div>` : '';
    // Integralizações (37ª rodada, correção pt.1): igual ao padrão do covcalc-link acima,
    // mas abre a sub-página de integralizações em vez da quebra do covenant. Item sintético
    // sem exigido/atual/status -- só serve de porta de entrada pra sub-página.
    const integralizacoesLinkHtml = (c._has_integralizacoes_subpage && op.integralizacoes) ? `<div class="covitem-calclink"><a href="#" class="integralizacoes-link subpage-link" data-integralizacoes-op="${name.replace(/"/g,'&quot;')}">Ver tabela de integralizações ${SUBPAGE_ARROW_SVG}</a></div>` : '';
    // Obrigações Pecuniárias / Quórum de Assembleias (38ª rodada, teste piloto Calçada; 41ª
    // rodada, instalado em TODAS as operações): mesmo padrão visual dos links acima, abrindo a
    // sub-página genérica de tópicos (ver showTopicsDetail/topicsSubpageHtml). Os 2 itens não
    // têm exigido/atual/status (removidos via "_clear" em build_data.py na Calçada, e nunca
    // setados nos itens sintéticos das demais operações -- pedido do usuário: "pode tirar a
    // informação de enquadrado, deixar pra fazer dentro dos itens de cada um"). O link aparece
    // mesmo sem op.obrigacoes_pecuniarias/op.quorum_assembleia (a maioria das operações ainda
    // não tem esse conteúdo cadastrado) -- a sub-página mostra "Sem dado disponível." nesse
    // caso (ver topicsSubpageHtml), já deixando a entrada instalada pra quando o conteúdo for
    // adicionado depois, operação por operação.
    const obrigacoesLinkHtml = c._has_obrigacoes_subpage ? `<div class="covitem-calclink"><a href="#" class="topics-link subpage-link" data-topics-op="${name.replace(/"/g,'&quot;')}" data-topics-key="obrigacoes_pecuniarias" data-topics-title="Obrigações">Ver obrigações ${SUBPAGE_ARROW_SVG}</a></div>` : '';
    const quorumLinkHtml = c._has_quorum_subpage ? `<div class="covitem-calclink"><a href="#" class="topics-link subpage-link" data-topics-op="${name.replace(/"/g,'&quot;')}" data-topics-key="quorum_assembleia" data-topics-title="Quórum de Assembleias">Ver regras de quórum ${SUBPAGE_ARROW_SVG}</a></div>` : '';
    return `<div class="covitem">
      <div class="covitem-top"><span class="item">${c.item}</span>${statusChipHtml}</div>
      <div class="covitem-vals">
        ${c.exigido!==undefined?`<span>Exigido: <b>${typeof c.exigido==='number'?fmtVal(c.exigido):fmtGeneric(c.exigido)}</b></span>`:''}
        ${c.atual!==undefined?`<span>Atual: <b>${typeof c.atual==='number'?fmtVal(c.atual):fmtGeneric(c.atual)}</b></span>`:''}
      </div>
      ${c.obs?`<div class="covitem-obs obs-clamp">${c.obs}</div>`:''}
      ${(c.ultima_atualizacao||c.proxima_atualizacao)?`<div class="covitem-dates">${c.ultima_atualizacao?'últ. atualização '+fmtDate(c.ultima_atualizacao):''}${c.proxima_atualizacao?' · próxima '+fmtDate(c.proxima_atualizacao):''}</div>`:''}
      ${covenantCalcHtml(c, fmtVal)}
      ${calcLinkHtml}
      ${integralizacoesLinkHtml}
      ${obrigacoesLinkHtml}
      ${quorumLinkHtml}
    </div>`;
  }).join('') : '<div class="chart-empty">Sem itens de acompanhamento mapeados.</div>';

  const ativoCompare = ativoCompareHtml(op);
  const ativoHtml = ativoCompare || ativoInfoHtml(op);
  const hotelLinkHtml = op.hotel_perf ? `<div class="hotel-link-row"><a href="#" class="hotel-link subpage-link" data-hotel-op="${name.replace(/"/g,'&quot;')}">Mais informações operacionais do hotel ${SUBPAGE_ARROW_SVG}</a></div>` : '';
  // Mesmo padrão do hotelLinkHtml (28ª rodada, Calçada), reaproveitado pra Residencial
  // Jardins (35ª rodada, ponto 5): a operação migrou de deal de renda pra deal de estoque,
  // e as informações de locação (Long-Stay/Short-Stay) saem da view principal pra uma
  // sub-página própria acessada por esse link, dentro do card Garantias.
  const locPerfLinkHtml = op.locacao_perf ? `<div class="hotel-link-row"><a href="#" class="locperf-link subpage-link" data-locperf-op="${name.replace(/"/g,'&quot;')}">${op.locacao_perf.title||'Informações de Locação dos Ativos'} ${SUBPAGE_ARROW_SVG}</a></div>` : '';
  let garantiasBody;
  if(ativoHtml){
    garantiasBody = `<div class="datatable-meta">Informações do Ativo</div>${ativoHtml}${hotelLinkHtml}${locPerfLinkHtml}`;
  } else if(op.garantias.length){
    garantiasBody = op.garantias.map(a=>{
      const rows = Object.entries(a).map(([k,v])=>`<div class="row"><dt>${k}</dt><dd>${fmtGeneric(v)}</dd></div>`).join('');
      const title = a['Ativo'] || a['Imóvel'] || a['Tipo de Ativo'] || 'Garantia';
      return `<div class="assetcard"><h4>${title}</h4><dl class="kv">${rows}</dl></div>`;
    }).join('');
  } else {
    garantiasBody = '<div class="chart-empty">Sem detalhamento de garantia mapeado.</div>';
  }

  view.innerHTML = `
    <button id="detail-back" class="back-btn">${BACK_ARROW_SVG}<span>Visão geral</span></button>
    <div id="detail-head">
      <div>
        <h2>${name}</h2>
        ${opRefLineHtml(op)}
      </div>
      <span class="statuschip ${h}" style="font-size:12.5px;padding:6px 13px;">${healthLabel(h)}</span>
    </div>

    <div id="quickstats">
      <div class="qstat"><div class="label">Saldo Devedor</div><div class="value">${fmtSaldoMM(opSaldoDevedorTotal(op))}${s.pct_maua!=null?`<span class="qstat-sub">(${fmtPct(s.pct_maua,1)} Mauá)</span>`:''}</div></div>
      <div class="qstat"><div class="label">Emissão</div><div class="value">${fmtSaldoMM(s.valor_emissao)}</div></div>
      <div class="qstat"><div class="label">Remuneração</div><div class="value">${(s.indexador||'—')}${s.taxa_juros!=null?'+'+fmtPct(s.taxa_juros,2):''}${s.taxa_juros_aquisicao!=null?` (emissão)<span class="qstat-sub">${(s.indexador||'—')}+${fmtPct(s.taxa_juros_aquisicao,2)} (aquisição)</span>`:''}</div></div>
      <div class="qstat"><div class="label">Vencimento</div><div class="value">${fmtVencAbbr(s.data_vencimento)}</div></div>
      ${QUICKSTAT_IC_INSTEAD_OF_LTV.has(name) ? (()=>{ const icCov = (op.covenants||[]).find(c=>c._categoria==='ic'); return `<div class="qstat"><div class="label">IC Atual</div><div class="value">${icCov && typeof icCov.atual==='number'?fmtRatio(icCov.atual,2):'—'}</div></div>`; })() : `<div class="qstat"><div class="label">LTV Atual</div><div class="value">${s.ltv_atual!=null?fmtPct(s.ltv_atual,1):'—'}</div></div>`}
      <div class="qstat"><div class="label">Duration</div><div class="value">${s.duration!=null?fmtNum(s.duration,1)+' anos':'—'}</div></div>
    </div>

    ${fundPositionsHtml(op)}

    <div id="top-row">
      ${highlightsHtml(op)}
      ${sobreOperacaoHtml(op, name)}
      ${caracteristicasHtml(op)}
    </div>

    <div id="detail-grid">
      <div>
        <div class="panel">
          <div class="panel-head"><h2>Garantias</h2><span class="meta">${op.garantias.length} ativo(s)</span></div>
