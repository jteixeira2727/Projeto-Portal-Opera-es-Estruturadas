.topiclist-ordered{list-style:none;counter-reset:topicord;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.topiclist-ordered li{counter-increment:topicord;display:flex;gap:10px;align-items:flex-start;font-size:12.4px;color:var(--ink-muted);line-height:1.5;padding-bottom:10px;border-bottom:1px dashed var(--border-soft);}
.topiclist-ordered li:last-child{border-bottom:none;padding-bottom:0;}
.topiclist-ordered li::before{
  content:counter(topicord);flex:0 0 auto;width:20px;height:20px;border-radius:50%;
  background:var(--accent-strong);color:var(--accent-ink);font-family:var(--font-mono);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;
}
/* Layout "comparação lado a lado" (39ª rodada): grid de 2 colunas pra pares tipo "1ª
   convocação" / "2ª convocação" -- muito mais fácil de comparar lado a lado do que empilhado
   numa lista corrida. Empilha em 1 coluna em telas estreitas. */
.topiccompare{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:640px){.topiccompare{grid-template-columns:1fr;}}
.topiccompare-card{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;}
.topiccompare-label{font-size:11.5px;font-weight:700;color:var(--accent-strong);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.topiccompare-text{font-size:12.4px;color:var(--ink-muted);line-height:1.5;}

/* Sub-página "Quebra do Cálculo do Covenant" — wrapper próprio (sem max-height do
   .datatable-wrap): essa tabela é o conteúdo inteiro da sub-página, não compete por espaço
   dentro de um card, então não deve virar scroll interno (16-18 linhas ficariam cortadas). */
.covcalc-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:8px;}
.covcalc-wrap table{font-size:11.8px;}
.covcalc-wrap thead th{background:var(--surface-2);box-shadow:0 1px 0 var(--border);}
.covcalc-table th.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.covcalc-table td.covcalc-status-cell{text-align:right;}
.covcalc-table{table-layout:auto;}
.covcalc-table th, .covcalc-table td{white-space:normal;}
.covcalc-table td.covcalc-label{text-align:left;min-width:230px;}
.covcalc-table td.covcalc-fonte{font-size:10.5px;font-style:italic;color:var(--ink-faint);white-space:nowrap;}
.covcalc-table tr.covcalc-subtotal td{font-weight:700;border-top:1.5px solid var(--border);}
.covcalc-table tr.covcalc-highlight td{background:var(--warn-bg);color:var(--warn);font-weight:700;}
.covcalc-table tr.covcalc-status td{padding-top:10px;}

/* Sub-página "Mais informações operacionais do hotel" */
.hotel-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
@media (max-width:800px){.hotel-stats{grid-template-columns:repeat(2,1fr);}}
.chart-legend{display:flex;gap:18px;justify-content:center;margin-top:8px;font-size:11px;color:var(--ink-muted);flex-wrap:wrap;}
.chart-legend span{display:inline-flex;align-items:center;gap:6px;}
.chart-legend i{width:10px;height:10px;display:inline-block;border-radius:2px;}
/* Legenda ACIMA do gráfico (correção pós-publicação, 2ª rodada) -- igual ao exemplo do
   usuário pros gráficos de Fluxo Mensal (IC e Obra), no lugar da legenda embaixo. */
.chart-legend-top{margin:0 0 10px;font-size:11.5px;font-weight:600;}
/* .minidre-table (Mini-DRE Hotel, redesenho pedido pelo usuário -- "está péssima a
   formatação"): causa raiz era a zebra genérica de tabela (tbody tr:nth-child(even), regra de
   base pra QUALQUER tabela do portal) colidindo com o destaque próprio das linhas de total
   (.minidre-total, que também pinta um fundo) -- como quase toda linha "normal" cai numa
   posição par (zebra) e toda linha de total cai numa ímpar (destaque próprio), o resultado era
   quase TODA linha cinza, sobrando só a 1ª ("Receitas") em branco -- sem contraste nenhum,
   parecia quebrado. Corrigido em 3 pontos: (1) zebra genérica desligada aqui (nth-child(even)
   {background:none}), essa tabela já tem sua própria lógica de destaque; (2) linha de total

<!-- 45ª rodada, gráficos interativos (ver mountEChart/echartsBarOption/echartsGroupedBarOption/
     echartsLineOption/echartsObraOption no <script> abaixo): biblioteca de gráfico de verdade
     (tooltip ao passar o mouse, zoom/pan), carregada ANTES do <script> inline pra a global
     `echarts` já existir quando ele rodar. Validada em piloto numa operação só (Alianza GRU e
     Mauá) e, aprovada pelo usuário, aplicada a TODAS as operações e a TODOS os tipos de gráfico
     do portal (barra única, barras agrupadas por mês, linha histórico+projetado do IC, Evolução
     Física da Obra) -- "eu falei para deixar todos os gráficos interativos". Os donuts da Visão
     Geral (Exposição por Securitizadora/Indexador, Concentração por Vencimento) também ganharam
     tooltip nessa rodada, mas continuam SVG desenhado à mão (não ECharts) -- pedido explícito do
     usuário foi só interatividade, sem mudar o layout, ver initDonutTooltip. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/6.1.0/echarts.min.js"></script>
<script id="portfolio-data" type="application/json">__PORTFOLIO_DATA_JSON__</script>
<script>
// 8ª rodada, reorganização geral, ponto 3: estrutura de múltiplos meses de referência.
// O JSON embutido agora é {months:{<chave AAAA-MM>: <dados do mês, mesmo formato de antes>},
// monthOrder:[...], defaultMonth:<chave>}. Hoje só existe um mês (2026-07), mas a estrutura já
// suporta acumular meses futuros: para adicionar um novo mês, lê-se o JSON já publicado neste
// artefato (via leitura do HTML ao vivo), inclui-se a nova chave em months/monthOrder e
// republica-se — sem precisar de nenhum armazenamento externo.
const RAW = JSON.parse(document.getElementById('portfolio-data').textContent);
const MONTHS = RAW.months, MONTH_ORDER = RAW.monthOrder, DEFAULT_MONTH = RAW.defaultMonth;
let DATA, OPS, OPNAMES, GROUPS, AS_OF, currentMonthKey;
// Cache da cor fixa por securitizadora (ver getSecuritizadoraColorMap mais abaixo) -- declarada
// aqui em cima (não junto da função) porque loadMonth() já roda no carregamento do módulo, logo
// abaixo, e precisa zerar esse cache a cada troca de mês; um "let" declarado só lá embaixo
// ficaria em temporal dead zone nesse primeiro loadMonth(DEFAULT_MONTH) já disparado aqui.
let secColorMapCache = null;
// loadMonth -- resolução de operações "carregadas" de outro mês (teste Ago/26, atualização
// parcial por operação): correção pós-tentativa de publicação -- embutir o payload PESADO
// inteiro de cada operação (fluxo, indicadores, características) duplicado em todo mês novo
// quase dobrou o tamanho da página publicada por mês adicionado, estourando o limite de 16MB
// do Artifact com só 2 meses. Uma operação ainda não atualizada no mês corrente carrega só um
// ponteiro leve no JSON embutido ({_carried_from:'2026-07', ref_month:'2026-07'}), montado na
// hora de gerar o mês (ver merge_aug_test2.py) -- abaixo resolvemos esse ponteiro pro objeto
// completo da operação no mês de origem, sem duplicar nada no JSON. ref_month sempre reflete o
// mês REAL do dado, usado por opRefBadgeHtml/opRefLineHtml.
function loadMonth(key){
  if(!MONTHS[key]) key = DEFAULT_MONTH;
  currentMonthKey = key;
  const rawData = MONTHS[key];
  const resolvedOps = {};
  for(const name of Object.keys(rawData.operations)){
    const op = rawData.operations[name];
    if(op._carried_from && MONTHS[op._carried_from] && MONTHS[op._carried_from].operations[name]){
      resolvedOps[name] = Object.assign({}, MONTHS[op._carried_from].operations[name], {ref_month: op.ref_month || op._carried_from});
    } else {
      resolvedOps[name] = op;
    }
  }
  DATA = Object.assign({}, rawData, {operations: resolvedOps});
  OPS = DATA.operations;
  OPNAMES = Object.keys(OPS);
  GROUPS = DATA.groups;
  AS_OF = DATA.meta.as_of_date;
  secColorMapCache = null;
  try { localStorage.setItem('portalMonthKey', key); } catch(e){}
}
loadMonth(DEFAULT_MONTH);

/* ---------------- formatting helpers ---------------- */
function fmtDate(iso){
  if(!iso) return '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return `${m[3]}/${m[2]}/${m[1]}`;
}
function fmtMonthYear(iso){
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})/.exec(iso);
  if(!m) return iso;
  const meses=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${meses[parseInt(m[2],10)-1]}/${m[1].slice(2)}`;
}
// 8ª rodada, reorganização geral, ponto 6: formato "Abr/36" pedido para a coluna Vencimento
// da tabela de operações -- mesmo formato em que os vencimentos por fundo já chegam da
// planilha PPT (fund_positions[].vencimento), então esse formatador serve só como fallback
// (CVPAR, que não tem posição por fundo) a partir da data ISO do resumo.
const MESES_ABBR_PT = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function fmtVencAbbr(iso){
  if(!iso) return '—';
  const m = /^(\d{4})-(\d{2})/.exec(iso);
  if(!m) return iso;
  return `${MESES_ABBR_PT[parseInt(m[2],10)-1]}/${m[1].slice(2)}`;
}
// opRefBadgeHtml (teste de atualização parcial por operação, Ago/26 -- BR Prop): quando o
// portal ganha um mês novo no seletor de topo mas nem toda operação foi realmente atualizada
// pra esse mês (ex.: só BR Prop tem dado de Ago/26; as outras 42 continuam carregando o último
// valor de Jul/26), cada operação carregada "por arrasto" ganha um op.ref_month próprio (setado
// na hora de montar o JSON do mês novo, não em build_data.py) indicando de qual mês seu dado
// realmente é. Aqui comparamos esse valor com o mês selecionado (currentMonthKey, setado em
// loadMonth) -- se divergem, mostra uma etiqueta avisando, em vez de deixar o usuário achar que
// aquele número já é do mês selecionado (mesmo princípio de "não confiar cegamente no rótulo"
// já usado em Obrigações via obrigStatusInfo, agora aplicado ao seletor de período). Operação
// sem op.ref_month (o normal, quando o mês foi construído por inteiro) nunca mostra nada.
function opRefBadgeHtml(op){
  if(!op || !op.ref_month || op.ref_month === currentMonthKey) return '';
  return `<span class="refbadge" title="Esta operação ainda não foi atualizada para ${fmtVencAbbr(currentMonthKey)} -- dado exibido é de ${fmtVencAbbr(op.ref_month)}">dados de ${fmtVencAbbr(op.ref_month)}</span>`;
}
// opRefLineHtml (correção pós-publicação, 2º ajuste -- pedido explícito do usuário: "deixar
// embaixo do nome da operação e colocar para TODOS as datas de referência [...] TIRAR o texto
// que existe embaixo do nome hoje em dia [Securitizadora · Fundo · Agente Fiduciário] e
// substituir para Data Base: [...]"). Duas mudanças em relação à 1ª tentativa: (1) a linha de
// subtítulo antiga (Securitizadora/Fundo/Agente Fiduciário) SAI do cabeçalho -- já aparece
// duplicada no card "Características da Operação" mais abaixo na mesma página, então nada se
// perde; (2) a Data Base passa a aparecer SEMPRE, pra toda operação (não só as desatualizadas)
// -- antes, só aparecia quando divergia do mês selecionado, o que o usuário viu como
// inconsistente (BR Prop, em dia, não mostrava nada; outras operações mostravam). Continua
// destacada em var(--warn) só quando o dado realmente está atrasado em relação ao mês
// selecionado -- nesse caso o resto do cabeçalho (título, chip de status) segue igual, só essa
// linha muda de cor. Sidebar/tabela continuam com opRefBadgeHtml (chip, só quando atrasado) --
// esse ajuste é só pro cabeçalho de detalhe, único ponto sinalizado pelo usuário.
function opRefLineHtml(op){
  const effMonth = (op && op.ref_month) ? op.ref_month : currentMonthKey;
  const stale = effMonth !== currentMonthKey;
  return `<div class="sub${stale?' sub-stale':''}">Data Base: ${fmtVencAbbr(effMonth)}</div>`;
}
function vencSortKey(str){
  const m = /^([A-Za-zçÇ]{3})\/(\d{2})$/.exec(str||'');
  if(!m) return null;
  const idx = MESES_ABBR_PT.findIndex(x=> x.toLowerCase()===m[1].toLowerCase());
  const yy = parseInt(m[2],10);
  const year = yy < 70 ? 2000+yy : 1900+yy;
  return year*12 + (idx>=0?idx:0);
}
// Desloca só o MÊS/ANO exibido de uma data ISO ("AAAA-MM-DD" ou "AAAA-MM"), preservando o
// dia -- usado só pro offset de exibição do gráfico de Índice de Cobertura (Residencial
// Itaim, 36ª rodada, ponto 7): a data crua da linha de fluxo fica sempre 1 mês atrás do mês
// que a operação realmente reporta (ver nota em IC_CHART_MONTH_OFFSET). Nunca usar o
// resultado pra comparar/selecionar linhas (janela do gráfico, dropdown "value=") -- só pra
// texto exibido (rótulo da barra, texto do dropdown).
function shiftMonthISO(iso, months){
  const m = /^(\d{4})-(\d{2})(-(\d{2}))?/.exec(iso||'');
  if(!m) return iso;
  const y = parseInt(m[1],10), mo = parseInt(m[2],10)-1, d = m[4]?parseInt(m[4],10):1;
  const dt = new Date(Date.UTC(y, mo + months, d));
  const yy = dt.getUTCFullYear(), mm = String(dt.getUTCMonth()+1).padStart(2,'0'), dd = String(dt.getUTCDate()).padStart(2,'0');
  return `${yy}-${mm}-${dd}`;
}
const nfCompact = new Intl.NumberFormat('pt-BR', {notation:'compact', maximumFractionDigits:1});
function fmtBRLCompact(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  return 'R$ '+nfCompact.format(v).replace(/\bmi\b/, 'MM');
}
// Correção pós-publicação (9ª rodada, ponto 3): "no Saldo Devedor sempre deixar assim XX,X MM"
// -- fmtBRLCompact usa notação compacta do Intl, que ora mostra 1 casa decimal ora nenhuma
// (ex.: "R$ 27 MM" em vez de "R$ 27,0 MM") e poderia até trocar de unidade (bi) num valor bem
// grande. Esse formatador é sempre em milhões, sempre com 1 casa decimal fixa.
function fmtSaldoMM(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  return 'R$ '+(v/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' MM';
}
const nfFull = new Intl.NumberFormat('pt-BR', {maximumFractionDigits:0});
function fmtBRLFull(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  return 'R$ '+nfFull.format(v);
}
// fmtBRLFull2 (correção pós-publicação, 2ª rodada): valor cheio COM centavos, igual ao
// exemplo do usuário pra tabela de Integralizações (ex.: "R$ 48.400.000,00").
const nfFull2 = new Intl.NumberFormat('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
function fmtBRLFull2(v){
  if(v===null||v===undefined||isNaN(v)) return '—';
  return 'R$ '+nfFull2.format(v);
}
function fmtNum(v, digits){
  if(v===null||v===undefined||isNaN(v)) return '—';
  return v.toLocaleString('pt-BR',{maximumFractionDigits:digits===undefined?2:digits, minimumFractionDigits:0});
}
function fmtNumFixed(v, digits){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const d = digits===undefined?2:digits;
  return v.toLocaleString('pt-BR',{minimumFractionDigits:d, maximumFractionDigits:d});
}
function fmtPct(v, digits){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const d = digits===undefined?2:digits;
  return (v*100).toLocaleString('pt-BR',{maximumFractionDigits:d, minimumFractionDigits:Math.min(2,d)})+'%';
}
function fmtRatio(v, digits){
  if(v===null||v===undefined||isNaN(v)) return '—';
  const d = digits===undefined?2:digits;
  return v.toLocaleString('pt-BR',{minimumFractionDigits:d, maximumFractionDigits:d})+'x';
}
function fmtGeneric(v){
  if(v===null||v===undefined||v==='') return '—';
  if(typeof v === 'number'){
    if(Math.abs(v) < 3 && v !== Math.round(v)) return fmtPct(v);
    return v.toLocaleString('pt-BR',{maximumFractionDigits:2});
  }
  if(typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v)) return fmtDate(v);
  return v;
}
function stripAccents(s){
  return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
}
// fmtCovVal (correção pós-publicação, 49ª rodada): a tabela de Acompanhamento (renderAcompSubview)
// formatava Exigido/Atual só com fmtGeneric, ignorando as flags _is_ratio/_is_pct que o painel
// de detalhe da operação (showDetail, ver fmtVal local ali) já respeitava -- daí um item como
// "Verificação Cessão Conta Vinculada" (Calçada, _is_pct:true) aparecer com "Exigido" em % mas
// "Atual" cru (4,58 em vez de 458,00%) na aba de Acompanhamento, divergente da própria página da
// operação. Mesma regra de fmtVal, reaproveitada aqui pra qualquer linha da tabela cross-
// portfolio (canônica ou minerada) que carregue essas flags.
function fmtCovVal(r, v){
  if(r._is_ratio) return fmtRatio(v,2);
  if(r._is_pct) return fmtPct(v, r._pct_decimals!=null?r._pct_decimals:2);
  return fmtGeneric(v);
}

// remuneracaoDisplay() (pedido do usuário: "tem que aparecer a mesma visualização em todos os

          vencimento: fp.vencimento || fmtVencAbbr(s.data_vencimento),

// allOperationRows() (52ª rodada): 1 linha por OPERAÇÃO (não por posição de fundo), só pra aba
// "Todos" da tabela de Operações -- allPositionRows() continua existindo do jeito que está
// (granular por fundo/série) porque os gráficos de rosca (Exposição por Indexador sobretudo)
// dependem dessa granularidade pra classificar cada SÉRIE certinho, não a operação inteira (ver
// nota da 15ª rodada em computeIndexadorDonut -- sem isso, PKK/Apil voltam a cair num "Misto"
// que o usuário já rejeitou antes). Pedido do usuário nessa rodada: "na parte de Todos, estamos
// trazendo todas as operações repetidas mas segregadas por fundo [...] ficou melhor deixar nessa
// sessão de todos todas as operações, e deixar a quebra por fundo nas suas respectivas abas".
//
// Saldo Devedor: SOMA de fp.saldo_curva_mm de todas as posições da operação -- calculado aqui, a
// partir do mesmo dado granular que já aparece nas abas por fundo, e NÃO copiado de
// op.summary.saldo_devedor. Checado caso a caso antes de decidir isso (pedido do usuário: "presta
// atenção nas questões de Saldo Devedor... vai ser o consolidado de todos os fundos"): o campo
// summary.saldo_devedor vem de uma fonte diferente (planilha de Acompanhamento, não o PPT de
// posições) e diverge muito em vários casos -- ex. GT: soma real das posições R$41,3MM vs
// summary R$164MM; Villa XP: R$27MM vs R$673MM (ordens de grandeza diferentes); e em operações
// com mais de uma série o campo às vezes nem chega como 1 número, vem concatenado tipo
// "83584465 43332249 11183065" (mesmo problema de fundo já documentado pro indexador). Mesmo
// princípio da correção de status por data: o portal calcula a partir do dado granular real, não
// replica um campo agregado de outra fonte que pode estar errado.
//
// Remuneração/Vencimento: quando todas as posições da operação têm o mesmo valor (maioria dos
// casos), mostra normalmente. Quando divergem entre fundos -- tranches/séries diferentes dentro
// da mesma operação, ex. Alianza (GRU vence Jan/32, Mauá vence Fev/32) ou PKK (séries em IPCA e
// em CDI) -- junta os valores distintos com " / " em vez de esconder a divergência escolhendo 1
// arbitrariamente; o detalhe por posição continua disponível na aba do fundo específico.
// vencimentoSortKey guarda o vencimento MAIS PRÓXIMO entre as posições divergentes (critério
// conservador), pra ordenação por coluna continuar funcionando mesmo quando o texto exibido é
// um "Mmm/aa / Mmm/aa" que vencSortKey() sozinho não consegue parsear.
// opSaldoDevedor() (pente-fino a pedido do usuário: "checar os saldos devedores, para
// verificar se há algum erro"): extrai pra função própria o MESMO cálculo que a tabela de
// Operações já usava inline (fp-sum quando há fund_positions -- ver comentário logo abaixo),
// pra reaproveitar no quickstat "Saldo Devedor" da página de detalhe (#quickstats), que até
// aqui lia s.saldo_devedor DIRETO -- 2 problemas reais encontrados nessa checagem:
// 1) Bug confirmado: em pelo menos 11 operações (Apil, ECLA, Habibs, IBL, JALGP, LBV, Lux,
//    MegaModa, PKK, Pirelli, SKR) o campo s.saldo_devedor vem CONCATENADO da planilha de
//    Acompanhamento (ex. SKR: "34562899.498212 14589241.1075", 2 séries grudadas num texto só
//    -- mesmo bug de fundo já documentado abaixo pro Indexador/Saldo Devedor da tabela de
//    Operações). fmtBRLCompact(string com espaço) cai no isNaN() e retorna "—": o quickstat
//    ficava literalmente em branco nessas 11 operações (confirmado via captura de tela antes
//    do fix). Com opSaldoDevedor(), o quickstat passa a usar a MESMA soma granular por fundo
//    (número limpo, sem concatenação) já usada e aprovada na tabela de Operações.
// 2) Inconsistência entre telas: mesmo quando s.saldo_devedor É um número válido, ele podia
//    divergir MUITO do fp-sum (a mesma divergência já documentada abaixo pra tabela de
//    Operações -- GT, Villa XP etc.) -- ex. MSB Edson mostrava R$11,7 MM no quickstat da
//    página de detalhe mas R$61,4 MM na tabela de Operações da Visão Geral, PARA A MESMA
//    OPERAÇÃO. Usar a mesma função nos 2 lugares elimina esse tipo de contradição -- as 2
//    telas agora sempre mostram o mesmo número, calculado do mesmo jeito.
function opSaldoDevedor(op){
  const fps = op.fund_positions;
  if(fps && fps.length){
    return fps.reduce((sum,fp)=> sum + (fp.saldo_curva_mm!=null ? fp.saldo_curva_mm*1e6 : 0), 0);
  }
  return op.summary.saldo_devedor;
}
// opSaldoDevedorTotal() (correção sobre a correção -- pedido do usuário: "no quadrante do saldo
// devedor não está batendo com a tabela de posição por fundo... talvez aqui tenha alguma
// divergência de fonte" + "o saldo devedor aqui tem que ser TOTAL, se não faz sentido esse %
// embaixo"): opSaldoDevedor() acima soma só as posições que os FUNDOS DA MAUÁ têm na operação
// (o que a tabela "Posição por Fundo" mostra) -- em operações com % Mauá < 100% (co-investimento
// com outros cotistas/terceiros no MESMO CRI), essa soma NUNCA vai bater com o saldo devedor
// TOTAL do CRI, porque ela structuralmente não inclui a fatia de fora. Não é erro, é a definição
// -- mas então o quickstat "Saldo Devedor" (que mostra "(XX% Mauá)" embaixo) precisa do TOTAL, não
// da fatia, senão o % perde o sentido (63% de quê, se o número de cima já é só a nossa fatia?).
// Confirmado numericamente: fp-sum / s.saldo_devedor bate com s.pct_maua em praticamente toda
// operação com % Mauá<100% (ex.: Villa XP 0,040 vs pct_maua 0,04; Vista Faria Lima 0,2916 vs
// 0,2917; GT 0,2518 vs 0,25) -- ou seja, s.saldo_devedor (fonte: planilha de Acompanhamento) JÁ É
// o total certo; opSaldoDevedor() (fp-sum) é só a fatia da Mauá dentro desse total.
// Daí opSaldoDevedorTotal() abaixo: usa s.saldo_devedor direto sempre que for um número (agora
// SEMPRE, depois da correção da concatenação multi-série no build_data.py -- ver comentário em
// parse_base_sheet/papel) -- só cai pro fp-sum como último recurso quando s.saldo_devedor
// realmente não existe (ex.: Vitacon, que não tem essa info na aba de Acompanhamento). Usado no
// quickstat "Saldo Devedor" e deve ser usado em qualquer outro lugar que descreva o TOTAL da
// operação (não a posição da Mauá) -- opSaldoDevedor() continua sendo o certo pra Posição por
// Fundo/tabela de Operações da Visão Geral, que são views de EXPOSIÇÃO da Mauá, não do total.
function opSaldoDevedorTotal(op){
  const s = op.summary;
  if(typeof s.saldo_devedor === 'number') return s.saldo_devedor;
  return opSaldoDevedor(op);
}
function allOperationRows(){
  return OPNAMES.map(name=>{
    const op = OPS[name];
    const s = op.summary;
    const fps = op.fund_positions;
    if(fps && fps.length){
      const saldoDevedor = opSaldoDevedor(op);
      const emissor = fps.map(fp=>cleanVal(fp.emissor)).find(Boolean);
      const taxas = [...new Set(fps.map(fp=>fp.taxa).filter(Boolean))].sort();
      // vencs ordenado cronologicamente (não pela ordem de aparição em fund_positions) -- "Jan/32
      // / Fev/32" lê melhor que "Fev/32 / Jan/32" quando a operação tem tranches divergentes.
      const vencs = [...new Set(fps.map(fp=>fp.vencimento).filter(Boolean))]
        .sort((a,b)=> (vencSortKey(a)??Infinity) - (vencSortKey(b)??Infinity));
      const vencKeys = vencs.map(v=>vencSortKey(v)).filter(k=>k!=null);
      return {
        opName: name,
        securitizadora: emissor || cleanVal(s.securitizadora) || '—',
        agenteFiduciario: cleanVal(s.agente_fiduciario) || '—',
        valorEmissao: s.valor_emissao,
        saldoDevedor,
        remuneracao: remuneracaoDisplay(s, taxas.length ? taxas.join(' / ') : ((s.indexador||'—') + (s.taxa_juros!=null?' + '+fmtPct(s.taxa_juros,2):''))),
        vencimento: vencs.length ? vencs.join(' / ') : fmtVencAbbr(s.data_vencimento),
        vencimentoSortKey: vencKeys.length ? Math.min(...vencKeys) : null,
        serieId: name,
      };
    }
    return {
      opName: name,
      securitizadora: cleanVal(s.securitizadora) || '—',
      agenteFiduciario: cleanVal(s.agente_fiduciario) || '—',
      valorEmissao: s.valor_emissao,
      saldoDevedor: s.saldo_devedor,
      remuneracao: (s.indexador||'—') + (s.taxa_juros!=null?' + '+fmtPct(s.taxa_juros,2):''),
      vencimento: fmtVencAbbr(s.data_vencimento),
      vencimentoSortKey: vencSortKey(fmtVencAbbr(s.data_vencimento)),
      serieId: name,
    };
  });
}
function filteredOperationRows(ft){
  const ftn = stripAccents(ft||'');
  return allOperationRows().filter(row=> positionRowMatches(row, ftn));
}

function positionRowMatches(row, ftNormalized){
  if(!ftNormalized) return true;
  const hay = stripAccents([row.opName, row.fundo, row.securitizadora, row.agenteFiduciario, OPS[row.opName].summary.concentracao].filter(Boolean).join(' '));
  return hay.includes(ftNormalized);
}

function filteredPositionRows(ft){
  const ftn = stripAccents(ft||'');
  return allPositionRows().filter(row=>{
    if(fundFilter && row.fundo !== fundFilter) return false;
    return positionRowMatches(row, ftn);
  });
}

// Coluna "Fundo" removida (52ª rodada): a tabela de Operações agora tem 2 modos -- "Todos"
// mostra 1 linha por operação (allOperationRows, consolidado) e cada aba de fundo específica
// (MCCI, MCCE etc.) mostra 1 linha por posição daquele fundo (allPositionRows, filtrado) -- nos
// dois casos a coluna Fundo ficaria redundante (em "Todos" cada operação só aparece 1 vez; numa
// aba de fundo específica toda linha já é do mesmo fundo). Pedido do usuário: "se já está dentro
// do fundo não precisa da coluna". O campo `fundo` continua existindo nos objetos-linha (usado
// internamente pro filtro dos chips), só não é mais uma coluna visível.
const COLS = [
  {key:'opName', label:'Operação', type:'text'},
  {key:'securitizadora', label:'Securitizadora', type:'text'},
  // Agente Fiduciário (pedido do usuário: "essa coluna de agente fiduciário da visão geral
  // pode tirar" -- muitas operações têm valores inconsistentes/pouco úteis nessa visão, ex.
  // "Vórtx"/"Vortx" grafados diferente lado a lado). O campo `agenteFiduciario` continua
  // existindo nos objetos-linha (usado internamente pela busca -- ver hay() acima), só não é
  // mais uma coluna visível -- mesmo padrão já usado antes pra tirar a coluna Fundo.
  // Volume Emissão (pedido do usuário): vem ANTES de Saldo Devedor de propósito -- "a ideia é
  // ter a visão rápida do % que temos em relação ao volume de Emissão", ou seja, ler as 2
  // colunas lado a lado (emissão -> quanto ainda devemos dela) é o ponto, não só mais um dado
  // solto. Mesmo formatador (fmtSaldoMM) do Saldo Devedor -- unidade igual facilita comparar
  // as 2 colunas de cabeça, sem precisar fazer conta de MM pra bi. Valor vem de
  // op.summary.valor_emissao (mesmo campo já usado no quickstat "Emissão" da página de
  // detalhe) -- é um dado de OPERAÇÃO (1 valor por emissão), não por fundo/posição; repete
  // igual em cada linha de fundo da mesma operação (aba "Todos" x abas por fundo), o que é
  // esperado -- o volume total emitido não muda dependendo de qual fundo detém a posição.
  {key:'valorEmissao', label:'Volume Emissão', type:'num'},
  // "Saldo Devedor % Mauá" (pedido do usuário): renomeado só o rótulo da coluna, sem mudar o
  // dado -- o valor exibido já era a visão "curva" (posição/exposição da Mauá, soma de
  // fp.saldo_curva_mm -- ver opSaldoDevedor()/allPositionRows/allOperationRows acima), não o
  // Saldo Devedor TOTAL do CRI (que inclui outros investidores quando % Mauá<100%). O rótulo
  // antigo ("Saldo Devedor" simples) não deixava isso claro; o novo nome evita confundir esse
  // número com o Saldo Devedor Atualizado TOTAL que aparece em Características.
  {key:'saldoDevedor', label:'Saldo Devedor % Mauá', type:'num'},
  // Correção pós-publicação (11ª rodada, ponto único): "Remuneração" era type:'text', então o
  // header ficava alinhado à esquerda enquanto "Saldo Devedor" e "Vencimento" (as colunas de
  // valor vizinhas) ficam à direita -- 3 colunas de dado lado a lado com 2 alinhamentos
  // diferentes é exatamente o "textos desalinhados" que o usuário reportou (print da tabela
  // Operações, não das barras de Exposição por Securitizadora, essas já corrigidas antes).
  // type:'num' só decide a classe th-num do cabeçalho (não afeta a ordenação, que já comparava
  // como string); o alinhamento do <td> correspondente também precisa da classe "num" (ver
  // renderTableBody) para os dois lados baterem.

  {key:'vencimento', label:'Vencimento', type:'date'},

// Consolidadores da tabela de Operações (9ª rodada, pontos 2-3): sempre calculados a partir das
// linhas JÁ FILTRADAS (busca local + chip de fundo), então refletem o que está na tela. O total
// de saldo devedor e a quebra por securitizadora somam a própria linha (cada linha já é a fatia
// de UM fundo -- somar as linhas nunca conta a operação 2x, é literalmente a decomposição do
// saldo total entre os fundos). Só a contagem de "Operações" precisa deduplicar por nome, porque
// uma operação em 2 fundos aparece em 2 linhas.
// Alguns registros de "Indexador" na planilha vêm concatenados de operações com várias séries
// (mesmo problema de fundo do "Saldo Devedor" nesses casos -- ver aviso ao usuário na 9ª rodada),
// tipo "CDI CDI CDI" ou "IPCACDI CDI". Em vez de tentar separar por série, classifica pela
// presença dos textos "cdi"/"ipca": só CDI -> CDI, só IPCA -> IPCA, os 2 juntos -> Misto.
function classifyIndexador(raw){
  if(!raw) return null;
  const hasCDI = /cdi/i.test(raw);
  const hasIPCA = /ipca/i.test(raw);
  if(hasCDI && hasIPCA) return 'Misto';
  if(hasCDI) return 'CDI';
  if(hasIPCA) return 'IPCA';
  return 'Outro';
}

function computeOptableStats(rows){
  const uniqueOps = [...new Set(rows.map(r=>r.opName))];
  const totalSaldo = rows.reduce((sum,r)=> sum + (r.saldoDevedor||0), 0);
  return { nOps: uniqueOps.length, nRows: rows.length, totalSaldo };
}

// Correção pós-publicação (21ª rodada, ponto 3): "essas informações pode tirar" -- a nota
// "clique numa linha para ver o detalhe · N posições" saiu do cabeçalho do card Operações
// (pedido do usuário). #optable-meta ficou sem uso (o <span> continua no HTML, só vazio, caso
// alguma outra nota curta precise aparecer ali no futuro).
function renderOptableStats(rows){
  const stats = computeOptableStats(rows);
  document.getElementById('optable-stats').innerHTML = `
    <div class="optable-stat"><span class="lbl">Operações</span><span class="val">${stats.nOps}</span></div>
    <div class="optable-stat"><span class="lbl">Saldo Devedor Total</span><span class="val">${fmtSaldoMM(stats.totalSaldo)}</span></div>
  `;
}

// Correção pós-publicação (13ª rodada): "Exposição por Securitizadora" deixou de ser uma lista
// de barras por VOLUME (R$) e virou o 1º de 3 gráficos de rosca lado a lado, todos por
// QUANTIDADE de operação (uma operação em 2 fundos conta 1 vez -- mesma regra de dedupe já usada
// nos cards). Sem biblioteca de gráfico (padrão do portal, ver buildChart/SVG inline mais abaixo):
// a rosca é desenhada com <circle> + stroke-dasharray, um círculo por fatia, sobrepostos e
// girados -90° pra começar no topo. Pequeno "gap" entre fatias (stroke-dasharray reduzido) só
// pra separar visualmente, sem precisar de borda/stroke extra.
//
// Correção pós-publicação (14ª rodada): paleta trocada de "arco-íris" pra uma rampa sequencial
// derivada do ÚNICO azul-marinho que já é a cor da Mauá no resto do portal (var(--accent) /
// var(--accent-strong)) -- só luminância varia, nunca o matiz. "Não informado"/"—" nunca entra
// na rampa por índice (isso faria a cor de "dado ausente" mudar dependendo de quantas categorias
// existem) -- é sempre o mesmo cinza neutro, atribuído explicitamente.
// Os 2 temas (claro/escuro) têm rampas DIFERENTES (ver --chart-1..8/--chart-neutral no <style>):
// o mesmo tom que contrasta bem contra um card branco fica quase invisível contra um card escuro
// (achado testando o tema escuro depois da 1ª versão -- a fatia mais escura/mais expressiva
// sumia contra o fundo). Por isso a rampa é sempre lida via cssVar() (computada no momento do
// render), nunca um array de hex fixo -- lê o tom certo pra qualquer tema automaticamente.
function donutRamp(){
  return [1,2,3,4,5,6,7,8].map(i=> cssVar(`--chart-${i}`));
}
function donutNeutral(){ return cssVar('--chart-neutral'); }
function isUnknownLabel(label){ return label==='Não informado' || label==='—'; }

function uniqueOpRows(rows){
  const seen = new Set();
  const out = [];
  rows.forEach(r=>{ if(!seen.has(r.opName)){ seen.add(r.opName); out.push(r); } });
  return out;
}

// Cor de cada securitizadora é fixa pra sessão inteira (calculada 1x a partir da CARTEIRA
// TODA, não da view filtrada) -- assim, ao trocar de filtro/busca, a fatia da Opea nunca muda
// de cor, só de tamanho. Ordenada por exposição total (a mais comum recebe o tom mais forte da
// rampa) -- reaproveitado como critério de ordenação da legenda também. secColorMapCache é
// declarada lá em cima (perto de DATA/OPS) e invalidada em loadMonth() a cada troca de mês.
function getSecuritizadoraColorMap(){
  if(secColorMapCache) return secColorMapCache;
  const ramp = donutRamp();
  const uniq = uniqueOpRows(allPositionRows());
  const counts = {};
  uniq.forEach(r=>{
    const k = r.securitizadora || 'Não informado';
    if(isUnknownLabel(k)) return;
    counts[k] = (counts[k]||0)+1;
  });
  const names = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  const map = {};
  names.forEach((name,i)=>{ map[name] = ramp[i % ramp.length]; });
  secColorMapCache = map;
  return map;
}
function colorForSecuritizadora(label){
  return isUnknownLabel(label) ? donutNeutral() : (getSecuritizadoraColorMap()[label] || donutNeutral());
}

// Correção pós-publicação (18ª/19ª rodadas): "ainda tem informações sobrepostas" -- o usuário
// circulou o grupinho de securitizadoras com 1 operação cada (~2% do total) grudadas umas nas
// outras. A causa raiz e a correção de fato (não é aqui, é no desenho do anel) estão no
// comentário da 19ª rodada em buildDonutSVG, mais abaixo -- resumo: pontas de fatia arredondadas
// (stroke-linecap="round") forçavam um tamanho mínimo fixo pra qualquer fatia pequena. A 1ª
// tentativa de correção (agrupar tudo abaixo de 5% num "Outros") foi rejeitada pelo usuário --
// dado real não deveria desaparecer numa categoria genérica. Cada securitizadora continua com
// sua própria fatia e cor aqui embaixo.
// Correção pós-publicação (18ª rodada -- revertida): tentei agrupar securitizadoras com menos
// de 5% do total num item único "Outros (N)" pra resolver o problema de fatias minúsculas se
// sobrepondo visualmente. O usuário rejeitou de forma direta e correta: "não quero que junte
// tudo em outros... não faz sentido" -- cada securitizadora é uma informação real que precisa
// aparecer com seu próprio nome, não some numa caixa genérica só porque é pequena. O agrupamento
// era tratar o sintoma (fatias minúsculas ficando parecidas) escondendo dado em vez de consertar
// o desenho do gráfico, que era o problema de verdade -- ver a causa raiz e a correção de fato
// no comentário de buildDonutSVG logo abaixo. Voltou a ser uma lista simples, uma fatia por
// securitizadora, igual computeIndexadorDonut/computeVencimentoDonut.
function computeSecuritizadoraDonut(uniqueRows){
  const map = {};
  uniqueRows.forEach(r=>{
    const k = r.securitizadora || 'Não informado';
    map[k] = (map[k]||0)+1;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1])
    .map(([label,value])=>({label, value, color: colorForSecuritizadora(label)}));
}

// Correção pós-publicação (15ª rodada, ponto 4): a categoria "Misto" (14ª rodada) juntava numa
// mesma fatia operações com mais de uma série de CRI, uma em CDI e outra em IPCA (PKK, Apil).
// O usuário confirmou que entende a origem, mas pediu pra classificar por SÉRIE, não por
// operação: "preciso que seja ou CDI ou IPCA... mesmo que tenha mais de uma série, cada uma é
// uma emissão e tem seu próprio código". Ou seja, o corte certo aqui não é OPS[opName].summary.
// indexador (que concatena todas as séries da operação, ex. "IPCACDI CDI") -- é o remuneracao de
// CADA LINHA de allPositionRows(), que já vem por série (fp.taxa individual quando existe
// fund_positions). Dedupe por serieId (não por opName) pra não contar 2x uma série detida por
// mais de 1 fundo. Resultado: nunca mais aparece "Misto" (cada série já é limpa: só CDI ou só
// IPCA) -- e a contagem total deste gráfico passa a ser por SÉRIE (51 no exemplo testado), não
// mais por operação (44) -- por isso o footnote em renderOptableDonuts explica a base de contagem.
function getIndexadorColorMap(){
  const ramp = donutRamp();
  return { 'IPCA': ramp[1], 'CDI': ramp[4] };
}
function computeIndexadorDonut(rows){
  const colorMap = getIndexadorColorMap();
  const seen = new Set();
  const map = {};
  rows.forEach(r=>{
    if(seen.has(r.serieId)) return;
    seen.add(r.serieId);
    const c = classifyIndexador(r.remuneracao) || 'Outro';
    const label = c==='Outro' ? 'Outro / não informado' : c;
    map[label] = (map[label]||0)+1;
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1])
    .map(([label,value])=>({label, value, color: colorMap[label] || donutNeutral()}));
}

// Buckets de ano de vencimento (ponto 3, 13ª rodada): "pra ter ideia de quando esse dinheiro
// volta" -- ainda experimental (usuário avisou que pode tirar depois se não fizer sentido).
// Faixas escolhidas olhando a distribuição real da carteira (concentração 2030-2035); ajustar
// aqui se a composição da carteira mudar muito com o tempo. Ordem cronológica preservada (não
// ordenado por valor) -- é uma linha do tempo, não um ranking -- com cor mais escura pro prazo
// mais curto clareando à medida que o vencimento fica mais distante (leitura visual: quanto
// mais escuro, mais perto do caixa voltar).
const VENC_BUCKET_ORDER = ['Até 2029','2030–2032','2033–2035','2036–2039','2040+','Não informado'];
function getVencBucketColorMap(){
  const ramp = donutRamp();
  return { 'Até 2029': ramp[0], '2030–2032': ramp[2], '2033–2035': ramp[4], '2036–2039': ramp[6], '2040+': ramp[7] };
}
function vencBucketLabel(year){
  if(year==null) return 'Não informado';
  if(year<=2029) return 'Até 2029';
  if(year<=2032) return '2030–2032';
  if(year<=2035) return '2033–2035';
  if(year<=2039) return '2036–2039';
  return '2040+';
}
function computeVencimentoDonut(uniqueRows){
  const colorMap = getVencBucketColorMap();
  const map = {};
  uniqueRows.forEach(r=>{
    const sk = vencSortKey(r.vencimento);
    const year = sk!=null ? Math.floor(sk/12) : null;
    const b = vencBucketLabel(year);
    map[b] = (map[b]||0)+1;
  });
  return VENC_BUCKET_ORDER.filter(k=>map[k])
    .map(k=>({label:k, value:map[k], color: colorMap[k] || donutNeutral()}));
}

// Correção pós-publicação (15ª rodada, pontos 1-2): "quero como referência pra esses gráficos
// como se fosse um Power BI, então ainda pra deixar mais redondo" + "o gráfico sem o data label
// nele não faz sentido". Anel mais fino (strokeWidth 20->16, sobre um raio maior) com
// stroke-linecap="round" em cada fatia -- pontas arredondadas em vez de retas é o que dá o
// acabamento "redondo"/polido de ferramenta de BI, em vez do anel grosso de bordas retas de antes.
// Como o cap arredondado ocupa +strokeWidth de comprimento visual (metade em cada ponta), o
// desconto do "len" precisa ser o strokeWidth inteiro (não mais o gap de 2.4px de antes) --
// senão fatias vizinhas se sobrepõem visualmente.
//
// Correção pós-publicação (16ª rodada, ponto único): "olha só como ficou ruim" -- na 1ª versão
// dos rótulos o anel era desenhado até a borda EXATA do canvas SVG (raio + metade do traço =
// metade do "size", sem folga nenhuma), então quando um rótulo caía perto do topo/base/lateral
// ele era cortado pelo próprio limite do SVG. Corrigido com um "pad" explícito de sobra entre o
// anel e a borda do canvas.
//
// Correção pós-publicação (17ª rodada, ponto 1): mesmo sem cortar mais, o anel continuava
// pequeno demais -- "aumenta esse gráfico, as informações não cabendo". Anel cresceu pra 196px
// (era 150).
//
// Correção pós-publicação (18ª rodada, ponto único): "ainda não ajustou" -- a causa real, achada
// só agora com a imagem ampliada em pixel: o rótulo ficava centralizado EM CIMA do próprio traço
// do anel, e a cor do texto era escolhida pra contrastar com a fatia por baixo (claro/escuro).
// Isso funciona nos pontos onde o anel corre na horizontal (topo/base -- "18%", "9%", "14%" da
// captura ficaram legíveis), mas quebra nos pontos cardeais leste/oeste (3h/9h): ali o anel corre
// na VERTICAL, então a espessura do traço na direção horizontal (onde o texto se estende) é só
// strokeWidth (16-18px) -- menor que a largura do texto ("43%" ~26px). A parte do texto que
// sobra cai fora do anel, sobre o fundo branco do card, com a MESMA cor clara escolhida pro
// contraste com a fatia escura -- texto branco em fundo branco, invisível (por isso "43%"
// aparecia cortado como "3%"). Correção estrutural, não cosmética: o rótulo saiu de CIMA do
// anel e passou pra um raio um pouco MAIOR, sempre na margem (pad) reservada ao redor do anel --
// ou seja, sempre sobre o fundo do card, nunca sobre a fatia. Isso elimina o problema pela raiz
// (não depende mais de qual fatia está por baixo em cada ângulo) e permite uma cor de texto
// única (var(--ink), a mesma tinta de texto do resto do portal) em vez de calcular contraste por
// fatia.
//
// Correção pós-publicação (19ª rodada -- a de verdade, achando a causa raiz certa): o usuário
// voltou a apontar sobreposição ("informações sobrepostas", circulado em amarelo) e, quando a
// 1ª tentativa de correção (agrupar as pequenas num "Outros") foi rejeitada ("não quero que
// junte tudo em outros... não faz sentido", "na primeira versão desse gráfico estava excelente,
// aí você começou a cagar"), ficou claro que o problema nunca foi o AGRUPAMENTO de dado -- foi
// uma escolha de desenho que eu mesmo introduzi na 15ª rodada e nunca devia ter entrado: pra
// atender "ainda pra deixar mais redondo" eu troquei as pontas de cada fatia de retas
// (stroke-linecap:"butt", o padrão) pra arredondadas (stroke-linecap:"round"), e descontei o
// strokeWidth INTEIRO do comprimento de cada fatia pra abrir espaço pra essas pontas redondas
// (dashLen = segLen - strokeW). Isso tem um efeito colateral sério: uma ponta redonda tem
// diâmetro = strokeWidth (16px) SEMPRE, não importa o tamanho da fatia -- então qualquer fatia
// cujo comprimento verdadeiro (segLen) seja menor que ~2×strokeWidth (aqui, menor que ~8-9% do
// total) fica com dashLen artificialmente espremido até quase 0, e o que sobra na tela é só a
// ponta redonda de tamanho fixo -- ou seja, uma fatia de 2% e uma de 4% acabam desenhadas com o
// MESMO tamanho de "bolinha", em vez de uma ser visivelmente menor que a outra. Com 3-4
// categorias nessa faixa lado a lado (Vórtx, Bari Sec, Vert, "Não informado" -- 1 operação cada),
// o resultado são bolinhas idênticas coladas umas nas outras. Reverter as pontas pra retas
// (removendo stroke-linecap:"round") e trocar o desconto de "strokeWidth inteiro" por uma folga
// fixa pequena (GAP_PX, só o suficiente pra separar visualmente uma fatia da vizinha) resolve
// pela raiz: cada fatia passa a ocupar um comprimento proporcional ao seu valor real, por menor
// que seja -- nunca colapsa num tamanho mínimo fixo. É também, na prática, como o Power BI
// desenha essas fatias pequenas (uma fatia fininha e proporcional, não uma bolinha arredondada) --
// a leitura de "mais redondo" da 15ª rodada devia ter sido sobre o ANEL como forma geral (um
// círculo cheio, sem cantos), não sobre arredondar a ponta de cada fatia individualmente.
// Correção pós-publicação (20ª rodada): o usuário mandou um print de referência real de Power
// BI ("% Receita") pra mostrar exatamente o formato que quer -- e ele confirma o diagnóstico da
// 19ª rodada (fatias de ponta reta, sem arredondamento) e mostra mais uma coisa que eu não tinha
// pego: o rótulo de porcentagem fica DENTRO da própria fatia (texto em negrito, branco sobre as
// fatias escuras, escuro sobre as claras), não fora do anel como eu tinha deixado na 18ª rodada.
// O motivo de eu ter tirado o rótulo de cima da fatia na 18ª rodada foi genuíno (o texto
// vazava/ficava ilegível nos pontos 3h/9h porque o traço ali era fino demais pra caber a largura
// do texto) -- mas a causa disso era o anel FINO (strokeWidth 16), não o fato de o rótulo estar
// em cima da fatia. O print de referência usa um anel bem mais GROSSO (a espessura do traço é
// bem mais que o dobro do que eu tinha) -- grosso o bastante pra que, em qualquer ângulo do
// círculo (inclusive 3h/9h, onde a espessura "horizontal" do traço é exatamente strokeWidth),
// a largura do texto do rótulo (no máximo ~4 caracteres, tipo "100%") caiba dentro do traço com
// folga. Aumentando strokeWidth de 16 pra 46 (sobre um raio menor, pra caber no mesmo canvas de
// 200px) resolve a causa raiz de vez -- o rótulo pode voltar pra dentro da fatia com segurança,
// em qualquer posição do anel, sem reintroduzir o bug da 18ª rodada.
function buildDonutSVG(segments, opts){
  opts = opts||{};
  const size = opts.size||200, strokeW = opts.strokeWidth||46, pad = opts.labelPad!=null?opts.labelPad:10;
  const r = (size - 2*pad - strokeW)/2, cx=size/2, cy=size/2;
  const circumference = 2*Math.PI*r;
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  // Folga fixa e pequena entre fatias (ver comentário da 19ª rodada acima) -- separa uma fatia
  // da vizinha sem forçar nenhuma fatia pequena a um tamanho mínimo artificial.
  const GAP_PX = 2.2, MIN_DASH = 1.4;
  let offset = 0;
  const arcs = [], labels = [];
  segments.forEach(seg=>{
    const frac = seg.value/total;
    const segLen = frac*circumference;
    const dashLen = Math.max(segLen - GAP_PX, MIN_DASH);
    const dashoffset = -offset;
    const midFrac = (offset + segLen/2)/circumference;
    offset += segLen;
    // classe/atributos donut-arc (45ª rodada): pura interatividade (tooltip via delegação, ver
    // initDonutTooltip) -- não mudam nada do desenho em si (mesmo raio/cor/dasharray de sempre).
    const pctForAttr = Math.round(frac*100);
    arcs.push(`<circle class="donut-arc" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${seg.color}" stroke-width="${strokeW}" stroke-dasharray="${dashLen.toFixed(2)} ${(circumference-dashLen).toFixed(2)}" stroke-dashoffset="${dashoffset.toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" data-label="${seg.label}" data-pct="${pctForAttr}" data-value="${seg.value}" data-color="${seg.color}"/>`);
    // Rótulo só a partir de ~6% do total (mesmo corte do print de referência, cuja menor fatia
    // com rótulo é 6%) -- abaixo disso o texto não cabe com folga confortável mesmo num anel
    // grosso, e o valor exato já está na legenda abaixo do gráfico.
    if(frac >= 0.06){
      const theta = midFrac*2*Math.PI;
      const lx = cx + r*Math.sin(theta);
      const ly = cy - r*Math.cos(theta);
      const pct = Math.round(frac*100);
      const txtColor = labelTextColor(seg.color);
      labels.push(`<text x="${lx.toFixed(2)}" y="${ly.toFixed(2)}" text-anchor="middle" dominant-baseline="central" style="font-family:var(--font-mono);font-weight:700;font-size:12.5px;fill:${txtColor};">${pct}%</text>`);
    }
  });
  // Track num tom levemente distinto do fundo do card (var(--surface-2) sobre var(--surface),
  // já que os cards passaram a usar a mesma superfície elevada dos outros gráficos do portal).
  const track = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${strokeW}"/>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${track}${arcs.join('')}${labels.join('')}</svg>`;
}
// Cor de texto por contraste (reintroduzida na 20ª rodada -- removida na 18ª quando o rótulo
// saiu de cima da fatia, agora segura de novo porque o anel grosso elimina o overflow que
// causava o bug "43%"->"3%" daquela rodada). Luminância relativa simples (fórmula padrão
// sRGB) pra escolher branco sobre fatia escura / tinta escura sobre fatia clara, igual ao
// print de referência (branco nas fatias azul-marinho escuras, escuro nas mais claras/cinza).
function hexLuminance(hex){
  const h = (hex||'').replace('#','');
  if(h.length<6) return 0;
  const r=parseInt(h.slice(0,2),16)/255, g=parseInt(h.slice(2,4),16)/255, b=parseInt(h.slice(4,6),16)/255;
  const lin = c => c<=0.03928 ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  return 0.2126*lin(r) + 0.7152*lin(g) + 0.0722*lin(b);
}
function labelTextColor(hex){
  return hexLuminance(hex) > 0.42 ? '#12181f' : '#ffffff';
}

function donutCardHtml(title, segments, footnote){
  const total = segments.reduce((s,x)=>s+x.value,0);
  const svg = buildDonutSVG(segments);
  const legend = segments.map((seg)=>{
    const pct = total ? (seg.value/total*100) : 0;
    return `<div class="donut-legend-row"><span class="sw" style="background:${seg.color}"></span><span class="lbl">${seg.label}</span><span class="valwrap"><span class="pct">${pct.toLocaleString('pt-BR',{maximumFractionDigits:0})}%</span><span class="n">${seg.value}</span></span></div>`;
  }).join('');
  // Cabeçalho "%"/"Qtd" (ponto 3, 15ª rodada) só faz sentido com dado embaixo -- pulado no
  // estado vazio (0 segmentos), que já mostra a mensagem "Sem dados." sozinha.
  const head = segments.length ? `<div class="donut-legend-head"><span class="lbl"></span><span class="pct">%</span><span class="n">Qtd</span></div>` : '';
  return `
    <div class="donutcard">
      <h4>${title}</h4>
      <div class="donutwrap">${svg}</div>
      ${head}
      <div class="donut-legend" id="dlg-${title.replace(/[^a-zA-Z0-9]/g,'')}">${legend || '<div class="chart-empty" style="padding:6px 0;">Sem dados.</div>'}</div>
      ${footnote ? `<div class="chart-note" style="margin-top:9px;">${footnote}</div>` : ''}
    </div>
  `;
}

function renderOptableDonuts(rows){
  const uniq = uniqueOpRows(rows);
  const secData = computeSecuritizadoraDonut(uniq);
  // Indexador conta por SÉRIE (rows já filtradas por fundo/busca, dedupe interno por serieId --
  // ver computeIndexadorDonut), não por operação -- por isso passa `rows`, não `uniq`.
  // Correção pós-publicação (17ª rodada, ponto 2): nota explicativa "Contagem por série de
  // CRI..." removida do card (pedido do usuário) -- o critério em si continua o mesmo, só não
  // aparece mais escrito na tela.
  const idxData = computeIndexadorDonut(rows);
  const vencData = computeVencimentoDonut(uniq);
  const html =
    donutCardHtml('Exposição por Securitizadora', secData) +
    donutCardHtml('Exposição por Indexador', idxData) +
    donutCardHtml('Concentração por Vencimento', vencData);
  document.getElementById('optable-donuts').innerHTML = html;
  // Degradê no rodapé da legenda só quando ela realmente tem mais itens do que cabem (ver CSS
  // .donut-legend.is-scrollable) -- checado depois de montar o HTML, quando as alturas já
  // existem no DOM.
  document.querySelectorAll('.donut-legend').forEach(el=>{
    if(el.scrollHeight > el.clientHeight + 1) el.classList.add('is-scrollable');
  });
}

// getOptableRowSets() (52ª rodada): separa as linhas usadas pelos gráficos/stats das linhas
// usadas pela TABELA -- os gráficos (sobretudo "Exposição por Indexador") continuam sempre
// granulares por posição/série (statsRows = filteredPositionRows, sem mudança nenhuma aqui,
// ver nota grande em computeIndexadorDonut/allOperationRows), mas a tabela em si agora mostra 1
// linha por operação quando "Todos" está selecionado (tableRows = filteredOperationRows) e volta
// a ser granular quando uma aba de fundo específica está ativa (fundFilter setado).
function getOptableRowSets(){
  const statsRows = filteredPositionRows(tableSearchText);
  const tableRows = fundFilter ? statsRows : filteredOperationRows(tableSearchText);
  return { statsRows, tableRows };
}

// Atualização parcial (ponto 4): chamada a cada tecla digitada na busca local -- só troca o
// conteúdo dos stats/gráficos/corpo da tabela, nunca recria o <input>, senão o campo perderia o
// foco e o cursor a cada letra digitada (bug clássico de re-render completo sobre um input).
function updateOptableData(){
  const { statsRows, tableRows } = getOptableRowSets();
  renderOptableStats(statsRows);

function renderTableBody(rows){
  const sorted = [...rows].sort((a,b)=>{
    let va = a[sortState.col], vb = b[sortState.col];
    // vencimentoSortKey (52ª rodada): linhas consolidadas de allOperationRows() com vencimentos
    // divergentes entre fundos mostram um texto tipo "Jan/32 / Fev/32" que vencSortKey() sozinho
    // não reconhece (regex espera só "Mmm/aa") -- quando a linha já traz essa chave pré-calculada
    // (o vencimento mais próximo entre as posições), usa ela pra ordenar; senão cai no
    // comportamento de sempre (vencSortKey do texto exibido, linhas de allPositionRows() nunca
    // têm esse campo).
    if(sortState.col==='vencimento'){
      va = (a.vencimentoSortKey!=null) ? a.vencimentoSortKey : vencSortKey(va);
      vb = (b.vencimentoSortKey!=null) ? b.vencimentoSortKey : vencSortKey(vb);
    }
    if(typeof va === 'string') va = stripAccents(va);
    if(typeof vb === 'string') vb = stripAccents(vb);
    if(va===null||va===undefined) va = sortState.dir==='asc' ? Infinity : -Infinity;
    if(vb===null||vb===undefined) vb = sortState.dir==='asc' ? Infinity : -Infinity;
    if(va<vb) return sortState.dir==='asc'?-1:1;
    if(va>vb) return sortState.dir==='asc'?1:-1;
    return 0;
  });
  const tbody = document.getElementById('optable-body');
  if(sorted.length===0){
    tbody.innerHTML = `<tr><td colspan="${COLS.length}"><div id="empty-state">Nenhuma operação encontrada.</div></td></tr>`;
    return;
  }
  tbody.innerHTML = sorted.map(row=>{
    return `<tr data-name="${row.opName.replace(/"/g,'&quot;')}">
      <td class="opname"><span class="opname-text">${row.opName}</span></td>
      <td data-label="Securitizadora">${row.securitizadora}</td>
      <td class="num" data-label="Volume Emissão">${fmtSaldoMM(row.valorEmissao)}</td>
      <td class="num" data-label="Saldo Devedor">${fmtSaldoMM(row.saldoDevedor)}</td>
      <td class="num" data-label="Remuneração">${row.remuneracao}</td>
      <td class="num" data-label="Vencimento">${row.vencimento}</td>
    </tr>`;
  }).join('');
  tbody.querySelectorAll('tr').forEach(tr=>{
    tr.addEventListener('click', ()=> showDetail(tr.dataset.name));
  });
}

/* ---------------- acompanhamento (cross-portfolio) ---------------- */
// AS_OF é atribuído por loadMonth().
// 48ª rodada, correção sobre a 46ª/47ª: a 47ª tinha transformado Obrigações/Ordinário em 2
// ABAS DE NAVEGAÇÃO de nível superior (ao lado de "Visão Geral") -- o usuário corrigiu: "aqui
// pode deixar acompanhamentos [no menu de cima]. mas dentro de acompanhamentos, vamos criar

// Conteúdo do bloco Obrigações também corrigido nessa rodada: antes eram só os cards
// sintéticos "Obrigações"/"Quórum de Assembleias" (quase sempre "conteúdo ainda não
// cadastrado", e Quórum nem é um dever de entrega -- "você trouxe informações de quorum de

// planilhas brutas (seguro, laudo de avaliação, DFs/demonstrações financeiras, cessão
// fiduciária -- ver obligation_bucket_of/mine_obligation_items em build_data.py), cada um com
// seu próprio prazo e status. Quórum de Assembleias e o card genérico "Obrigações" saem da
// aba de Acompanhamento por completo (_tipo=None no backend) -- continuam existindo
// normalmente na página de detalhe da operação, só não entram nesses 2 blocos.
// ACOMP_TABS: nível 1 de navegação dentro da aba Acompanhamento -- Obrigações / Ordinário.
// Via Assembleia (correção pós-publicação: "eu quero que tenha uma 'pasta' só com as
// obrigações via assembleia [...] acho que tudo junto pode acabar deixando passar algo")
// passou por 2 posições: 1ª tentativa como 3ª sub-aba no mesmo nível de Obrigações/Ordinário;

// tópico dentro de obrigações [...] faz mais sentido para a visualização e para o conteúdo da

// planilha), não uma categoria irmã de Ordinário. Agora é um NÍVEL 2 (OBRIG_SUBSECTIONS,

const ACOMP_TABS = {
  obrig: {
    tipo: null, // guarda-chuva: engloba as 2 OBRIG_SUBSECTIONS abaixo, não filtra sozinho
    title: 'Obrigações',
  },
  ord: {
    tipo: 'ordinario',
    title: 'Acompanhamento Ordinário',
    subtitle: 'Índices e fundos verificados rotineiramente (IC, LTV, Fundo de Reserva e afins).',
  },
};
// OBRIG_SUBSECTIONS: nível 2, só dentro da sub-aba Obrigações (ver obrigSubSection). Cada uma
// continua com seu próprio _tipo no backend (obrigacao/obrigacao_assembleia, ver
// mine_obligation_items/covenant sintético em build_data.py) -- os itens continuam
// SEGREGADOS em tabelas separadas (pedido do usuário, "pode acabar deixando passar algo"),
// só que agora aninhados como sub-divisão de uma única aba "Obrigações", em vez de 2 abas
// irmãs no nível de cima.
const OBRIG_SUBSECTIONS = {
  entrega: {
    tipo: 'obrigacao',
    title: 'Itens de Entrega e Renovação',
    subtitle: 'Deveres de entrega e renovação: seguro, laudo de avaliação, demonstrações financeiras (DFs) e cessão fiduciária.',
  },
  assembleia: {
    tipo: 'obrigacao_assembleia',
    title: 'Via Assembleia',
    subtitle: 'Obrigações identificadas em atas/aditamentos, sempre referentes à assembleia mais recente de cada operação — histórico completo e verificação de documento na pasta disponíveis na sub-página "Leitura de Atas e Aditamentos" de cada operação.',
  },
};
let acompFilters = { entrega: 'todos', assembleia: 'todos', ord: 'todos' };
let acompSubTab = 'obrig';
let obrigSubSection = 'entrega';

function daysBetween(a, b){
  return Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
}
// topicItemStatus (41ª rodada): mesma régua de covenantUrgency logo abaixo (≤30 dias até o
// vencimento = Verificar, já vencido = Desenquadrado, senão Enquadrado), reaproveitada pros
// itens de tópico (Obrigações Pecuniárias) que carregam um it.proximo (ISO). Calculado em cima
// de AS_OF -- mesma data de referência do resto do portal -- em vez de um status fixo.
function topicItemStatus(proximoIso){
  if(!proximoIso) return null;
  const d = daysBetween(AS_OF, proximoIso);
  if(d < 0) return 'Desenquadrado';
  if(d <= 30) return 'Verificar';
  return 'Enquadrado';
}
function allCovenantRows(){
  const rows = [];
  OPNAMES.forEach(name=>{
    OPS[name].covenants.forEach(c=> rows.push({opName:name, group:OPS[name].group, ...c}));
  });
  return rows;
}
function covenantUrgency(c){
  const sc = statusClass(c.status);
  if(sc==='critical') return 'critical';
  let dateUrgency = null;
  if(c.proxima_atualizacao){
    const d = daysBetween(AS_OF, c.proxima_atualizacao);
    if(d < 0) dateUrgency = 'critical';
    else if(d <= 30) dateUrgency = 'warn';
    else dateUrgency = 'good';
  }
  if(dateUrgency==='critical') return 'critical';
  if(sc==='warn' || dateUrgency==='warn') return 'warn';
  if(sc==='good') return 'good';
  return dateUrgency || 'neutral';
}
// obrigStatusInfo (51ª rodada): centraliza num único lugar a inteligência de status por data que
// antes só existia dentro da sub-aba Obrigações do Acompanhamento -- pedido explícito do usuário:
// "esse entendimento precisa ser replicado para todo o portal, inclusive nas abas de cada operação
// na sessão obrigações". Pra itens de ENTREGA/renovação (seguro, laudo, DF, cessão -- a pergunta
// real é "isso foi renovado a tempo?"), o veredito não pode confiar cegamente no texto "status" da
// planilha (ela pode estar desatualizada -- caso real encontrado: "Enquadrado" com próxima
// atualização de 2021, nunca revisado desde então). Regra: um status EXPLICITAMENTE crítico da
// planilha (ex. "Desenquadrado", sinal negativo de verdade, alguém marcou manualmente) sempre
// prevalece; senão o veredito vem da distância até a data (vencido=Vencido, ≤30 dias=Verificar,
// senão usa o texto bom da planilha ou "Enquadrado" como padrão). Usada nos 3 lugares que mostram
// itens de Obrigações: tabela consolidada (renderAcompSubview), painel "Itens de Acompanhamento"
// da página de detalhe (showDetail) e sub-página "Ver obrigações →" (renderTopicItems). Aceita
// tanto covenants minerados (campo proxima_atualizacao) quanto itens de tópico (campo proximo) --
// normaliza os dois pro mesmo cálculo (covenantUrgency). Sem status nem data nenhuma (ex.:
// obrigação disparada por evento, sem prazo fixo, como "comunicação de inadimplemento"), retorna
// null -- nenhum chip é mostrado, igual sempre foi pra esse tipo de item.
function obrigStatusInfo(c){
  const proximo = c.proxima_atualizacao || c.proximo || null;
  if(!c.status && !proximo) return null;
  const urgency = covenantUrgency({status: c.status, proxima_atualizacao: proximo});
  if(c.status && statusClass(c.status)==='critical') return {label:c.status, cls:'critical'};
  if(urgency==='critical') return {label:'Vencido', cls:'critical'};
  if(urgency==='warn') return {label:'Verificar', cls:'warn'};
  return {label:c.status||'Enquadrado', cls:'good'};
}
function updateAcompBadge(){
  const rows = allCovenantRows();
  rows.forEach(r=> r.urgency = covenantUrgency(r));
  // badge do navtab de topo = total de vencidos somando os 2 tipos (Obrigações + Ordinário) --
  // volta a ser 1 badge só, já que "Acompanhamento" voltou a ser 1 aba só de novo (48ª rodada).
  const n = rows.filter(r=>r._tipo && r.urgency==='critical').length;
  const badge = document.getElementById('acomp-badge');
  if(!badge) return;
  if(n>0){ badge.hidden=false; badge.textContent=n; } else { badge.hidden=true; }
}

// renderAcomp() (48ª rodada, correção sobre a 47ª): monta a tela da aba "Acompanhamento" --
// a barra de sub-abas (Obrigações / Ordinário, ver acompSubTab) fica fixa no topo, e só o
// conteúdo abaixo dela troca ao clicar (renderAcompSubview) -- nem empilhado (46ª) nem 2 telas
// de nível superior (47ª), uma sub-navegação de verdade dentro de 1 única tela.
function renderAcomp(){
  const view = document.getElementById('view-acomp');
  const rows = allCovenantRows();
  rows.forEach(r=> r.urgency = covenantUrgency(r));
  const subtabDefs = Object.keys(ACOMP_TABS).map(key=>{
    const cfg = ACOMP_TABS[key];
    // 'obrig' engloba as 2 OBRIG_SUBSECTIONS (tipo=null nela mesma) -- soma os vencidos das 2
    // sub-divisões de 2º nível pro badge da aba de cima refletir o total, mesmo com a divisão
    // visual só aparecendo depois de entrar na aba.
    const n = cfg.tipo===null
      ? rows.filter(r=>(r._tipo==='obrigacao'||r._tipo==='obrigacao_assembleia') && r.urgency==='critical').length
      : rows.filter(r=>r._tipo===cfg.tipo && r.urgency==='critical').length;
    return {key, title: cfg.title, badge: n};
  });
  view.innerHTML = `
    <div id="acomp-subtabs">
      ${subtabDefs.map(t=>`
        <button class="acomp-subtab ${acompSubTab===t.key?'active':''}" data-sub="${t.key}">
          ${t.title}${t.badge>0?`<span class="navbadge">${t.badge}</span>`:''}
        </button>`).join('')}
    </div>
    <div id="acomp-subview"></div>
  `;
  view.querySelectorAll('#acomp-subtabs .acomp-subtab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ acompSubTab = btn.dataset.sub; renderAcomp(); });
  });
  renderAcompSubview();
}

// renderAcompSubview() -- preenche #acomp-subview com o conteúdo ativo. Dentro da sub-aba
// Ordinário, é direto (ACOMP_TABS.ord). Dentro de Obrigações, tem mais um nível: cfg vem de
// OBRIG_SUBSECTIONS[obrigSubSection] (Itens de Entrega e Renovação | Via Assembleia, ver
// comentário em ACOMP_TABS) -- KPIs, chips e tabela ficam escopados a essa sub-divisão, que
// tem seu próprio filtro de status (acompFilters[filterKey]), independente da outra. A
// classificação em si (r._tipo) vem pronta do build_data.py (ver covenant_tipo/
// obligation_bucket_of/mine_obligation_items) -- itens com _tipo=None (Quórum de Assembleias,
// card genérico "Obrigações") já saem naturalmente de todos os blocos, sem filtro extra aqui.
function renderAcompSubview(){
  const topKey = acompSubTab;
  const cfg = topKey === 'obrig' ? OBRIG_SUBSECTIONS[obrigSubSection] : ACOMP_TABS[topKey];
  const filterKey = topKey === 'obrig' ? obrigSubSection : topKey;
  const sub = document.getElementById('acomp-subview');
  if(!sub) return;
  const ft = document.getElementById('search').value;
  const ftn = stripAccents(ft||'');
  let allRows = allCovenantRows().filter(r => !ftn || opMatches(r.opName, ftn) || stripAccents(r.item).includes(ftn));
  allRows.forEach(r=> r.urgency = covenantUrgency(r));
  const rows = allRows.filter(r=>r._tipo===cfg.tipo);

  const nCritical = rows.filter(r=>r.urgency==='critical').length;
  const nWarn = rows.filter(r=>r.urgency==='warn').length;
  const nGood = rows.filter(r=>r.urgency==='good').length;

  const chipDefs = [['todos','Todos'],['critical','Vencidos / Desenquadrados'],['warn','Próx. 30 dias'],['good','Em dia']];
  const statusFilter = acompFilters[filterKey];
  let filtered = statusFilter==='todos' ? rows : rows.filter(r=>r.urgency===statusFilter);
  const urgencyOrder = {critical:0, warn:1, good:2, neutral:3};
  filtered = [...filtered].sort((a,b)=>{
    if(a.proxima_atualizacao && b.proxima_atualizacao && a.proxima_atualizacao!==b.proxima_atualizacao){
      return a.proxima_atualizacao < b.proxima_atualizacao ? -1 : 1;
    }
    if(!!a.proxima_atualizacao !== !!b.proxima_atualizacao) return a.proxima_atualizacao ? -1 : 1;
    return urgencyOrder[a.urgency]-urgencyOrder[b.urgency];
  });

  // Correção pós-publicação (50ª rodada, revisão sobre a 49ª; 51ª rodada extraiu isso pra
  // obrigStatusInfo() global, ver definição logo após covenantUrgency): a 49ª rodada tinha feito
  // o chip de Status confiar cegamente no texto "status" da planilha (pra não pintar "Enquadrado"
  // de vermelho) -- mas o usuário apontou o problema de fundo: a planilha pode estar simplesmente
  // desatualizada (achamos um item "Enquadrado" com próxima atualização de 2021, nunca revisado
  // desde então -- conferido direto na fonte, célula real). "não podemos simplesmente pegar a
  // informação na planilha e replicar aqui [...] pode aparecer enquadrado na planilha mas está
  // errado e esse portal vai ajudar a redobrar esse controle" -- o portal precisa da própria
  // inteligência, não só espelhar o texto bruto. Essa mesma função agora é reaproveitada também
  // no painel de detalhe da operação e na sub-página "Ver obrigações →" (pedido explícito: "esse
  // entendimento precisa ser replicado para todo o portal, inclusive nas abas de cada operação").
  // Colunas de Obrigações (50ª rodada): "essa informação deve ser passada [...] adicionar uma
  // de ultima atualização e proxima atualização por data" -- Exigido/Atual (pensadas pra
  // covenants de razão, tipo IC/LTV) quase sempre vêm "-"/"OK" nos itens de Obrigações
  // (deveres de entrega, sem um número pra comparar) e não ajudam em nada aqui; o que importa
  // pra esse tipo de item é QUANDO foi entregue da última vez e QUANDO vence de novo -- as duas
  // datas, lado a lado, é o dado que sustenta o status calculado acima. Ordinário continua com
  // Exigido/Atual (esses SIM são números comparáveis de verdade).
  const isObrig = cfg.tipo === 'obrigacao' || cfg.tipo === 'obrigacao_assembleia';
  const isAssembleia = cfg.tipo === 'obrigacao_assembleia';
  // Coluna "Fundo" removida (52ª rodada, mesmo pedido já aplicado na Visão Geral): "pode tirar
  // as colunas de Fundo aqui e nos acompanhamentos ordinários" -- vale pros 2 sub-abas
  // (Obrigações E Ordinário), não só uma. r.group continua disponível na linha (usado em
  // outros lugares), só não é mais uma coluna visível aqui.
  const theadHtml = isObrig
    ? `<tr><th>Operação</th><th>Item</th><th class="th-num">Última Atualização</th><th class="th-num">Próxima Atualização</th><th>Status</th></tr>`
    : `<tr><th>Operação</th><th>Item</th><th class="th-num">Exigido</th><th class="th-num">Atual</th><th class="th-num">Próxima Atualização</th><th>Status</th></tr>`;
  const colspan = isObrig ? 5 : 6;
  // Sub-nav de 2º nível (só dentro de Obrigações, ver comentário em ACOMP_TABS/
  // OBRIG_SUBSECTIONS): badges contam a partir de allRows (antes do filtro por tipo desta
  // sub-divisão específica), pra cada pílula mostrar o total da SUA própria sub-divisão.
  const obrigSubsectionsHtml = topKey === 'obrig' ? `
    <div id="obrig-subsections">
      ${Object.keys(OBRIG_SUBSECTIONS).map(k=>{
        const c = OBRIG_SUBSECTIONS[k];
        const n = allRows.filter(r=>r._tipo===c.tipo && r.urgency==='critical').length;
        return `<button class="obrig-subsection-tab ${obrigSubSection===k?'active':''}" data-obrigsub="${k}">
          ${c.title}${n>0?`<span class="navbadge">${n}</span>`:''}
        </button>`;
      }).join('')}
    </div>` : '';
  sub.innerHTML = `
    ${obrigSubsectionsHtml}
    <div id="kpirow">
      <div class="kpi"><div class="label">Itens mapeados</div><div class="value">${rows.length}</div><div class="sub">em ${OPNAMES.length} operações</div></div>
      <div class="kpi"><div class="label">Vencidos / Desenquadrados</div><div class="value critical">${nCritical}</div><div class="sub">requer ação</div></div>
      <div class="kpi"><div class="label">Próximos 30 dias</div><div class="value warn">${nWarn}</div><div class="sub">acompanhar</div></div>
      <div class="kpi"><div class="label">Em dia</div><div class="value good">${nGood}</div><div class="sub">sem pendência próxima</div></div>
    </div>
    <div class="chips" id="acompchips">
      ${chipDefs.map(([k,label])=>`<span class="chip ${statusFilter===k?'active':''}" data-k="${k}">${label}</span>`).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><h2>${cfg.title}</h2><span class="meta">${rows.length} ${rows.length===1?'item':'itens'}</span></div>
      <div class="panel-body">
        <div class="panel-subtitle">${cfg.subtitle}</div>
        <div class="tablewrap">
          <table class="responsive-table acomp-table">
            <thead>${theadHtml}</thead>
            <tbody id="acomp-tbody">
              ${filtered.length===0 ? `<tr><td colspan="${colspan}"><div id="empty-state">Nenhum item encontrado.</div></td></tr>` : filtered.map(r=>{
                // Sem prazo fixo (pedido explícito: "se não tiver prazo, trazer essa
                // informação na parte das datas 'Sem prazo para acontecer'"): só se aplica às
                // obrigações via assembleia sem prazo E sem status -- ou seja, não é um item já
                // cumprido (esse sim mostra "Enquadrado" normalmente, sem essa mensagem), é um
                // item cujo prazo depende de um evento futuro ainda não confirmado (ver nota do
                // item em obligations_data.json).
                const semPrazo = isAssembleia && !r.proxima_atualizacao && !r.status;
                const statusCell = isObrig
                  ? (()=>{ const s=obrigStatusInfo(r); if(s) return `<span class="statuschip ${s.cls}">${s.label}</span>`; return `<span class="statuschip neutral">${semPrazo?'Sem prazo fixo':'—'}</span>`; })()
                  : (r.status ? `<span class="statuschip ${statusClass(r.status)}">${r.status}</span>` : `<span class="statuschip ${r.urgency}">${r.urgency==='critical'?'Vencido':r.urgency==='warn'?'Próximo':'—'}</span>`);
                const dateCols = isObrig
                  ? `<td class="num" data-label="Última Atualização">${r.ultima_atualizacao?fmtDate(r.ultima_atualizacao):'—'}</td>
                <td class="num" data-label="Próxima Atualização">${r.proxima_atualizacao?fmtDate(r.proxima_atualizacao):(semPrazo?'Sem prazo para acontecer':'—')}</td>`
                  : `<td class="num acomp-val" data-label="Exigido">${r.exigido!==undefined?fmtCovVal(r,r.exigido):'—'}</td>
                <td class="num acomp-val" data-label="Atual">${r.atual!==undefined?fmtCovVal(r,r.atual):'—'}</td>
                <td class="num" data-label="Próxima Atualização">${r.proxima_atualizacao?fmtDate(r.proxima_atualizacao):'—'}</td>`;
                return `
              <tr data-name="${r.opName.replace(/"/g,'&quot;')}">
                <td class="opname">${r.opName}</td>
                <td data-label="Item" class="acomp-item">${r.item}</td>
                ${dateCols}
                <td data-label="Status">${statusCell}</td>
              </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="footnote">${isObrig ? 'Prazos calculados em relação à data de referência ('+fmtDate(AS_OF)+'). Status "Vencido"/"Verificar" é calculado pelo próprio portal a partir da Próxima Atualização — não é só o texto copiado da planilha, exatamente pra pegar entregas desatualizadas que a planilha ainda marca como enquadradas.' : 'Prazos calculados em relação à data de referência ('+fmtDate(AS_OF)+'). "Vencido" indica que a Próxima Atualização já passou nessa referência — não significa necessariamente que o covenant está descumprido.'}</div>
  `;

  sub.querySelectorAll('#obrig-subsections .obrig-subsection-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ obrigSubSection = btn.dataset.obrigsub; renderAcompSubview(); });
  });
  sub.querySelectorAll('#acompchips .chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{ acompFilters[filterKey] = chip.dataset.k; renderAcompSubview(); });
  });
  // Clique na linha (52ª rodada): sub-aba Obrigações leva DIRETO pra sub-página "Ver obrigações
  // →" daquela operação (showTopicsDetail), em vez da página geral de detalhe -- pedido do
  // usuário: "como é obrigação consegue já me levar pra área de obrigações de cada operação?".
  // Via Assembleia (correção pós-publicação) tem seu próprio destino mais específico: a
  // sub-página "Leitura de Atas e Aditamentos" (showDocObrigDetail) da própria operação, em vez
  // da sub-página genérica de Obrigações Pecuniárias -- é conteúdo de ata, não de planilha.
  // Ordinário continua indo pra página geral de detalhe (showDetail), como sempre foi -- não há
  // uma sub-página equivalente de "Ordinário" pra abrir direto, os covenants IC/LTV/Reserva já
  // aparecem no painel "Itens de Acompanhamento" da própria página de detalhe.
  sub.querySelectorAll('tbody tr[data-name]').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      const name = tr.dataset.name;
      if(isAssembleia) showDocObrigDetail(name);
      else if(isObrig) showTopicsDetail(name, 'obrigacoes_pecuniarias', 'Obrigações');
      else showDetail(name);
    });
  });
}

/* ---------------- charts (inline SVG, no libs) ---------------- */
function cssVar(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/* ---------------- gráficos interativos (ECharts) — padrão do portal (45ª rodada) ----------------
   Aplicado a TODAS as operações e a TODOS os tipos de gráfico do portal (barra única, barras
   agrupadas por mês, linha histórico+projetado do IC -- buildChart --, Evolução Física da Obra
   -- buildObraChart -- e os donuts da Visão Geral -- buildDonutSVG/donutCardHtml, esses com
   tooltip via camada própria, mantendo o layout exatamente igual, ver initDonutTooltip mais
   abaixo) -- resposta ao pedido do usuário de sair do gráfico "foto" (SVG desenhado à mão, sem
   tooltip/zoom, uma vez só na hora do render) pra um gráfico de verdade, tipo Power BI, em TODO
   o portal ("eu falei para deixar todos os gráficos interativos"). As 2 funções abaixo
   (echartsBarOption/echartsGroupedBarOption) são a versão ECharts de
   buildBarChart/buildGroupedBarChart -- mesmos parâmetros de opts (fmtVal, fmtY, yFixedMax,
   yTicks, refValue, maxBarW, labelBars, pillLabels, softGrid), pra poder trocar uma pela outra
   sem reformular a chamada.
   Ajuste pós-piloto (feedback do usuário depois de ver a Alianza no ar): "a fonte dele ficou
   muito pequena [...] parece que ele tá longe" -- fontes de eixo/rótulo/tooltip aumentadas em
   toda a base (~8.5-9px -> 10-12px) nas 2 funções abaixo.
   Correção pós-V56 (2ª rodada de ajuste): a 1ª tentativa de resolver "a linha do IC mínimo
   acabou ficando em cima de alguns números" deu z:1 à markLine, mas isso jogou a linha pra
   TRÁS das próprias barras também (bug reportado: "ela está ficando atrás do gráfico... não
   faz muito sentido"), porque markLine e o rótulo de cada barra pertencem à MESMA série, então
   não dá pra intercalar um z entre "barra" e "rótulo daquela barra" -- só entre séries
   inteiras. Resolvido desacoplando de vez o rótulo de valor da série de barra: a markLine volta
   a usar o z padrão do ECharts (na frente das barras, igual ao visual já validado antes de
   qualquer ajuste), e os rótulos de valor passam a ser desenhados numa camada `graphic`
   separada (sempre por cima de tudo, inclusive da própria linha de referência) via
   option.__computeValueLabels + attachValueLabelOverlay logo abaixo -- assim a linha nunca some
   atrás de nada, e o número nunca é riscado por ela. */
const ECHARTS_FONT_MONO = "'IBM Plex Mono','SFMono-Regular',Consolas,monospace";

// attachValueLabelOverlay(chart, entries): desenha os rótulos de valor por barra numa camada
// `graphic` independente (z:100, sempre acima de todas as séries e da markLine de referência).
// Cada entry usa `id` estável (ex.: 'lbl-3' ou 'lbl-1-3' pro grouped, série+índice) pra que
// chamadas repetidas (resize) atualizem os elementos existentes em vez de duplicá-los.
function attachValueLabelOverlay(chart, entries){
  if(!chart || !entries) return;
  const elements = entries.map(e=>({
    type:'text', id:e.id, silent:true, z:100, x:e.x, y:e.y,
    style:{
      text:e.text, fill:e.fill, font:e.font,
      align: e.align || 'center', verticalAlign: e.vAlign || 'bottom',
      backgroundColor: e.bg || 'transparent',
      padding: e.bg ? (e.padding || [2,5]) : 0,
      borderRadius: e.bg ? (e.radius!=null ? e.radius : 4) : 0,
    },
  }));
  chart.setOption({graphic:{elements}});
}

// mountEChart(el, option): cria a instância ECharts dentro de `el`. Descarta qualquer instância
// antiga presa no mesmo nó (defensivo -- na prática cada draw() gera um <div id="..."> novo via
// innerHTML, então não deveria haver uma instância antiga de fato) e liga um ResizeObserver pra
// chamar chart.resize() sempre que a LARGURA do card mudar sem o window inteiro redimensionar
// (ex.: abrir/fechar a sidebar mobile, ou o próprio grid 2 colunas -> 1 coluna do .chartgrid).
// Se `option.__computeValueLabels` existir (ver echartsBarOption/echartsGroupedBarOption), é
// chamado logo após o setOption inicial E a cada resize, pra manter os rótulos de valor
// (camada `graphic`) alinhados às barras mesmo quando a largura do card muda.
function mountEChart(el, option){
  if(!el || !option || typeof echarts === 'undefined') return null;
  const prev = echarts.getInstanceByDom(el);
  if(prev) prev.dispose();
  const chart = echarts.init(el, null, {renderer:'svg'});
  chart.setOption(option);
  const refreshLabels = () => {
    if(typeof option.__computeValueLabels === 'function'){
      attachValueLabelOverlay(chart, option.__computeValueLabels(chart));
    }
  };
  refreshLabels();
  const ro = new ResizeObserver(()=>{ chart.resize(); refreshLabels(); });
  ro.observe(el);
  return chart;
}
