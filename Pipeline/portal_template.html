<title>Portal de Operações Estruturadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eceff2;
  --surface:#ffffff;
  --surface-2:#f4f6f8;
  --ink:#141c28;
  --ink-muted:#57697c;
  --ink-faint:#8996a5;
  --border:#d7dee4;
  --border-soft:#e4e9ed;
  --accent:#2b4c7e;
  --accent-strong:#1c3a63;
  --accent-ink:#f4f8fc;
  --accent-tint:#e3ebf5;
  --accent-pale:#a9c4e6;
  --good:#1d7a55;
  --good-bg:#e2f2e9;
  --warn:#a8681a;
  --warn-bg:#f9edd9;
  --critical:#b03a2e;
  --critical-bg:#f8e3e0;
  --neutral-bg:#e7eaed;
  --shadow:0 1px 2px rgba(20,28,40,.05), 0 6px 20px -8px rgba(20,28,40,.12);
  /* Rampa dos gráficos de rosca (14ª rodada): mesmo matiz do azul-marinho da marca em vários
     tons, do mais escuro (categoria mais expressiva) ao mais claro. --chart-neutral é reservado
     só pra "Não informado"/dado ausente -- nunca faz parte da rampa numerada. Cada tema (claro/
     escuro) redefine os 8 tons pra manter contraste contra var(--surface) -- ver blocos abaixo;
     não usar hex fixo no JS, sempre ler via getComputedStyle (cssVar), senão o tom escuro que
     funciona no claro fica ilegível contra o fundo escuro do tema dark (e vice-versa). */
  --chart-1:#16294a; --chart-2:#1c3a63; --chart-3:#2b4c7e; --chart-4:#3f6394;
  --chart-5:#5883b8; --chart-6:#7aa0cc; --chart-7:#9cbadd; --chart-8:#bdd0e9;
  --chart-neutral:#98a2af;
  /* --band-strong/--band-light (43ª rodada, ajuste pós-publicação, itens 1-2): faixas de
     destaque em azul de tabelas tipo "Vendas/Carteira/Estoque" (.estoque-total = linha de
     total "Vendido"/"Estoque AFI", mais forte; .carteira-banner-row/.estoque-subrow = linha
     de destaque "Carteira Recebida/a Receber" e a abertura de sub-itens do estoque, mais
     clara -- pedido do usuário pra ficar no mesmo tom "azul claro" de exemplo que ele mandou).
     Motivo de NÃO reaproveitar var(--accent)/var(--accent-strong) aqui (como antes): esses 2
     tokens INVERTEM qual é mais claro entre os temas (no claro, --accent-strong é mais escuro
     que --accent; no escuro, é o contrário -- de propósito, pra manter --accent-ink legível
     em cima de --accent-strong nos outros usos, tipo botão/aba). Resultado: a mesma regra CSS
     que no tema claro deixava "Carteira Recebida" mais clara que "Vendido" invertia sozinha no
     tema escuro (virava mais escura/saturada que "Vendido") -- só percebido quando o usuário
     olhou no escuro. Tokens dedicados abaixo fixam a MESMA hierarquia (strong = tom mais forte/
     escuro-denso, light = tom mais claro) nos 2 temas, com texto branco fixo (sem depender de
     --accent-ink) -- ver .estoque-total/.carteira-banner-row/.estoque-subrow mais abaixo.
     Correção pós-publicação (43ª rodada, 2º ajuste): a 1ª tentativa usou #2b4c7e (extraído por
     amostragem de pixel dos 2 prints originais do usuário) -- mas isso por coincidência já era
     o valor antigo de var(--accent), então visualmente ficou "igual" ao que já existia antes
     no app (pouco contraste perceptível com o "Vendido"/"Estoque AFI" mais escuro), e o usuário
     apontou que continuava parecendo azul escuro. Ele então mandou um 3º print, recortado
     diretamente da própria tabela-alvo (não um preview redimensionado), cuja amostragem de
     pixel deu um tom nitidamente mais claro/saturado: #4478d2 (vs #2b4c7e antes) -- confirmado
     por histograma (>97% dos pixels da faixa). A linha escura desse mesmo print bateu bem perto
     do --band-strong já usado (#1c3a63), então só --band-light muda aqui. */
  --band-strong:#1c3a63;
  --band-light:#4478d2;
  --font-display:'Source Serif 4',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151d;
    --surface:#171e28;
    --surface-2:#1c2430;
    --ink:#e7ecf2;
    --ink-muted:#97a6b8;
    --ink-faint:#637283;
    --border:#2b3441;
    --border-soft:#242c38;
    --accent:#7ea0d4;
    --accent-strong:#9db8e3;
    --accent-ink:#0b1420;
    --accent-tint:#20293a;
    --accent-pale:#4a6491;
    --good:#54c290;
    --good-bg:rgba(84,194,144,.14);
    --warn:#e2ac52;
    --warn-bg:rgba(226,172,82,.14);
    --critical:#e2766b;
    --critical-bg:rgba(226,118,107,.14);
    --neutral-bg:rgba(255,255,255,.06);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
    --chart-1:#a8c2e8; --chart-2:#8fb0dd; --chart-3:#7ea0d4; --chart-4:#6690c8;
    --chart-5:#557eb8; --chart-6:#4a6ea3; --chart-7:#425f8c; --chart-8:#3a5175;
    --chart-neutral:#7c8a9b;
    --band-strong:#3a5175;
    --band-light:#557eb8;
  }
}
:root[data-theme="dark"]{
  --bg:#10151d;
  --surface:#171e28;
  --surface-2:#1c2430;
  --ink:#e7ecf2;
  --ink-muted:#97a6b8;
  --ink-faint:#637283;
  --border:#2b3441;
  --border-soft:#242c38;
  --accent:#7ea0d4;
  --accent-strong:#9db8e3;
  --accent-ink:#0b1420;
  --accent-tint:#20293a;
  --accent-pale:#4a6491;
  --good:#54c290;
  --good-bg:rgba(84,194,144,.14);
  --warn:#e2ac52;
  --warn-bg:rgba(226,172,82,.14);
  --critical:#e2766b;
  --critical-bg:rgba(226,118,107,.14);
  --neutral-bg:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -10px rgba(0,0,0,.5);
  --chart-1:#a8c2e8; --chart-2:#8fb0dd; --chart-3:#7ea0d4; --chart-4:#6690c8;
  --chart-5:#557eb8; --chart-6:#4a6ea3; --chart-7:#425f8c; --chart-8:#3a5175;
  --chart-neutral:#7c8a9b;
  --band-strong:#3a5175;
  --band-light:#557eb8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;}
::selection{background:var(--accent-tint);}
.tabular{font-variant-numeric:tabular-nums;font-family:var(--font-mono);}
a{color:var(--accent);}
button{font-family:var(--font-body);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex;flex-direction:column;height:100vh;}

/* ---------- topbar ---------- */
#topbar{
  display:flex;align-items:center;gap:18px;
  padding:12px 22px;border-bottom:1px solid var(--border);
  background:var(--surface);flex:0 0 auto;
  z-index:20;
}
#brand{display:flex;flex-direction:column;gap:1px;min-width:0;}
#brand .eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);font-weight:600;}
#brand h1{font-size:19px;color:var(--ink);white-space:nowrap;}
#navtabs{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:3px;}
.navtab{
  border:none;background:none;color:var(--ink-muted);font-size:12.5px;font-weight:600;padding:6px 13px;
  border-radius:7px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px;
}
.navtab.active{background:var(--surface);color:var(--accent-strong);box-shadow:var(--shadow);}
.navbadge{
  background:var(--critical);color:#fff;font-family:var(--font-mono);font-size:10px;font-weight:700;
  padding:1px 6px;border-radius:20px;
}
#asof{
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted);
  background:var(--surface-2);border:1px solid var(--border-soft);
  padding:3px 9px;border-radius:20px;white-space:nowrap;
}
/* 8ª rodada, reorganização geral, ponto 3: seletor de mês de referência. */
#month-select{
  font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted);
  background:var(--surface-2);border:1px solid var(--border-soft);
  padding:3px 22px 3px 9px;border-radius:20px;white-space:nowrap;
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%237c8797' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 8px center;
}
#month-select:hover{color:var(--ink);border-color:var(--accent);}
#month-select:focus{outline:2px solid var(--accent);outline-offset:1px;}
#searchwrap{flex:1;max-width:420px;position:relative;margin-left:auto;}
#search{
  width:100%;padding:8px 12px 8px 32px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink);font-size:13px;font-family:var(--font-body);
}
#search:focus{outline:2px solid var(--accent);outline-offset:1px;}
#searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;}
/* Correção pós-publicação (21ª rodada, ponto 2): "quando pesquisamos ele filtra as operações na
   aba lateral, mas não faz sentido isso -- a ideia é quando eu pesquisar aparecer abaixo as
   opções". A busca do topo não filtra mais a barra lateral (que agora é uma lista fixa, ver
   .sidebar-group acima) -- em vez disso mostra os resultados num dropdown logo abaixo do campo,
   igual um "buscar e ir direto pra operação". Clicar num resultado abre o detalhe da operação
   e fecha o dropdown; ver #search-suggest no <script>. */
#search-suggest{
  position:absolute;top:calc(100% + 6px);left:0;right:0;
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  box-shadow:var(--shadow);max-height:340px;overflow-y:auto;z-index:25;padding:5px;
}
.search-suggest-item{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;cursor:pointer;
}
.search-suggest-item:hover, .search-suggest-item.active{background:var(--surface-2);}
.search-suggest-item .name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.8px;color:var(--ink);font-weight:600;}
.search-suggest-item .sub{flex:0 0 auto;font-size:11px;color:var(--ink-faint);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.search-suggest-empty{padding:10px 12px;font-size:12.3px;color:var(--ink-faint);}
/* Correção pós-publicação (9ª rodada, ponto 1): o botãozinho de recolher/expandir embutido na
   borda da barra lateral (#sidebar-collapse-btn) ficava quase invisível e o usuário nem viu que
   dava pra usar. Unificado num único controle: o botão ☰ do topo (sempre visível agora, não só
   no celular), com ícone SVG em vez do caractere "☰" (que rendeirzava minúsculo/inconsistente
   dependendo da fonte). Um clique alterna .collapsed (rail retrátil) no desktop ou .open (menu
   deslizante) no celular -- ver handler unificado no bloco de inicialização do <script>. */
#sidebar-toggle{
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);background:var(--surface-2);color:var(--ink);
  border-radius:8px;width:34px;height:34px;padding:0;cursor:pointer;flex:0 0 auto;
}
#sidebar-toggle:hover{color:var(--accent);border-color:var(--accent);}

/* ---------- layout ---------- */
#body{display:flex;flex:1 1 auto;min-height:0;}
/* Sidebar reorganizada (8ª rodada, pontos 1-2): a antiga divisão em grupos MCCI/MCCE/MCRE/...
   (organização das abas da planilha, não os fundos reais -- ver .fundchip/fund_positions
   usados na Visão Geral) saiu; a lista agora é única e alfabética (#sidebar-list, populada por
   renderSidebar). Estado do recolher/expandir persiste em localStorage (conveniência por
   navegador, não é dado que precise sincronizar entre abas/pessoas).
   Correção pós-publicação (10ª rodada, ponto 1): a 1ª versão do "recolher" encolhia pra um
   rail de 60px só com as bolinhas de status -- o usuário esperava que escondesse TUDO ("ela
   teria que esconder tudo"), não deixasse uma faixa residual. Trocado pra width:0 (a barra
   soma zero ao layout quando recolhida; o botão de reabrir mora no topo, fora da sidebar). */
#sidebar{
  width:272px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;overflow-x:hidden;padding:14px 0 24px;position:relative;
  transition:width .18s ease, padding .18s ease, border-color .18s ease;
}
#sidebar.collapsed{width:0;padding-left:0;padding-right:0;border-right-color:transparent;}
/* Correção pós-publicação (21ª rodada, ponto 1): "conseguimos colocar uma opção também de
   voltar para a Visão Geral das operações? Ai pode criar uma opção abaixo chamada Operações
   com todas as operações abaixo que dê pra recolher" -- a barra lateral era só a lista de
   operações; agora tem 2 partes fixas no topo (fora do grupo que recolhe): o atalho "Visão
   Geral" (mesmo destino do botão de cima, útil quando dentro do detalhe de uma operação) e,
   abaixo, o grupo "Operações" -- um cabeçalho clicável com contador + seta, que abre/fecha a
   lista de 44 operações (#sidebar-list, sem mudar nada da lógica de renderSidebar). Estado
   aberto/fechado do grupo persiste em localStorage, igual ao recolher/expandir da sidebar
   inteira (mas são 2 estados independentes -- um é a sidebar toda, o outro só a lista). */
.sidebar-toplink{
  display:flex;align-items:center;gap:9px;padding:8px 18px;margin:0 0 6px;cursor:pointer;
  border-left:2px solid transparent;font-size:12.8px;font-weight:600;color:var(--ink-muted);
}
.sidebar-toplink svg{flex:0 0 auto;color:var(--ink-faint);}
.sidebar-toplink:hover{background:var(--surface-2);color:var(--ink);}
.sidebar-toplink:hover svg{color:var(--accent);}
.sidebar-toplink.active{background:var(--accent-tint);border-left-color:var(--accent);color:var(--accent-strong);}
.sidebar-toplink.active svg{color:var(--accent-strong);}
.sidebar-group{border-top:1px solid var(--border-soft);padding-top:6px;}
.sidebar-group-toggle{
  width:100%;display:flex;align-items:center;gap:7px;padding:8px 18px;cursor:pointer;
  border:none;background:none;font-family:inherit;text-align:left;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--ink-faint);
}
.sidebar-group-toggle:hover{color:var(--ink);}
.sidebar-group-chevron{flex:0 0 auto;transition:transform .15s ease;}
.sidebar-group.collapsed .sidebar-group-chevron{transform:rotate(-90deg);}
.sidebar-group-label{flex:1 1 auto;}
.sidebar-group-count{font-family:var(--font-mono);color:var(--ink-faint);font-weight:600;}
.sidebar-group.collapsed #sidebar-list{display:none;}
#sidebar-list{padding-top:8px;}
.opitem{
  display:flex;align-items:center;gap:8px;padding:6px 18px;cursor:pointer;
  border-left:2px solid transparent;
}
.opitem:hover{background:var(--surface-2);}
.opitem.active{background:var(--accent-tint);border-left-color:var(--accent);}
.opitem .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.6px;color:var(--ink);}
.opitem.active .name{color:var(--accent-strong);font-weight:600;}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.dot.good{background:var(--good);}
.dot.warn{background:var(--warn);}
.dot.critical{background:var(--critical);}
.dot.neutral{background:var(--ink-faint);}

#main{flex:1 1 auto;overflow-y:auto;padding:26px 32px 60px;min-width:0;}
.view{display:none;max-width:1180px;margin:0 auto;}
.view.active{display:block;}

/* ---------- overview ---------- */
#kpirow{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:22px;}
.kpi{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;
  padding:14px 16px;box-shadow:var(--shadow);
}
.kpi .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-faint);font-weight:600;margin-bottom:6px;}
.kpi .value{font-family:var(--font-mono);font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.01em;}
.kpi .value.good{color:var(--good);}
.kpi .value.warn{color:var(--warn);}
.kpi .value.critical{color:var(--critical);}
.kpi .sub{font-size:11px;color:var(--ink-muted);margin-top:3px;}

.panel{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;
  box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden;
}
.panel-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  padding:14px 18px 10px;border-bottom:1px solid var(--border-soft);
}
/* .panel-head h2 color (pente-fino de padronização): antes sem cor própria (herdava var(--ink),
   a MESMA cor do texto de dentro da tabela) -- pedido explícito do usuário ("o consolidador
   dela e o título tá da mesma cor do... de dentro da tabela... acaba que não fica diferente").
   Título de CADA painel do portal passa a usar var(--accent-strong) -- o mesmo azul-marinho já
   usado em botão/aba/cabeçalho de tabela (navy-head) -- criando uma hierarquia visual clara e
   única em toda a tela de operação: título do painel (azul-marinho) > dado de tabela (var(--ink))
   > rótulo de cabeçalho de coluna (var(--ink-faint)). Regra única (.panel-head h2), vale pros
   ~16 painéis do portal de uma vez (Posição por Fundo, Garantias, Itens de Acompanhamento,
   Características da Operação, Highlights do Mês, etc.) sem precisar tocar em cada um. */
.panel-head h2{font-size:15.5px;color:var(--accent-strong);}
.panel-head .meta{font-size:11.5px;color:var(--ink-faint);}
.panel-body{padding:14px 18px 18px;}
/* .panel-subtitle (46ª rodada): linha descritiva de 1-2 frases abaixo do título de cada bloco
   da aba de Acompanhamento (o que entra em "Ordinário" vs. "Obrigações"). */
.panel-subtitle{font-size:12px;color:var(--ink-muted);margin-bottom:12px;line-height:1.5;}
/* #acomp-subtabs/.acomp-subtab (48ª rodada): sub-navegação DENTRO da aba "Acompanhamento"
   (Obrigações / Ordinário) -- visual de "underline tabs", deliberadamente diferente do
   #navtabs de topo (que é um segmented control em pílula) pra não parecer uma 2ª barra de
   navegação de nível superior -- é uma sub-divisão da MESMA tela, pedido explícito do usuário
   ("aqui pode deixar acompanhamentos. mas dentro de acompanhamentos, vamos criar essa
   quebra"). O badge reaproveita .navbadge (mesmo estilo do badge do navtab de topo).*/
#acomp-subtabs{display:flex;gap:26px;margin-bottom:20px;border-bottom:1px solid var(--border-soft);}
.acomp-subtab{
  border:none;background:none;color:var(--ink-muted);font-size:14px;font-weight:600;
  padding:4px 2px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;
}
.acomp-subtab.active{color:var(--accent-strong);border-bottom-color:var(--accent-strong);}
.acomp-subtab:hover:not(.active){color:var(--ink);}
/* #obrig-subsections/.obrig-subsection-tab (correção pós-publicação, pedido explícito do
   usuário: "esse Via assembleias eu queria que fosse um sub tópico dentro de obrigações [...]
   faz mais sentido para a visualização e para o conteúdo da matéria") -- Via Assembleia deixa
   de ser uma 3ª sub-aba no mesmo nível de Obrigações/Ordinário e vira uma DIVISÃO DE 2º NÍVEL
   só dentro de Obrigações. Visual deliberadamente diferente do underline de #acomp-subtabs
   (esse é o nível 1, dentro de Acompanhamento) -- pílulas preenchidas, mais discretas,
   deixam claro que é uma sub-divisão de 2º nível dentro da aba Obrigações, não uma 2ª barra de
   navegação do mesmo peso. */
#obrig-subsections{display:flex;gap:8px;margin-bottom:16px;}
.obrig-subsection-tab{
  border:1px solid var(--border-soft);background:var(--surface);color:var(--ink-muted);
  font-size:12.5px;font-weight:600;padding:6px 14px;border-radius:20px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
}
.obrig-subsection-tab.active{background:var(--accent-pale);color:var(--accent-strong);border-color:var(--accent-pale);}
.obrig-subsection-tab:hover:not(.active){color:var(--ink);}

/* Correção pós-publicação (10ª rodada, pontos 2-3): consolidadores da tabela de Operações
   redesenhados. O card "Posições (linhas)" saiu (o usuário achou sem sentido) e entraram % CDI
   / % IPCA, que é o corte que o usuário pediu, sempre por OPERAÇÃO única (não por linha/fundo).
   Correção pós-publicação (13ª rodada): a exposição por securitizadora virou 3 gráficos de rosca
   lado a lado (Securitizadora / Indexador / Vencimento, todos por QUANTIDADE de operação, nunca
   por linha/fundo -- mesma regra de não contar 2x já usada nos cards). Os cards % CDI / % IPCA
   saíram dos "quadrantes" porque o 2º gráfico já cobre essa informação (pedido do usuário).
   Correção pós-publicação (14ª rodada): 1ª versão dos gráficos usava uma paleta arco-íris
   (azul/dourado/verde/violeta/vermelho) sem relação nenhuma com a identidade visual do resto
   do portal -- lida como "amadora" ao lado de um app que já é 100% construído em cima de um
   único azul-marinho (var(--accent)/var(--accent-strong), usado em botões, chips, cabeçalhos de
   tabela etc.). Trocado por uma rampa sequencial DERIVADA desse mesmo azul (só varia luminância,
   nunca o matiz) -- ver DONUT_COLORS no <script> -- com um cinza neutro reservado só pra "Não
   informado"/dado ausente (não entra na rampa por índice, é atribuído explicitamente). Cards
   também passaram a usar o mesmo tratamento de superfície elevada dos outros gráficos do portal
   (.chartbox: fundo var(--surface) + sombra, não var(--surface-2) chapado) pra ficarem no mesmo
   "nível" visual dos gráficos de Fluxo Mensal/IC já existentes na página de detalhe. O número
   total no centro da rosca saiu -- ele já aparece no card "Operações" ao lado, repetir 3x era
   redundante (pedido do usuário: "faz sentido trazer a quantidade [...] dado que já tem no
   canto superior. então podemos tirar"). */
.optable-stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.optable-stat{
  background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;
  padding:9px 16px;display:flex;flex-direction:column;gap:3px;min-width:110px;
}
.optable-stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:600;white-space:nowrap;}
.optable-stat .val{font-family:var(--font-mono);font-size:16.5px;font-weight:600;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums;}
.donutgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
@media (max-width:900px){.donutgrid{grid-template-columns:1fr;}}
.donutcard{
  background:var(--surface);border:1px solid var(--border-soft);border-radius:12px;
  box-shadow:var(--shadow);padding:15px 16px 16px;display:flex;flex-direction:column;align-items:center;
}
.donutcard h4{
  font-size:10.8px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);
  font-weight:700;margin:0 0 12px;text-align:center;
}
.donutwrap{position:relative;width:196px;height:196px;margin-bottom:15px;flex:0 0 auto;}
.donutwrap svg{display:block;width:100%;height:100%;}
/* Interatividade dos donuts da Visão Geral (45ª rodada, pedido explícito do usuário: "esse
   gráfico aqui tem que ser interativo também, mas não precisa mudar o layout dele, isso
   precisa ficar bem claro") -- layout do donut (anel, legenda, colunas %/Qtd) inalterado; só
   comportamento de hover foi adicionado (tooltip + destaque da fatia via opacidade), sem
   nenhum ECharts aqui (SVG desenhado à mão continua, só ganhou pointer-events/atributos de
   dado). Ver initDonutTooltip mais abaixo no <script>.
   pointer-events:stroke -- necessário porque cada fatia é um <circle fill="none">: por padrão,
   um elemento com fill="none" não recebe eventos de mouse na área "vazia" do próprio traço.*/
.donut-arc{pointer-events:stroke;cursor:pointer;transition:opacity .15s ease;}
.donut-tooltip{
  position:fixed;z-index:9999;pointer-events:none;display:none;white-space:nowrap;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  box-shadow:var(--shadow);padding:7px 10px;font-family:var(--font-mono);font-size:12px;color:var(--ink);
}
.donut-tooltip .donut-tt-sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle;}
.donut-tooltip .donut-tt-lbl{font-weight:600;}
.donut-legend{width:100%;max-height:126px;overflow-y:auto;display:flex;flex-direction:column;gap:1px;position:relative;}
/* Correção pós-publicação (14ª rodada): quando a legenda tem mais itens do que cabem (ex.:
   9 securitizadoras), a rolagem existia mas nada indicava isso -- parecia só cortado. JS
   (ver renderOptableDonuts) mede scrollHeight x clientHeight depois de montar o HTML e só
   então adiciona .is-scrollable, que liga esse degradê no rodapé (mascarando o fim da lista
   em vez de um corte seco) só quando realmente há mais conteúdo pra rolar. */
.donut-legend.is-scrollable{
  mask-image:linear-gradient(to bottom, black calc(100% - 16px), transparent 100%);
  -webkit-mask-image:linear-gradient(to bottom, black calc(100% - 16px), transparent 100%);
}
/* Correção pós-publicação (15ª rodada, ponto 3): "vamos centralizar essas informações e colocar
   uma mini legenda % e Qtd" -- as colunas de valor viravam uma lista solta de números encostados
   na direita, sem dizer o que cada um significa nem alinhar entre si (dígitos de larguras
   diferentes = coluna "torta"). Viraram 2 colunas de largura FIXA (--donut-col-pct/--donut-col-n),
   texto centralizado dentro de cada uma, com um cabeçalho "%"/"Qtd" (.donut-legend-head) acima da
   lista -- mesma largura das colunas de baixo, então cabeçalho e valores alinham como uma
   mini-tabela. O cabeçalho fica FORA de .donut-legend (que rola) pra nunca sumir ao rolar.*/
.donutcard{--donut-col-pct:34px;--donut-col-n:26px;}
.donut-legend-head{
  display:flex;align-items:center;gap:8px;width:100%;padding:0 0 5px;
  font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700;
}
.donut-legend-head .lbl{flex:1 1 auto;}
.donut-legend-head .pct{width:var(--donut-col-pct);text-align:center;}
.donut-legend-head .n{width:var(--donut-col-n);text-align:center;}
.donut-legend-row{
  display:flex;align-items:center;gap:8px;font-size:11.5px;padding:3.5px 0;
  border-bottom:1px solid var(--border-soft);
}
.donut-legend-row:last-child{border-bottom:none;}
.donut-legend-row .sw{width:8px;height:8px;border-radius:2px;flex:0 0 auto;}
/* Correção pós-publicação (17ª rodada, ponto 2): a fatia mais expressiva de cada gráfico
   ganhava negrito no rótulo (.top) -- destoava sozinha no meio das outras linhas, sem nenhuma
   legenda explicando o porquê ("tem algumas informações em negrito, tirar da legenda"). Todas
   as linhas agora têm o mesmo peso -- só a cor do marcador já diferencia cada categoria. */
.donut-legend-row .lbl{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-muted);}
.donut-legend-row .valwrap{display:flex;align-items:baseline;gap:0;flex:0 0 auto;}
.donut-legend-row .pct{width:var(--donut-col-pct);text-align:center;font-family:var(--font-mono);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11.5px;font-weight:600;}
.donut-legend-row .n{width:var(--donut-col-n);text-align:center;font-family:var(--font-mono);color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:10px;}
.optable-searchwrap{position:relative;max-width:320px;margin-bottom:14px;}
.optable-searchwrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint);pointer-events:none;}
.optable-searchwrap input{
  width:100%;padding:7px 10px 7px 30px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink);font-size:12.6px;font-family:var(--font-body);
}
.optable-searchwrap input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;}
.chip{
  font-size:11.5px;padding:5px 11px;border-radius:20px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--ink-muted);cursor:pointer;font-weight:500;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}

table{width:100%;border-collapse:collapse;font-size:12.6px;}
th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);
  padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none;
  font-weight:600;background:var(--surface-2);
}
/* cursor:pointer só em th que ordena de verdade (data-col -- ver renderOverview, único lugar
   que liga um listener de sort em th) -- th "burra" (sem sort, ex.: cabeçalho de Posição por
   Fundo/Garantias/Acompanhamento) não deve parecer clicável só porque parece com a de cima. */
th[data-col], th.sorted{cursor:pointer;}
th[data-col]:hover, th.sorted:hover{color:var(--ink);}
th.sorted::after{content:' ▾';font-size:9px;}
th.sorted.asc::after{content:' ▴';}
td{padding:9px 10px;border-bottom:1px solid var(--border-soft);vertical-align:middle;white-space:nowrap;}
/* Correção pós-publicação (rodada de revisão geral de UI): cursor:pointer + destaque de hover
   em TODA linha de TODA tabela (regra antiga, table{tbody tr}) prometia clique em tabelas que
   não navegam pra lugar nenhum (Posição por Fundo, Garantias, Estoque...) -- só 2 tabelas do
   portal realmente navegam ao clicar na linha (Visão Geral e Acompanhamento, ambas usando
   <tr data-name="...">, ver renderTableBody/renderAcompSubview). Escopado ao atributo real
   em vez de "toda linha de toda tabela" -- tabelas puramente informativas voltam a ter cursor
   normal, sem a promessa falsa de clique. */
tbody tr[data-name]{cursor:pointer;}
/* Zebra striping universal (rodada de revisão geral de UI): tabelas de mais de 3-4 linhas sem
   nenhuma variação visual entre linhas ficam "achatadas"/difíceis de acompanhar visualmente de
   ponta a ponta (pedido do usuário: tabelas "muito amadoras", quer algo com cara de BI). Antes
   só .loc-table/.estoque-table tinham isso manualmente -- vira regra de base pra QUALQUER
   tabela do portal. Linha clicável (data-name) usa um tom diferente no hover (--accent-tint,
   o mesmo azul-claro já usado em .opitem.active/.chip.active) pra se distinguir claramente da
   zebra -- fica óbvio que aquela linha específica é a interativa, não só mais uma listra. */
tbody tr:nth-child(even){background:var(--surface-2);}
tbody tr[data-name]:hover{background:var(--accent-tint);}
td.num{font-family:var(--font-mono);text-align:right;font-variant-numeric:tabular-nums;}
/* 8ª rodada, reorganização geral, ponto 6: cabeçalho alinhado com o tipo de dado da coluna
   (numérico/data à direita), corrigindo o desalinhamento apontado pelo usuário. */
th.th-num{text-align:right;}
/* Correção pós-publicação (rodada de revisão geral de UI): td.opname tinha virado display:flex
   pra caber o .refbadge (chip "dados de Jul/26") do lado do nome -- esse chip já foi removido
   (ver opRefBadgeHtml), mas o flex ficou pra trás, e é exatamente por isso que "centralizar o
   nome da operação" nunca pegava: text-align:center (ver @media min-width:821px acima) não
   centraliza um item flex, só texto de verdade. td.opname volta a ser uma célula normal;
   .opname-text vira inline-block (não mais flex item) pra manter a truncagem por ellipsis em
   nomes longos, mas agora respeitando o text-align:center do pai -- centraliza de verdade. */
td.opname{font-weight:600;max-width:220px;overflow:hidden;}
.opname-text{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;}
/* .acomp-table (48ª rodada, ajuste pós-publicação): a tabela de Acompanhamento herdava
   white-space:nowrap do `td`/`th` genéricos acima -- inofensivo enquanto o conteúdo era curto
   ("Verificação do IC", "OK"), mas os itens de Obrigações minerados das planilhas trazem texto
   bem mais longo em mais de uma coluna: o nome do item ("DF Trimestral - Calçada e Hotel Vogue
   Square") E, às vezes, o próprio Exigido/Atual ("Trimestralmente", "Dentro do prazo"). Cada
   célula assim forçava sozinha a tabela inteira mais larga que o painel, cortando as colunas
   seguintes pra fora da área visível mesmo com a coluna Item já limitada (usuário: "ficou meio
   cagado [...] igual no acompanhamento ordinário", onde o conteúdo curto nunca acionava esse
   problema). Aqui TODA a tabela quebra linha em vez de forçar largura -- célula longa ocupa
   2-3 linhas, mas todas as colunas ficam visíveis de uma vez, sem scroll horizontal. */
.acomp-table td, .acomp-table th{white-space:normal;}
.acomp-table td.acomp-item{max-width:200px;line-height:1.4;}
.acomp-table td.acomp-val{max-width:110px;line-height:1.4;}
/* .acomp-table thead th: mesmo padrão de cabeçalho azul pedido pra Posição por Fundo e pra
   tabela de Operações da Visão Geral (var(--accent-pale) + var(--accent-strong)), agora também
   na tabela de Obrigações/Ordinário da aba Acompanhamento. */
.acomp-table thead th{background:var(--accent-pale);color:var(--accent-strong);}
/* Correção pós-publicação (12ª rodada, ponto único): o pedido nunca foi só "não quebrar linha"
   (9ª/10ª rodadas) -- era pra CENTRALIZAR, igual ao padrão que o resto do portal já usa em toda
   tabela de dado (.loc-table, .fundpos-table, .ativo-info-table, .minidre-table, .amort-table:
   1ª coluna -- o identificador/label -- fica à esquerda, todas as outras colunas centralizadas).
   As tabelas .responsive-table (Operações e Acompanhamento) foram as únicas que ficaram de fora
   dessa convenção quando foram criadas (herdaram esquerda/direita por tipo de dado em vez de
   centralizado) -- daí o "ainda não centralizou" mesmo depois do texto parar de quebrar linha.
   Especificidade (.responsive-table th/td + :not) é mais alta que th.th-num/td.num de propósito,
   pra vencer sem precisar remover essas classes (que ainda dão a fonte monoespaçada aos números).
   Restrito a telas >820px pra não brigar com o layout de cartão do celular (só rótulo/valor).
   Correção pós-publicação (22ª rodada): a coluna "Operação" (opname) tinha ficado de fora de
   propósito nessa mesma centralização (era a exceção "1ª coluna fica à esquerda" citada acima).
   O usuário pediu pra centralizar ela também -- tirada da exceção, agora todas as colunas dessa
   tabela centralizam igual, cabeçalho incluído. Só vale >820px, igual ao resto da regra: no
   layout de cartão do celular o nome da operação continua sendo o título do cartão (à esquerda),
   ver .responsive-table td.opname na seção de telas estreitas mais abaixo -- não mexe nisso. */
@media (min-width:821px){
  .responsive-table th{text-align:center;}
  .responsive-table td{text-align:center;}
}
.tablewrap{overflow-x:auto;}
.datatable-wrap{max-height:420px;overflow:auto;border:1px solid var(--border-soft);border-radius:8px;}
/* Correção pós-publicação (rodada de revisão geral de UI, 2º ajuste): a versão anterior daqui
   tentava avisar "tem mais coluna pra esse lado" com um degradê de sombra nas bordas do
   wrapper (técnica 100% CSS, 4 camadas de background) -- o usuário achou que a sombra polui
   mais do que ajuda ("não gostei dela... mais polui do que de fato ajuda"). Removida por
   completo. O aviso de que a tabela rola continua existindo por 2 vias mais diretas e menos
   "decorativas": a barra de rolagem própria, mais grossa e visível (ver ::-webkit-scrollbar
   logo abaixo) e o aviso textual "Arraste para o lado..." que o JS insere quando a tabela
   realmente transborda (ver initTableScrollHints no <script>) -- nenhum dos dois foi
   contestado, só a sombra. */
/* Correção pós-publicação (45ª rodada, otimização mobile; texto ajustado na rodada acima): a
   barra de rolagem horizontal genérica do <body> (10px, cor var(--border) -- bem apagada
   contra var(--surface) no tema claro) quase não aparecia nesses wrappers, reforçando a
   sensação de "cortado" em vez de "role pro lado". Aqui ela ganha trilho visível e um polegar
   mais grosso/contrastado (var(--accent-pale)), só dentro dos wrappers de tabela larga -- não
   muda a barra de rolagem vertical do resto do app. */
.tablewrap::-webkit-scrollbar, .datatable-wrap::-webkit-scrollbar,
.estoque-wrap::-webkit-scrollbar, .ativo-compare-wrap::-webkit-scrollbar{height:9px;width:9px;}
.tablewrap::-webkit-scrollbar-track, .datatable-wrap::-webkit-scrollbar-track,
.estoque-wrap::-webkit-scrollbar-track, .ativo-compare-wrap::-webkit-scrollbar-track{background:var(--surface-2);}
.tablewrap::-webkit-scrollbar-thumb, .datatable-wrap::-webkit-scrollbar-thumb,
.estoque-wrap::-webkit-scrollbar-thumb, .ativo-compare-wrap::-webkit-scrollbar-thumb{
  background:var(--accent-pale);border-radius:6px;border:2px solid var(--surface-2);background-clip:padding-box;
}
/* .scrollhint: legenda textual curta inserida logo abaixo de QUALQUER wrapper de tabela larga
   que esteja de fato cortando conteúdo (scrollWidth > clientWidth) -- pedido recorrente do
   usuário sobre notebook/celular ("as tabelas ficam cortadas"). A barra de rolagem maior
   (acima) já ajuda visualmente, mas a frase deixa explícito o que fazer, sem precisar
   "descobrir" arrastando. Inserida via JS (ver initTableScrollHints, chamada por um
   MutationObserver em #main -- roda pra QUALQUER tabela larga nova, atual ou futura, sem
   precisar tocar em cada função de render individualmente) só quando a tabela realmente
   transborda -- nunca aparece numa tabela que já cabe inteira na tela. */
.scrollhint{
  display:flex;align-items:center;gap:5px;font-size:10.8px;color:var(--ink-faint);
  margin:6px 0 0;
}
.scrollhint svg{flex:0 0 auto;}
.datatable-wrap table{font-size:11.8px;}
.datatable-wrap thead th{position:sticky;top:0;background:var(--surface-2);box-shadow:0 1px 0 var(--border);}
.datatable-wrap td{white-space:nowrap;}
.datatable-meta{font-size:11.5px;color:var(--ink-faint);margin-bottom:8px;}
/* .navy-head (correção pós-publicação, 2ª rodada): cabeçalho azul-marinho pras tabelas
   .datatable-wrap/.amort-table de MSB Axis (Integralizações, abertura mensal de Carteira) --
   igual ao tom das outras tabelas da operação (mesmo var(--accent-strong) do cabeçalho de
   .estoque-table/.cve-table). Classe modificadora à parte pra não mudar a "Tabela de
   amortização mensal" padrão (usada por várias outras operações). */
.datatable-wrap.navy-head thead th{background:var(--accent-strong);color:var(--accent-ink);}
.navy-head .amort-dash{color:var(--ink-faint);}
/* Carteira, Vendas e Estoque -- Abertura Mensal (4ª rodada, ponto 4): cabeçalho de 2 níveis
   (grupo AXIS/SYNC/Consolidado + coluna), os 2 níveis fixos ao rolar verticalmente; a
   .datatable-wrap já rola na horizontal (overflow:auto) pras 16 colunas. */
.carteiradetalhe-table{font-size:10.6px;}
.carteiradetalhe-table th,.carteiradetalhe-table td{padding:6px 7px;white-space:nowrap;}
.carteiradetalhe-table thead tr.grouphead th{height:26px;font-size:9.8px;text-transform:uppercase;letter-spacing:.04em;top:0;}
.carteiradetalhe-table thead tr.subhead th{height:34px;line-height:1.25;top:26px;}
/* .onlyhead (correção pós-publicação, 43ª rodada, ponto 3): cabeçalho de 1 nível só, usado
   pela versão torre única (MSB Triu -- sem AXIS/SYNC, então sem tr.grouphead acima). Reusar
   tr.subhead (top:26px) aqui era o bug reportado: sem a linha de grupo ocupando os 26px
   anteriores, o cabeçalho ficava "grudado" 26px abaixo do topo do container, sobrando uma
   faixa vazia em cima por onde a 1ª linha de dado (ex.: "jan/23") aparecia por trás -- lido
   como "título bugado". top:0 aqui porque essa é a ÚNICA linha do thead. */
.carteiradetalhe-table thead tr.onlyhead th{height:34px;line-height:1.25;top:0;}
.carteiradetalhe-table thead th{position:sticky;z-index:2;}
.carteiradetalhe-table thead tr.grouphead th:not(:first-child){border-left:1px solid rgba(255,255,255,.25);}
.carteiradetalhe-table td:first-child,.carteiradetalhe-table th:first-child{position:sticky;left:0;z-index:3;}
.carteiradetalhe-table thead tr.grouphead th:first-child{z-index:4;}
.carteiradetalhe-table td:first-child{background:var(--surface);box-shadow:1px 0 0 var(--border-soft);}
.carteiradetalhe-table thead th:first-child{box-shadow:1px 0 0 rgba(255,255,255,.25);}
/* Correção pós-publicação (42ª rodada, MSB Axis, ponto 7): "o layout facilita a visualização
   e fica na página toda [...] não precisa ficar arrastando pro lado" -- a tabela AXIS/SYNC
   original (16 colunas) precisava de scroll horizontal pra caber. Sem tirar NENHUM dado
   mostrado, "Vendas (un)"+"Vendas (R$)" e "Preço Médio"+"Preço LTM Pond." de cada torre
   agora empilham em 1 célula cada (valor principal embaixo, secundário acima em cinza menor)
   -- cai de 6 pra 4 colunas por torre (12 no total + Mês), cabendo sem arrastar na largura
   normal da página. */
.carteiradetalhe-table td.cd-stack{line-height:1.35;}
.carteiradetalhe-table td.cd-stack .cd-sub{display:block;font-size:9px;color:var(--ink-faint);font-weight:500;}
/* linhas-resumo Emitido/Integralizado/A Integralizar no topo da tabela de Integralizações
   (2ª rodada, ponto 2). Correção pós-publicação (4ª rodada, ponto 5): o destaque em azul-claro
   nas 3 linhas (fundo tint + texto azul) ficou "grotesco". Correção pós-publicação (5ª rodada,
   ponto 4): olhando de novo o exemplo do usuário com mais cuidado, ele NÃO é 100% sem cor --
   só a linha "A Integralizar" (a que importa operacionalmente, o saldo pendente) tem uma faixa
   azul-clara; "Emitido"/"Integralizado" ficam mesmo em texto preto sobre fundo branco. Faz mais
   sentido: destaca só o número que precisa de atenção, não o bloco inteiro. */
.integ-table tr.integ-summary-row td{color:var(--ink);font-weight:700;text-align:center;border-bottom:1px dashed var(--border-soft);}
.integ-table tr.integ-summary-row:last-child td{border-bottom:2px solid var(--accent-strong);}
.integ-table tr.integ-pendente td{background:var(--accent-tint);color:var(--accent-strong);}
.amort-table th{text-align:center;}
.amort-table td{text-align:center;}
/* .amort-table thead th (mesmo pedido de padrão já aplicado em Posição por Fundo/Visão Geral/
   Acompanhamento/Mini-DRE): "Tabela de amortização mensal" -- padrão em TODAS as operações
   (buildDataTable com extraClass='amort-table', único call-site, linha ~3578) -- ganha o mesmo
   par var(--accent-pale)/var(--accent-strong) no cabeçalho de coluna. Especificidade igual à
   regra genérica .datatable-wrap thead th (cinza/sticky, mais acima no arquivo) -- por vir
   DEPOIS no CSS, esta vence só nas th que também têm .amort-table como ancestral; position:
   sticky/box-shadow da regra genérica continuam valendo (só bg/cor são sobrescritos). NÃO
   afeta as variantes com .navy-head (carteiraDetalheTableHtml/Integralizações), que já têm
   cabeçalho azul-marinho sólido próprio e especificidade maior (.datatable-wrap.navy-head
   thead th) -- essas não fizeram parte da reclamação (já tinham cor). */
.amort-table thead th{background:var(--accent-pale);color:var(--accent-strong);}
.amort-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.amort-toolbar .amort-field{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-faint);}
.amort-toolbar select{
  font-family:inherit;font-size:11.8px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-soft);border-radius:6px;padding:5px 8px;cursor:pointer;
}
.amort-toolbar select:hover{border-color:var(--ink-faint);}
.amort-toolbar .amort-clear{
  font-size:11.5px;color:var(--accent);background:none;border:none;cursor:pointer;
  padding:4px 2px;text-decoration:underline;
}
.amort-toolbar .amort-clear:hover{color:var(--ink);}
.amort-toolbar .amort-count{font-size:11px;color:var(--ink-faint);margin-left:auto;}

.chart-nav{display:flex;align-items:center;gap:4px;align-self:center;}
.chart-nav-btn{
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  font-size:13px;line-height:1;color:var(--ink-faint);background:var(--surface);
  border:1px solid var(--border-soft);border-radius:5px;cursor:pointer;padding:0;
}
.chart-nav-btn:hover:not(:disabled){color:var(--ink);border-color:var(--ink-faint);}
.chart-nav-btn:disabled{opacity:.35;cursor:default;}
.chart-nav-select{
  font-family:inherit;font-size:11px;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-soft);border-radius:5px;padding:3px 5px;cursor:pointer;
}
.chart-nav-select:hover{border-color:var(--ink-faint);}

.statuschip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;
  font-size:11px;font-weight:600;white-space:nowrap;
}
.statuschip.good{background:var(--good-bg);color:var(--good);}
.statuschip.warn{background:var(--warn-bg);color:var(--warn);}
.statuschip.critical{background:var(--critical-bg);color:var(--critical);}
.statuschip.neutral{background:var(--neutral-bg);color:var(--ink-muted);}
.badge{
  font-size:10.5px;font-family:var(--font-mono);padding:2px 7px;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--border-soft);color:var(--ink-muted);
}
/* .refbadge (teste Ago/26, atualização parcial por operação -- ver opRefBadgeHtml): tom
   var(--warn) de propósito (mesmo usado em statuschip.warn/"Verificar" de Obrigações) -- é um
   aviso de atenção ("esse dado não é do mês selecionado"), não uma etiqueta neutra tipo .badge/
   .fundchip. Cabe ao lado do nome da operação na sidebar, na tabela da Visão Geral e no
   cabeçalho da página de detalhe -- ver call-sites de opRefBadgeHtml. */
.refbadge{
  display:inline-flex;align-items:center;flex:0 0 auto;font-size:9.5px;font-weight:700;
  font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;
  padding:2px 6px;border-radius:5px;background:var(--warn-bg);color:var(--warn);
  white-space:nowrap;vertical-align:middle;
}
/* .sub-stale (ver opRefLineHtml, 2º ajuste): modificador de #detail-head .sub -- a linha "Data
   Base: X" usa a cor normal (var(--ink-muted), herdada de #detail-head .sub) quando a operação
   está em dia; fica var(--warn) só quando o dado exibido está atrasado em relação ao mês
   selecionado no topo. */
.sub-stale{color:var(--warn);font-weight:600;}
.fundchip{
  display:inline-block;font-size:11px;font-weight:700;font-family:var(--font-mono);
  padding:3px 8px;border-radius:5px;background:var(--accent-tint);color:var(--accent-strong);
  letter-spacing:.02em;
}

/* ---------- detail ---------- */
/* .back-btn (pente-fino de padronização): redesenho pedido explicitamente pelo usuário
   ("já que a gente mexeu nos outros, dá pra ter uma coisa mais bonita também") -- antes era
   só texto com "←" literal, sem nenhuma affordance de botão. Agora é um chip fantasma
   (ghost) com borda sutil, ícone SVG que "recua" no hover (mesma linguagem de interação do
   .subpage-link, mas em ação inversa: a seta anda pra ESQUERDA no hover, reforçando "voltar").
   Fica com margem inferior própria (em vez de padding-bottom) pra não colar no conteúdo. */
.back-btn{
  display:inline-flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--border-soft);border-radius:8px;color:var(--ink-muted);
  font-size:12.5px;font-weight:600;cursor:pointer;padding:7px 12px;margin:0 0 16px;
  font-family:var(--font-body);transition:background .15s ease,color .15s ease,border-color .15s ease,transform .15s ease;
}
.back-btn svg{transition:transform .15s ease;flex:0 0 auto;}
.back-btn:hover{background:var(--accent-tint);color:var(--accent-strong);border-color:var(--accent-pale);transform:translateX(-1px);}
.back-btn:hover svg{transform:translateX(-2px);}
.back-btn:active{transform:translateX(0);}
#detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
#detail-head h2{font-size:26px;color:var(--ink);}
#detail-head .sub{font-size:12.5px;color:var(--ink-muted);margin-top:4px;}
#detail-head .sub b{color:var(--ink);font-weight:600;}

#quickstats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;}
.qstat{background:var(--surface);border:1px solid var(--border-soft);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);text-align:center;}
.qstat .label{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:600;margin-bottom:5px;}
.qstat .value{font-family:var(--font-mono);font-size:15.5px;color:var(--ink);font-weight:600;}
.qstat .value .qstat-sub{display:block;font-size:11px;color:var(--ink-faint);font-weight:500;margin-top:2px;}

/* Garantias | Itens de Acompanhamento agora SEMPRE com a mesma altura (32ª rodada, regra
   geral pra todas as operações — pedido do usuário depois de ver os 2 cards da Localfrio com
   alturas bem diferentes: "vamos respeitar o tamanho dos dois cards [...] isso vai ser um
   padrão para todas as operações"). Antes `align-items:start` deixava cada coluna do tamanho
   do próprio conteúdo (cards baixos ficavam com uma "sobra" de espaço vazio ao lado do card
   mais alto); agora as 2 colunas esticam pra mesma altura da mais alta, e o `.panel`/`.panel-body`
   de cada uma esticam junto (só dentro do `#detail-grid` — escopado pra não alterar nenhum outro
   `.panel` do app, como Highlights/Sobre a Operação/Posição por Fundo).*/
/* margin-bottom:20px (36ª rodada, ponto 8 -- pedido geral, vale pra todas as operações):
   sem isso, o #detail-grid (Garantias/Itens de Acompanhamento) não tinha margem própria
   nenhuma, e o espaço até o próximo card (Acompanhamento das Locações/de Estoque/Fluxo
   Mensal, que só têm margin-top:2px) colapsava pros 2px do card seguinte em vez dos 20px
   padrão entre os demais cards do app (ver .panel{margin-bottom:20px}) -- ficava visivelmente
   "colado", only right after esse grid específico. Alinha com o padrão do resto da tela. */
#detail-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;align-items:stretch;margin-bottom:20px;}
#detail-grid>div{min-width:0;display:flex;flex-direction:column;}
#detail-grid>div>.panel{flex:1;display:flex;flex-direction:column;margin-bottom:0;}
/* O card mais curto ganha a altura do mais alto (regra acima), mas isso por si só deixava uma
   sobra de espaço em branco "solta" embaixo do conteúdo (feedback do usuário vendo o resultado
   ao vivo: "ao invés de colocar uma parte branca feia, tentar ajustar o texto para encaixar,
   lembra que você é um programador e sabe bem de layout"). Solução em 2 partes, calculada em
   JS por fillDetailGridSpacing() (chamada no fim de showDetail()) e sem depender do conteúdo
   específico de nenhuma operação:
   1) A folga (altura alocada − altura natural do conteúdo) é convertida numa variável CSS
      --row-extra e somada ao padding vertical de cada "linha" existente (linha de tabela,
      dt/dd da ficha de garantia, assetcard, covitem) — o conteúdo que já existe respira mais
      e ocupa o espaço, em vez de sobrar em branco. Isso é limitado a um máximo por linha
      (ver JS) pra não deixar linhas absurdamente altas quando a diferença for grande ou
      houver poucas linhas pra distribuir a folga.
   2) O que sobrar depois do limite acima é resolvido centralizando o bloco de conteúdo
      verticalmente (justify-content:center) — a sobra residual fica dividida em cima/embaixo
      em vez de empilhada inteira embaixo.
   Quando o conteúdo já preenche a altura toda (o card mais alto, que dita a altura dos dois)
   nada disso tem efeito, então é seguro como regra geral pra qualquer operação. */
#detail-grid>div>.panel>.panel-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;}
/* Filho direto de um flex container tem min-width automático = largura do conteúdo sem quebra
   ("flexbox min-width:auto blowout") -- sem isso, uma célula de tabela com um valor longo (ex.:
   nome de ativo grande) deixa de quebrar linha e vaza por cima do card vizinho, cortado pelo
   overflow:hidden do .panel. Detectado na WT Log (33ª rodada) mas é um efeito colateral genérico
   de virar .panel-body em flex container (regra geral #28) -- corrigido pra qualquer operação. */
#detail-grid>div>.panel>.panel-body>*{min-width:0;}
/* Usada só um instante (via JS, fillDetailGridSpacing) pra medir a altura natural de cada card
   sem a esticada do align-items:stretch — ver comentário da função no <script>. */
#detail-grid.detail-grid-measuring{align-items:start;}
#detail-grid .assetcard{padding-top:calc(12px + var(--row-extra,0px));padding-bottom:calc(12px + var(--row-extra,0px));}
#detail-grid .covitem{padding-top:calc(11px + var(--row-extra,0px));padding-bottom:calc(11px + var(--row-extra,0px));}
#detail-grid dl.kv dt,#detail-grid dl.kv dd{padding-top:calc(7px + var(--row-extra,0px));padding-bottom:calc(7px + var(--row-extra,0px));}
#detail-grid .ativo-compare-table td.ai-label,#detail-grid .ativo-compare-table td.ai-val{padding-top:calc(8px + var(--row-extra,0px));padding-bottom:calc(8px + var(--row-extra,0px));}
#detail-grid .ativo-info-table td{padding-top:calc(8px + var(--row-extra,0px));padding-bottom:calc(8px + var(--row-extra,0px));}
@media (max-width:1000px){#detail-grid{grid-template-columns:1fr;}#detail-grid>div>.panel{flex:none;}}

dl.kv{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;margin:0;}
dl.kv .row{display:contents;}
dl.kv dt{font-size:11.5px;color:var(--ink-faint);padding:7px 0;border-bottom:1px solid var(--border-soft);text-align:center;}
dl.kv dd{margin:0;font-size:12.8px;color:var(--ink);padding:7px 0;border-bottom:1px solid var(--border-soft);text-align:center;font-family:var(--font-mono);}

.assetcard{
  border:1px solid var(--border-soft);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2);
}
.assetcard h4{font-size:13px;margin-bottom:8px;color:var(--ink);}
.assetcard dl.kv dt,.assetcard dl.kv dd{border-bottom:1px dashed var(--border-soft);}

.covitem{border-bottom:1px solid var(--border-soft);padding:11px 0;}
.covitem:last-child{border-bottom:none;}
.covitem-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;}
.covitem-top .item{font-size:12.8px;font-weight:600;color:var(--ink);}
.covitem-vals{display:flex;gap:14px;font-size:11.8px;color:var(--ink-muted);margin-bottom:4px;flex-wrap:wrap;}
.covitem-vals b{color:var(--ink);font-family:var(--font-mono);font-weight:600;}
/* Correção pós-publicação (rodada de revisão geral de UI): a descrição de um covenant (c.obs)
   costuma ser um trecho jurídico copiado direto da planilha (ex.: a definição inteira de Fundo
   de Reserva, várias frases) -- sempre exibida por extenso, o card de Itens de Acompanhamento
   virava uma parede de texto, em TODAS as operações (pedido repetido do usuário: "ajustar esses
   textos descritivos... pra todas as operações, pra ficar uma coisa pequena"). .obs-clamp
   corta em 2 linhas por padrão (-webkit-line-clamp, suportado em Chrome/Edge/Safari); o botão
   "Ver mais"/"Ver menos" só é inserido pelo JS (initCovitemObsToggles) quando o texto realmente
   passa de 2 linhas -- descrições curtas continuam exatamente como estavam, sem botão nenhum. */
.covitem-obs{font-size:11.3px;color:var(--ink-muted);line-height:1.4;}
.covitem-obs.obs-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;}
.covitem-obs.obs-expanded{display:block;-webkit-line-clamp:unset;overflow:visible;}
.covitem-obs-toggle{
  display:inline-block;margin-top:3px;font-size:10.8px;font-weight:600;color:var(--accent);
  background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
}
.covitem-obs-toggle:hover{color:var(--ink);text-decoration:underline;}
.covitem-dates{font-size:10.5px;color:var(--ink-faint);margin-top:4px;font-family:var(--font-mono);}
.covitem-calc{font-size:11px;margin-top:6px;padding:6px 9px;border-radius:6px;line-height:1.4;}
.covitem-calc b{font-family:var(--font-mono);}
.covitem-calc.calc-ok{background:var(--good-bg);color:var(--good);}
.covitem-calc.calc-diverge{background:var(--critical-bg);color:var(--critical);font-weight:600;}
.covitem-calc.calc-neutral{background:var(--neutral-bg);color:var(--ink-muted);}

.notelist{margin:0;padding-left:18px;font-size:12px;color:var(--ink-muted);}

/* Sobre a Operação | Características da Operação (lado a lado) + Highlights (largura total) */
#top-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch;margin-bottom:18px;}
@media (max-width:900px){#top-row{grid-template-columns:1fr;}}

.sobre-panel .panel-body{font-size:12.6px;color:var(--ink-muted);line-height:1.55;}
.sobre-panel .panel-body p{margin:0 0 10px;}
.sobre-panel .panel-body p:last-child{margin-bottom:0;}
.sobre-bullets{margin:0;padding-left:18px;list-style:disc;}
.sobre-bullets li{margin-bottom:10px;}
.sobre-bullets li:last-child{margin-bottom:0;}
.sobre-bullets li::marker{color:var(--accent);}

.docchat-wrap{border-top:1px dashed var(--border-soft);padding-top:14px;margin-top:14px;}
.docchat-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);margin-bottom:10px;}
.docchat-empty{font-size:12px;color:var(--ink-faint);}
.docchat-files{margin-bottom:8px;}
.docchat-files-toggle{font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;text-decoration:underline;font-family:inherit;}
.docchat-files-toggle:hover{color:var(--ink);}
.docchat-files-list{list-style:disc;margin:6px 0 0;padding-left:18px;font-size:11px;color:var(--ink-muted);}
.docchat-files-list li{margin-bottom:3px;word-break:break-word;}
.docchat-log{max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:10px;padding-right:2px;}
.docchat-hint{font-size:12px;color:var(--ink-faint);font-style:italic;}
/* .docchat-suggestions/.docchat-suggestion (49ª rodada, pedido explícito do usuário:
   "conseguimos melhorar essa interação?") -- perguntas prontas clicáveis (ver docChatHtml),
   pill no mesmo estilo visual de outros badges pequenos do portal (borda + fundo neutro,
   hover levanta pro tom de destaque), só que clicável -- não é status, é ação. */
.docchat-suggestions{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.docchat-suggestion{font-family:inherit;font-size:11.3px;font-weight:600;color:var(--ink-muted);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:20px;padding:5px 12px;cursor:pointer;text-align:left;}
.docchat-suggestion:hover{color:var(--accent-strong);background:var(--accent-tint);border-color:var(--accent-tint);}
.docchat-msg{font-size:12.6px;line-height:1.5;padding:8px 11px;border-radius:9px;white-space:pre-wrap;max-width:92%;}
.docchat-msg-user{background:var(--accent-tint);color:var(--ink);align-self:flex-end;border-bottom-right-radius:2px;}
.docchat-msg-assistant{background:var(--surface-2);color:var(--ink);align-self:flex-start;border-bottom-left-radius:2px;}
/* Conteúdo da resposta do assistente vira HTML controlado (ver docChatRenderMarkdownLite) em
   vez de texto puro -- antes **negrito**/"- item" apareciam como asterisco/traço literal na
   tela, que é exatamente a "confusão" que o usuário apontou. <p>/<ul>/<li>/<strong> reais
   agora, com espaçamento compacto (é uma bolha de chat, não um documento). */
.docchat-msg-assistant p{margin:0 0 6px;}
.docchat-msg-assistant p:last-child{margin-bottom:0;}
.docchat-msg-assistant ul{margin:2px 0 6px;padding-left:18px;}
.docchat-msg-assistant ul:last-child{margin-bottom:0;}
.docchat-msg-assistant li{margin-bottom:3px;}
.docchat-msg-assistant li:last-child{margin-bottom:0;}
.docchat-msg-assistant strong{font-weight:700;color:var(--ink);}
.docchat-inputrow{display:flex;gap:8px;}
.docchat-input{flex:1;font-family:inherit;font-size:12.8px;color:var(--ink);background:var(--surface-2);border:1px solid var(--border-soft);border-radius:8px;padding:8px 10px;}
.docchat-input:disabled{opacity:.6;}
.docchat-send,.docchat-stop{font-family:inherit;font-size:12.5px;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;border:none;}
.docchat-send{background:var(--accent-strong);color:var(--accent-ink);}
.docchat-send:disabled{opacity:.5;cursor:default;}
.docchat-stop{background:var(--surface-2);color:var(--ink-muted);border:1px solid var(--border-soft);}
.docchat-note{font-size:11px;color:var(--ink-faint);margin-top:6px;min-height:14px;}
.docchat-freshness{font-size:10.8px;color:var(--ink-faint);margin-bottom:9px;padding-bottom:9px;border-bottom:1px dashed var(--border-soft);}
.docchat-obliglink{margin-top:10px;}
.docchat-obliglink .subpage-link{padding:7px 14px;font-size:11.8px;}

.highlights-panel{grid-column:1/-1;}
.highlights-panel .panel-body{padding:14px 18px;}
.highlights-list{margin:0;padding-left:20px;font-size:12.8px;color:var(--ink);line-height:1.6;}
.highlights-list li{margin-bottom:7px;}
.highlights-list li:last-child{margin-bottom:0;}
.highlights-empty{font-size:12px;color:var(--ink-faint);}

/* Leitura de Atas e Aditamentos (pedido do usuário: "quero que a IA entenda quais foram as
   últimas atas... tem alguma pendência?") -- cards usados na sub-página showDocObrigDetail
   (o painel full-width que existia na própria página de detalhe foi removido depois, pedido do
   usuário: "como criamos a subpágina, não faz sentido ainda manter esse card assim"). Reaproveita
   .statuschip (bom/warn/critical/neutral) pra manter o mesmo vocabulário visual já usado em
   Itens de Acompanhamento/Obrigações -- mesmo essa lista vindo de uma fonte diferente (leitura
   de ata, não da planilha), quem olha a tela não deve precisar aprender um código de cor novo. */
.oblig-item{padding:11px 0;border-bottom:1px solid var(--border-soft);}
.oblig-item:last-child{border-bottom:none;}
.oblig-item-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
/* .oblig-item-top/.oblig-item-title (47ª rodada, pedido explícito do usuário: "não consigo
   identificar certinho qual ata que foi, a data e o conteúdo dela" / "não consigo identificar
   pelo título rápido qual documento que é qual") -- antes o card liderava com o NOME DO ARQUIVO
   (.oblig-source, fonte mono pequena), obrigando a ler a descrição inteira pra entender do que
   se tratava. Agora o título curto (o.titulo na leitura de atas / instr.nome_curto nos
   documentos) vira a linha de destaque, no mesmo padrão visual de .covitem-top/.covitem-top
   .item (Itens de Acompanhamento) que o usuário já validou -- título em negrito à esquerda,
   status à direita. Nome de arquivo/nome legal completo viram texto secundário, abaixo. */
.oblig-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:4px;}
/* .oblig-item-title vira badge (49ª rodada, pedido explícito do usuário: "conseguimos colocar
   dentro de um quadrado igual ta o prazo azul claro com o texto em negrito?"). 1ª tentativa
   reaproveitou --surface-2 (cinza) igual ao .oblig-date -- usuário apontou que ficou cinza, não
   azul, e "continua confuso do mesmo jeito": "faltou colocar a cor azul que eu falei para
   diferenciar". Troca pro par --accent-tint/--accent-strong (mesma linguagem visual de .fundchip,
   badge azul já validado em outro lugar do portal), que dá o contraste de cor que faltava --
   mantém sem white-space:nowrap (título pode ser longo e quebrar em 2 linhas dentro do quadrado). */
.oblig-item-title{display:inline-flex;font-size:13px;font-weight:600;color:var(--accent-strong);line-height:1.4;background:var(--accent-tint);border-radius:6px;padding:4px 10px;}
.oblig-item-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px;}
/* .oblig-date: a data vira um "badge" próprio (antes ficava diluída no fim da linha de fonte,
   ex. "arquivo.pdf · 14/06/2021") -- pedido do usuário de identificar "certinho... a data" à
   primeira vista, não só depois de achar no meio do texto. */
.oblig-date{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-muted);background:var(--surface-2);border-radius:6px;padding:2px 8px;font-family:var(--font-mono);white-space:nowrap;}
.oblig-source{font-size:11px;color:var(--ink-faint);font-family:var(--font-mono);}
.oblig-desc{font-size:12.8px;color:var(--ink);line-height:1.5;}
/* .oblig-resumo (48ª rodada, pedido explícito do usuário: "trazer um pouco brevemente, mas
   muito brevemente o que foi a ata") -- 1 frase curta entre o título e a descrição completa,
   pra dar o essencial num piscar de olhos antes do parágrafo detalhado. Mesma rodada removeu
   TODOS os emojis desta seção (🗓️/⏱️/📄/⚠/✅/✕) -- pedido explícito: "aqui é um portal
   profissional... vamos manter o padrão" (o resto do portal não usa emoji, só cor+texto nos
   chips) -- e moveu a data da ata pro próprio título ("Ata DD/MM/AAAA — título"), então o
   .oblig-date da fonte_data (que existia aqui) foi removido; só o de prazo continua.  */
.oblig-resumo{font-size:12.8px;font-weight:600;color:var(--ink);line-height:1.45;margin-bottom:6px;}
/* .aditamento-chips/.aditamento-chip: cadeia de aditamentos como chips escaneáveis (antes era
   1 linha de texto corrido) -- verde = presente na pasta, vermelho/tênue = faltando, pra bater o
   olho e já ver quais números faltam sem ler frase por frase. */
.aditamento-chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px;}
.aditamento-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap;}
.aditamento-chip-date{font-weight:500;font-family:var(--font-mono);opacity:.85;}
.aditamento-ok{background:var(--good-bg);color:var(--good);}
.aditamento-missing{background:var(--critical-bg);color:var(--critical);opacity:.85;}
.oblig-nota{font-size:11.3px;color:var(--ink-muted);line-height:1.4;margin-top:5px;padding-left:10px;border-left:2px solid var(--border-soft);}
/* .oblig-docstatus (pedido do usuário: "identificar na pasta de cada operação se essa
   obrigação/documento está na pasta. E informar caso não tiver ou se já estiver") -- linha
   própria, sempre presente, pra essa checagem nunca ficar escondida dentro do texto corrido. */
.oblig-docstatus{font-size:11.8px;font-weight:600;line-height:1.4;margin-top:7px;padding:6px 10px;border-radius:6px;}
.oblig-docstatus-found{color:var(--good);background:var(--good-bg);}
.oblig-docstatus-missing{color:var(--warn);background:var(--warn-bg);}
/* .oblig-item-muted (histórico -- ata superada): mesma estrutura de card, mas neutralizada --
   sem cor de status (chip fica cinza "Histórico" em vez de bom/atenção/crítico), pra ficar
   claro que é contexto, não pendência ativa. */
.oblig-item-muted{opacity:.72;}

/* Garantias: Locatários + Informações do Ativo */
.loc-table thead th{
  background:var(--accent-strong);color:var(--accent-ink);text-transform:none;
  letter-spacing:0;font-size:11.5px;text-align:center;position:sticky;top:0;box-shadow:none;
}
.loc-table td{text-align:center;}
.loc-table td:first-child{text-align:left;}
.loc-table tbody tr:nth-child(even){background:var(--surface-2);}
.locrow-total{font-weight:700;background:var(--accent-strong)!important;color:var(--accent-ink);}
.locrow-total td{border-bottom-color:var(--accent-strong);}
/* .fundpos-totalrow (Posição por Fundo, pente-fino de padronização + 2 ajustes de tom):
   propositalmente uma classe PRÓPRIA, não reusa .locrow-total (essa é das tabelas de Locação de
   Ativos e não devia ser tocada por um pedido que era só sobre Posição por Fundo -- ver histórico
   de correção logo acima, em fundPositionsHtml). Mesma ideia de fundo (linha de total com mais
   destaque que a zebra normal), ajustada em 2 rodadas de feedback: 1ª tentativa sólida (igual
   .locrow-total) ficou "grotesca" com várias colunas vazias por colspan; 2ª tentativa
   (var(--accent-tint)) ficou fraca demais ("fica igual antes de não ver nada"); var(--accent-pale)
   é o meio-termo -- claramente visível, dentro da mesma paleta do painel. Texto em
   var(--accent-strong), a MESMA cor do título do painel (.panel-head h2) -- pedido explícito do
   usuário de título e total com a mesma cor. */
.fundpos-totalrow{font-weight:700;background:var(--accent-pale)!important;color:var(--accent-strong);}
.fundpos-totalrow td{border-bottom-color:var(--accent-strong);}
/* .locrow-subtotal cores (44ª rodada -- pedido do usuário com print circulado em vermelho nas
   linhas "Subtotal - CF + AF"/"Subtotal - CF" de BR Prop): "vamos deixar as cores que colocamos
   na planilha de posição dos fundos" -- mesmo par bg/texto de .fundpos-totalrow acima
   (var(--accent-pale) + var(--accent-strong)). Só a cor muda; peso/itálico permanecem (o pedido
   foi especificamente sobre cor, não sobre tornar essas linhas idênticas ao total geral
   .locrow-total, que continua sólido/azul-marinho para não perder a hierarquia visual entre
   subtotal parcial e "Total CF" geral). Classe usada SOMENTE por BR Prop (única operação cujo
   parse_locacoes_brprop() no build_data.py gera linhas com _subtotal:true) -- confirmado antes
   de editar, não precisa de escopo adicional; nenhuma outra operação (Localfrio, WT Log etc.)
   usa .locrow-subtotal. */
.locrow-subtotal{font-weight:600;font-style:italic;background:var(--accent-pale)!important;color:var(--accent-strong);}
.locrow-subtotal td{border-bottom-color:var(--accent-strong);}
/* .fundpos-table thead th (ajuste pedido pelo usuário com print circulado): "título da tabela"
   é o cabeçalho de coluna (FUNDO/TRANCHE/SALDO CURVA/...), não o título do painel acima -- ele
   e a linha de total (.fundpos-totalrow) precisam usar o MESMO tom de azul, os 2 pontos
   circulados no print. Mesmo par bg/texto do .fundpos-totalrow (var(--accent-pale) +
   var(--accent-strong)) -- cabeçalho e total "emolduram" a tabela na mesma cor, corpo da
   tabela continua neutro. Escopado só a .fundpos-table -- não mexe no th genérico do resto do
   portal. */
.fundpos-table thead th{background:var(--accent-pale);color:var(--accent-strong);}
.fundpos-table th{text-align:center;}
.fundpos-table td{text-align:center;}
/* .optable-maintable thead th: mesmo pedido, agora na tabela "Operações" da Visão Geral (print
   com a linha de chips MCCE/MCCI/... e o cabeçalho OPERAÇÃO/SECURITIZADORA/... circulado) --
   MESMO par bg/texto do cabeçalho de .fundpos-table (var(--accent-pale) + var(--accent-strong)),
   pra ficar 1 padrão só de "cabeçalho de tabela" no portal. Classe própria (.optable-maintable),
   escopada só na tabela de Operações -- .responsive-table também é usada pela tabela de
   Acompanhamento (.acomp-table), que o usuário não pediu pra mexer aqui. */
.optable-maintable thead th{background:var(--accent-pale);color:var(--accent-strong);}
.ativo-info-table{border-collapse:collapse;width:100%;table-layout:fixed;}
.ativo-info-table td{padding:8px 0;border-bottom:1px dashed var(--border-soft);vertical-align:top;white-space:normal;word-wrap:break-word;overflow-wrap:break-word;}
.ativo-info-table td.ai-label{width:38%;font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;padding-right:10px;text-align:center;}
.ativo-info-table td.ai-val{font-size:12.6px;color:var(--ink);text-align:center;}
.ativo-info-table td.ai-val ul.ativo-bullets{text-align:left;list-style-position:inside;padding-left:0;display:inline-block;}
.ativo-info-table tr:last-child td{border-bottom:none;}
.ativo-bullets{margin:0;padding-left:16px;}
.ativo-bullets li{margin-bottom:3px;}
.notelist li{margin-bottom:5px;}

/* "Informações do Ativo" em formato comparativo lado a lado (31ª rodada, Localfrio) —
   opt-in via op.ativo_compare, não altera .ativo-info-table (formato empilhado padrão
   usado por todas as outras operações multi-ativo). Fica dentro do MESMO card "Garantias"
   de sempre (coluna esquerda de #detail-grid, 1.35fr) — por isso a rolagem horizontal
   própria em vez de alargar a coluna, o que comprimiria "Itens de Acompanhamento" ao lado. */
.ativo-compare-wrap{overflow-x:auto;}
.ativo-compare-table{border-collapse:collapse;width:100%;min-width:460px;table-layout:fixed;}
.ativo-compare-table th{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;font-weight:600;text-align:center;padding:0 10px 10px;white-space:normal;word-wrap:break-word;}
.ativo-compare-table td.ai-label{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;padding:8px 10px 8px 0;text-align:left;vertical-align:top;white-space:normal;}
.ativo-compare-table td.ai-val{font-size:12.4px;color:var(--ink);text-align:center;padding:8px 10px;vertical-align:top;border-left:1px dashed var(--border-soft);white-space:normal;word-wrap:break-word;overflow-wrap:break-word;}
.ativo-compare-table tr td{border-bottom:1px dashed var(--border-soft);}
.ativo-compare-table tr:last-child td{border-bottom:none;}
/* .ativo-compare-table--1col (Características de operação de série única, ver
   caracteristicasSingleHtml): sem o min-width:460px pensado pra 2+ colunas de valor lado a
   lado -- com 1 coluna só, isso forçava um scroll horizontal que o <dl class="kv"> antigo nunca
   teve nesse painel mais estreito. */
.ativo-compare-table--1col{min-width:0;}
.ativo-compare-footnote{font-size:10.5px;color:var(--ink-faint);margin-top:8px;}

/* Link "Mais informações operacionais do hotel" (28ª rodada) — preenche o espaço vazio
   abaixo de Informações do Ativo quando a operação tem hotel_perf (hoje só Calçada).
   .locperf-link (35ª rodada, Residencial Jardins) reaproveita a mesma aparência. */
.hotel-link-row{margin-top:16px;padding-top:14px;border-top:1px solid var(--border-soft);text-align:center;}
/* .subpage-link (rodada de revisão geral de UI): estilo base compartilhado por TODOS os links
   de navegação pra sub-página do portal -- Ver quebra do cálculo, Ver obrigações, Ver regras de
   quórum, Ver tabela de integralizações, Ver abertura mês a mês, Ver tabela de unidades, e os
   2 de hotel/locação. Antes eram só texto azul que sublinhava no hover, sem nenhuma affordance
   de botão -- pedido explícito do usuário ("a interação de clique é muito amadora... [precisa]
   identificar fácil [que é clicável]"). Vira um chip/botão de verdade: fundo tintado, cantos
   arredondados, ícone de seta que "anda" no hover -- sem mudar NENHUMA classe/atributo que os
   listeners de clique já usam (.covcalc-link/.integralizacoes-link/.topics-link/.hotel-link/
   .locperf-link/.carteira-link/.unidades-link continuam existindo, só ganham .subpage-link
   como classe extra pro visual). Um único lugar pra manter todos os 8 links consistentes. */
.subpage-link{
  display:inline-flex;align-items:center;gap:6px;font-weight:600;text-decoration:none;
  color:var(--accent-strong);background:var(--accent-tint);border:1px solid transparent;
  border-radius:8px;cursor:pointer;
  transition:background .15s ease,color .15s ease,transform .15s ease,box-shadow .15s ease;
}
.subpage-link svg{transition:transform .15s ease;flex:0 0 auto;}
.subpage-link:hover{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);transform:translateY(-1px);}
.subpage-link:hover svg{transform:translateX(2px);}
.subpage-link:active{transform:translateY(0);}
.hotel-link-row .subpage-link{padding:9px 16px;font-size:12.5px;}

/* Link "Ver quebra do cálculo" num item de Acompanhamento (31ª rodada) — mesmo padrão do
   hotel-link, mas dentro do próprio card do covenant (item extra com _has_calc_subpage) --
   versão compacta do .subpage-link (cabe várias vezes dentro do painel Itens de
   Acompanhamento, um por covenant, sem dominar o card). */
.covitem-calclink{margin-top:8px;padding-top:8px;border-top:1px solid var(--border-soft);}
.covitem-calclink .subpage-link{padding:5px 11px;font-size:11.3px;}

/* Sub-página genérica de "tópicos" (piloto Calçada — Obrigações Pecuniárias / Quórum de
   Assembleias): lista de itens com label/texto/referência, ou seções com título+intro+lista
   ordenada. Reutilizável para qualquer operação/tema futuro que precise do mesmo padrão. */
.topics-fonte{font-size:11px;color:var(--ink-faint);margin-bottom:10px;line-height:1.5;}
/* 39ª rodada: aviso de premissa/estimativa (ex.: datas de vencimento calculadas, status
   pendente de confirmação) -- tom "warn" (mesma cor já usada pro chip "Verificar"), pra ficar
   claro visualmente que é uma estimativa a confirmar, não um dado fechado da planilha. */
.topics-nota{font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:9px 12px;margin-bottom:18px;line-height:1.5;}
.topicsec{margin-bottom:22px;}
.topicsec:last-child{margin-bottom:0;}
.topicsec-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border-soft);}
.topicsec-head h3{font-size:13px;color:var(--ink);font-family:var(--font-body);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.topicsec-ref{font-size:10.5px;color:var(--ink-faint);font-family:var(--font-mono);white-space:nowrap;}
.topicsec-intro{font-size:12.6px;color:var(--ink-muted);margin-bottom:10px;}
/* Caixa de destaque (39ª rodada) pra seção mais "crítica" de operar dentro do tópico (ex.:
   quórum qualificado de 90%) -- só uma variação visual do .topicsec, sem mudar a estrutura. */
.topicsec-highlight{background:var(--accent-tint);border:1px solid var(--accent-pale);border-radius:10px;padding:14px 16px 4px;}
.topicsec-highlight .topicsec-head{border-bottom-color:var(--accent-pale);}
/* Lista de itens de tópico (40ª rodada, redesenho; 41ª rodada, ajuste): cartões próprios
   (mesmo espírito visual de .assetcard/.topiccompare-card já usados no portal), numerados
   (facilita achar/apontar um item específico numa lista de 11), texto alinhado com o rótulo
   (recuo igual à largura do número). O canto superior direito do cartão segue o mesmo padrão
   já estipulado em .covitem-top: rótulo à esquerda, chip de status à direita -- a referência da
   cláusula desceu pra baixo do texto (ver .topicitem-ref), no mesmo estilo mono discreto usado
   nos cartões de .topiccompare. */
.topiclist{display:flex;flex-direction:column;gap:10px;}
.topicitem{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:10px;padding:13px 15px;}
.topicitem-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.topicitem-titlewrap{display:flex;align-items:flex-start;gap:10px;min-width:0;}
.topicitem-num{
  flex:0 0 auto;width:20px;height:20px;border-radius:50%;margin-top:1px;
  background:var(--accent-strong);color:var(--accent-ink);font-family:var(--font-mono);
  font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
.topicitem-label{font-size:13px;font-weight:600;color:var(--ink);line-height:1.35;}
.topicitem-text{font-size:12.6px;color:var(--ink-muted);line-height:1.55;padding-left:30px;}
/* .topicitem-dates (41ª rodada): mesma frase/estilo de .covitem-dates ("últ. atualização X ·
   próxima Y") -- pedido do usuário pra ficar igual ao padrão de Itens de Acompanhamento, em vez
   da pílula "Próximo vencimento" da versão anterior. */
.topicitem-dates{font-size:10.5px;color:var(--ink-faint);margin:6px 0 0 30px;font-family:var(--font-mono);}
/* .topicitem-ref: citação da cláusula, mesmo estilo mono discreto usado nos cartões de
   .topiccompare (1ª/2ª convocação). Na lista numerada (.topiclist) ganha o mesmo recuo de 30px
   do texto/datas pra alinhar com o rótulo; dentro de um .topiccompare-card (cartão pequeno e
   isolado, sem numeração) fica sem recuo extra. */
.topicitem-ref{font-size:10.5px;color:var(--ink-faint);font-family:var(--font-mono);margin-top:6px;}
.topiclist .topicitem-ref{margin-left:30px;}
/* Lista numerada com marcadores circulares (39ª rodada) no lugar do "1. 2. 3." padrão do
   navegador -- mais fácil de escanear numa lista de 8 itens (quórum qualificado). Contador
   próprio (counter-reset/counter-increment) porque a lista virou <li> sem list-style nativo. */
